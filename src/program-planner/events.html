<!doctype html>
<html lang="en-AU" data-app-name="Event Space Remediation" data-app-id="uos.horticulture.events" data-workspace-kind="EVT" data-owner="EVT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Event Space Remediation · U-OS</title>
  <link rel="icon" href="../shared/assets/uos-grid-arrow-favicon.svg" type="image/svg+xml">
  <script src="app-config.js"></script>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#173d2d}iframe{display:block}</style>
</head>
<body>
  <script>
    if (new URLSearchParams(window.location.search).get("factory-reset") === "1") {
      window.sessionStorage.setItem("uos.factory-reset-intent.EVT", String(Date.now()));
      var cleanUrl = new URL(window.location.href);
      cleanUrl.searchParams.delete("factory-reset");
      window.history.replaceState({}, "", cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
    }
  </script>
  <iframe id="workspace-frame" src="index.html?workspace=EVT" title="Event Space Remediation workspace"><a href="index.html?workspace=EVT">Open the Event Space Remediation workspace</a></iframe>
</body>
</html>
