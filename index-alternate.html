<!doctype html>
<html lang="en" data-suite-theme="light" data-suite-font="standard" data-app-name="Horticulture Operations Suite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#173d2d">
  <title>Horticulture Operations Suite by Josh Roberts</title>
  <link rel="icon" href="src/shared/assets/uos-grid-arrow-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/launcher.css">
  <style>
    /* This alternate artwork is 1248 × 832; keep the shared launcher unchanged. */
    .launcher-stage {
      width: min(100vw, calc(100dvh * 1.5));
      aspect-ratio: 3 / 2;
    }
  </style>
</head>
<body>
  <main class="launcher-stage" aria-labelledby="launcher-title">
    <h1 class="sr-only" id="launcher-title">City of Adelaide Horticulture Operations Suite</h1>
    <img class="launcher-art" src="src/shared/assets/Horticulture%20Operations%20Suite%20Backdrop.jpg" width="1248" height="832" alt="City of Adelaide Horticulture Operations Suite">

    <nav class="launcher-navigation" aria-label="Horticulture tools">
      <svg class="launcher-hotspots" viewBox="0 0 1248 832" preserveAspectRatio="none" aria-hidden="false">
        <a class="hotspot" href="src/program-planner/nsa.html" aria-label="Open Nature Strip Applications in Program Planner">
          <title>Nature Strip Applications — Program Planner</title>
          <rect x="360" y="351" width="173" height="172"></rect>
        </a>
        <a class="hotspot" href="src/program-planner/events.html" aria-label="Open Event Space Remediation in Program Planner">
          <title>Event Space Remediation — Program Planner</title>
          <rect x="533" y="351" width="190" height="172"></rect>
        </a>
        <a class="hotspot" href="overtime-planner-stage3/index.html" aria-label="Open Overtime Planner">
          <title>Overtime Planner</title>
          <rect x="723" y="351" width="172" height="172"></rect>
        </a>
      </svg>
    </nav>

    <div class="uos-signature" role="group" aria-label="U-OS, Urban Operating System. Made by Josh Roberts.">
      <img class="uos-signature__logo" src="src/shared/assets/uos-logo-forward-dark.svg" alt="" aria-hidden="true">
      <img class="uos-signature__dots" src="src/shared/assets/uos-logo-dot-column.svg" alt="" aria-hidden="true">
      <span class="uos-signature__name" aria-hidden="true"><span>Urban</span><span>Operating</span><span>System</span></span>
      <img class="uos-signature__dots" src="src/shared/assets/uos-logo-dot-column.svg" alt="" aria-hidden="true">
      <span class="uos-signature__credit"><span>Made</span><span>by</span><span>Josh Roberts</span></span>
    </div>
  </main>
</body>
</html>
