  <script data-source="js/components/forwardPlanner.js">
/* === INLINED: js/components/forwardPlanner.js === */
// Forward Planner Component
// Full feature parity: Saturday & Sunday day columns (plus holiday overtime),
// grouped Vacancy Rows, and Assigned Only toggle.
window.HortOpsForwardPlanner = {
  selectedStaffId: null,
  selectedDept: 'all',
  selectedTeam: 'all',
  searchTerm: '',
  hideUnassigned: true,
  filterDrawerOpen: false,
  selectedJobId: null,
  startWeek: 1,
  windowSize: (typeof window !== 'undefined' && window.innerWidth < 1600) ? 4 : 6,

  render: function(state) {
    var icons = window.HortOpsIcons;
    var dateUtils = window.HortOpsDateUtils;
    var esc = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtml) ? window.HortOpsSecurityUtils.escapeHtml : function(s) { return String(s || ''); };
    var escAttr = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtmlAttr) ? window.HortOpsSecurityUtils.escapeHtmlAttr : function(s) { return String(s || ''); };
    var staffList = state.staffList;
    var slots = state.slots;
    var allShifts = state.allShifts;
    var self = this;

    var hierarchy = window.HortOpsData.getDepartmentHierarchy(staffList);

    // 1. Resolve current week and auto-initialize
    var totalWeeks = (slots && slots.length) ? slots.length : 52;
    var currentWeekNum = (dateUtils && dateUtils.getCurrentWeekNumber) ? dateUtils.getCurrentWeekNumber(slots) : 36;
    if (!self.startWeekInitialized) {
      self.startWeek = Math.min(totalWeeks - self.windowSize + 1, Math.max(1, currentWeekNum));
      self.startWeekInitialized = true;
    }

    // Sliced slots in window
    var endWeek = Math.min(totalWeeks, self.startWeek + self.windowSize - 1);
    var visibleSlots = slots.filter(function(s) {
      return s.weekNumber >= self.startWeek && s.weekNumber <= endWeek;
    });
    var visibleWeekNumbers = new Set(visibleSlots.map(function(s) { return s.weekNumber; }));

    // 2. Build Slot Day Columns (Split into Saturday & Sunday, plus Friday / Monday if holiday)
    var slotDayMap = {};
    var totalActiveColumns = 0;

    visibleSlots.forEach(function(slot) {
      var satDate = slot.saturdayDate;
      var sunDate = slot.sundayDate;

      var satShifts = slot.shifts.filter(function(s) { return s.dayOfWeek === 'Saturday'; });
      var sunShifts = slot.shifts.filter(function(s) { return s.dayOfWeek === 'Sunday'; });
      var friShifts = slot.shifts.filter(function(s) { return s.dayOfWeek === 'Friday'; });
      var monShifts = slot.shifts.filter(function(s) { return s.dayOfWeek === 'Monday'; });
      var weekendShifts = slot.shifts.filter(function(s) { return s.dayOfWeek === 'Weekend'; });

      var satHoliday = slot.publicHolidays.find(function(h) { return h.date === satDate; });
      var sunHoliday = slot.publicHolidays.find(function(h) { return h.date === sunDate; });
      var friHoliday = slot.publicHolidays.find(function(h) { return h.date === slot.fridayDate; });
      var monHoliday = slot.publicHolidays.find(function(h) { return h.date === slot.mondayDate; });

      var days = [];

      // Friday Pre-Holiday overtime: ONLY show if it has scheduled jobs
      if (friShifts.length > 0) {
        days.push({
          day: 'Friday',
          dateStr: slot.fridayDate,
          label: dateUtils.formatDisplayDate(slot.fridayDate),
          holiday: friHoliday,
          availableShifts: friShifts,
          isFirstInWeekend: true,
          hasOvertime: true
        });
      }

      // Saturday: Core weekend column; only show holiday badge/styling if it has scheduled jobs
      var satHasJobs = satShifts.length > 0 || weekendShifts.length > 0;
      days.push({
        day: 'Saturday',
        dateStr: satDate,
        label: dateUtils.formatDisplayDate(satDate),
        holiday: satHasJobs ? satHoliday : undefined,
        availableShifts: satShifts.concat(weekendShifts),
        isFirstInWeekend: days.length === 0,
        hasOvertime: satHasJobs
      });

      // Sunday: Core weekend column; only show holiday badge/styling if it has scheduled jobs
      var sunHasJobs = sunShifts.length > 0 || weekendShifts.length > 0;
      days.push({
        day: 'Sunday',
        dateStr: sunDate,
        label: dateUtils.formatDisplayDate(sunDate),
        holiday: sunHasJobs ? sunHoliday : undefined,
        availableShifts: sunShifts.concat(weekendShifts),
        isFirstInWeekend: false,
        hasOvertime: sunHasJobs
      });

      // Monday Post-Holiday overtime: ONLY show if it has scheduled jobs
      if (monShifts.length > 0) {
        days.push({
          day: 'Monday',
          dateStr: slot.mondayDate,
          label: dateUtils.formatDisplayDate(slot.mondayDate),
          holiday: monHoliday,
          availableShifts: monShifts,
          isFirstInWeekend: false,
          hasOvertime: true
        });
      }

      slotDayMap[slot.weekNumber] = days;
      totalActiveColumns += days.length;
    });

    // 3. Build Staff Schedule Map (indexed by staffId -> weekNumber -> { satShifts, sunShifts, allShifts })
    var staffScheduleMap = {};
    allShifts.forEach(function(shift) {
      (shift.assignedStaffIds || []).forEach(function(staffId) {
        if (!staffScheduleMap[staffId]) staffScheduleMap[staffId] = {};
        if (!staffScheduleMap[staffId][shift.weekNumber]) {
          staffScheduleMap[staffId][shift.weekNumber] = {
            satShifts: [],
            sunShifts: [],
            allShifts: []
          };
        }
        var alloc = staffScheduleMap[staffId][shift.weekNumber];
        alloc.allShifts.push(shift);
        if (shift.dayOfWeek === 'Saturday') alloc.satShifts.push(shift);
        else if (shift.dayOfWeek === 'Sunday') alloc.sunShifts.push(shift);
      });
    });

    // 4. Calculate Vacancies across visible slots
    var visibleVacancies = [];
    visibleSlots.forEach(function(slot) {
      slot.shifts.forEach(function(shift) {
        if (self.selectedJobId && shift.jobId !== self.selectedJobId) return;
        var assignedCount = (shift.assignedStaffIds || []).length;
        var deficit = shift.crewSize - assignedCount;
        if (deficit > 0) {
          for (var i = 1; i <= deficit; i++) {
            visibleVacancies.push({
              id: 'vacancy-' + shift.shiftId + '-' + i,
              shift: shift,
              vacancyNumber: i,
              totalShiftVacancies: deficit
            });
          }
        }
      });
    });

    // 5. Filter Staff by Dept, Team, Search, and HideUnassigned
    var filteredStaff = staffList.filter(function(staff) {
      if (self.selectedDept !== 'all' && staff.department !== self.selectedDept) return false;
      if (self.selectedTeam !== 'all' && staff.team !== self.selectedTeam) return false;

      if (self.searchTerm) {
        var term = self.searchTerm.toLowerCase();
        var mName = (staff.name || '').toLowerCase().indexOf(term) !== -1;
        var mRole = (staff.role || '').toLowerCase().indexOf(term) !== -1;
        var mTeam = (staff.team || '').toLowerCase().indexOf(term) !== -1;
        if (!mName && !mRole && !mTeam) return false;
      }

      if (self.selectedJobId) {
        var staffWeeks = staffScheduleMap[staff.id];
        if (!staffWeeks) return false;
        var hasJobShiftInWindow = false;
        visibleWeekNumbers.forEach(function(wn) {
          var alloc = staffWeeks[wn];
          if (alloc && alloc.allShifts) {
            alloc.allShifts.forEach(function(s) {
              if (s.jobId === self.selectedJobId) hasJobShiftInWindow = true;
            });
          }
        });
        if (!hasJobShiftInWindow) return false;
      }

      if (self.hideUnassigned) {
        var staffWeeks = staffScheduleMap[staff.id];
        if (!staffWeeks) return false;
        var hasShiftInWindow = false;
        visibleWeekNumbers.forEach(function(wn) {
          var alloc = staffWeeks[wn];
          if (alloc && alloc.allShifts.length > 0) {
            hasShiftInWindow = true;
          }
        });
        return hasShiftInWindow;
      }

      return true;
    });

    // Count total assigned in window
    var totalAssignedInWindowCount = 0;
    staffList.forEach(function(staff) {
      var staffWeeks = staffScheduleMap[staff.id];
      if (staffWeeks) {
        var hasShift = false;
        visibleWeekNumbers.forEach(function(wn) {
          var alloc = staffWeeks[wn];
          if (alloc && alloc.allShifts.length > 0) hasShift = true;
        });
        if (hasShift) totalAssignedInWindowCount++;
      }
    });

    // 6. Optimal Grouping: Group Table Rows by Job / Shift across visible slots
    var tableRows = [];
    var placedStaffIds = new Set();
    var placedVacancyIds = new Set();

    // Collect all shifts in the visible slots (filtered by selectedJobId if active)
    var visibleShifts = [];
    visibleSlots.forEach(function(slot) {
      slot.shifts.forEach(function(sh) {
        if (!self.selectedJobId || sh.jobId === self.selectedJobId) {
          visibleShifts.push(sh);
        }
      });
    });

    // Group assigned staff and vacancies together by shift
    visibleShifts.forEach(function(shift) {
      var shiftAssignedStaff = [];
      (shift.assignedStaffIds || []).forEach(function(id) {
        var s = filteredStaff.find(function(item) { return item.id === id; });
        if (s) shiftAssignedStaff.push(s);
      });

      var shiftVacancies = visibleVacancies.filter(function(v) {
        return v.shift.shiftId === shift.shiftId && !placedVacancyIds.has(v.id);
      });

      var unplacedStaff = shiftAssignedStaff.filter(function(s) {
        return !placedStaffIds.has(s.id);
      });

      // Check if some teammates from this shift are ALREADY placed in tableRows
      var existingIndices = [];
      tableRows.forEach(function(row, idx) {
        if (row.type === 'staff' && (shift.assignedStaffIds || []).indexOf(row.staff.id) !== -1) {
          existingIndices.push(idx);
        }
      });

      var itemsToInsert = [];
      unplacedStaff.forEach(function(s) {
        itemsToInsert.push({ type: 'staff', staff: s });
        placedStaffIds.add(s.id);
      });
      shiftVacancies.forEach(function(v) {
        itemsToInsert.push({ type: 'vacancy', vacancy: v });
        placedVacancyIds.add(v.id);
      });

      if (itemsToInsert.length === 0) return;

      if (existingIndices.length > 0) {
        // Bridge crew shared across jobs: insert unplaced staff & vacancies directly adjacent
        // to the earliest teammate to maintain contiguous blocks of job cards
        var insertIdx = Math.min.apply(null, existingIndices);
        tableRows.splice.apply(tableRows, [insertIdx, 0].concat(itemsToInsert));
      } else {
        tableRows = tableRows.concat(itemsToInsert);
      }
    });

    // Add remaining filtered staff
    filteredStaff.forEach(function(staff) {
      if (!placedStaffIds.has(staff.id)) {
        tableRows.push({ type: 'staff', staff: staff });
        placedStaffIds.add(staff.id);
      }
    });

    // Fallback check for any vacancies not already inserted
    visibleVacancies.forEach(function(vac) {
      if (!placedVacancyIds.has(vac.id)) {
        tableRows.push({ type: 'vacancy', vacancy: vac });
        placedVacancyIds.add(vac.id);
      }
    });


    var ctx = {
      self: self,
      hierarchy: hierarchy,
      filteredStaff: filteredStaff,
      staffList: staffList,
      visibleVacancies: visibleVacancies,
      visibleSlots: visibleSlots,
      slotDayMap: slotDayMap,
      staffScheduleMap: staffScheduleMap,
      tableRows: tableRows,
      endWeek: endWeek,
      totalWeeks: totalWeeks,
      totalActiveColumns: totalActiveColumns,
      totalAssignedInWindowCount: totalAssignedInWindowCount,
      currentWeekNum: currentWeekNum,
      icons: icons,
      esc: esc,
      escAttr: escAttr
    };

    var toolbarHtml = window.HortOpsForwardPlannerControls ?
      window.HortOpsForwardPlannerControls.renderToolbar(ctx) : '';
    var theadHtml = window.HortOpsForwardPlannerHeader ?
      window.HortOpsForwardPlannerHeader.renderThead(ctx) : '';
    var tbodyRowsHtml = window.HortOpsForwardPlannerMatrix ?
      window.HortOpsForwardPlannerMatrix.renderTbody(ctx) : '';

    return toolbarHtml +
      '<div class="planner-table-wrapper">' +
        '<table class="planner-table">' +
          theadHtml +
          '<tbody>' +
            tbodyRowsHtml +
          '</tbody>' +
        '</table>' +
      '</div>';
  },


  handleDeptChange: function(val) {
    this.selectedDept = val;
    this.selectedTeam = 'all';
    window.HortOpsApp.renderCurrentView();
  },

  handleTeamChange: function(val) {
    this.selectedTeam = val;
    window.HortOpsApp.renderCurrentView();
  },

  handleSearch: function(val) {
    this.searchTerm = val;
    var activeEl = document.activeElement;
    var isSearchInput = activeEl && activeEl.tagName === 'INPUT' && activeEl.placeholder && activeEl.placeholder.indexOf('Search') !== -1;
    var selStart = isSearchInput ? activeEl.selectionStart : null;
    var selEnd = isSearchInput ? activeEl.selectionEnd : null;

    if (window.HortOpsApp) window.HortOpsApp.renderCurrentView();

    if (isSearchInput) {
      var contentMount = document.getElementById('view-content');
      if (contentMount) {
        var newInput = contentMount.querySelector('input[placeholder*="Search"]');
        if (newInput) {
          newInput.focus();
          if (selStart !== null && selEnd !== null) {
            newInput.setSelectionRange(selStart, selEnd);
          }
        }
      }
    }
  },

  toggleHideUnassigned: function() {
    // Deprecated in Offline15.2: Former 'Assigned Only' mode is now the permanent default view
    this.hideUnassigned = true;
    window.HortOpsApp.renderCurrentView();
  },

  toggleSelectStaff: function(staffId) {
    this.selectedStaffId = this.selectedStaffId === staffId ? null : staffId;
    window.HortOpsApp.renderCurrentView();
  },

  jumpToCurrentWeek: function() {
    var dateUtils = window.HortOpsDateUtils;
    var slots = (window.HortOpsApp && window.HortOpsApp.state) ? window.HortOpsApp.state.slots : [];
    var totalWeeks = (slots && slots.length) ? slots.length : 52;
    var currentWeekNum = (dateUtils && dateUtils.getCurrentWeekNumber) ? dateUtils.getCurrentWeekNumber(slots) : 36;
    this.startWeek = Math.min(totalWeeks - this.windowSize + 1, Math.max(1, currentWeekNum));
    window.HortOpsApp.renderCurrentView();
  },

  prevWeeks: function() {
    this.startWeek = Math.max(1, this.startWeek - this.windowSize);
    window.HortOpsApp.renderCurrentView();
  },

  nextWeeks: function() {
    var slots = (window.HortOpsApp && window.HortOpsApp.state) ? window.HortOpsApp.state.slots : [];
    var totalWeeks = (slots && slots.length) ? slots.length : 52;
    this.startWeek = Math.min(totalWeeks - this.windowSize + 1, this.startWeek + this.windowSize);
    window.HortOpsApp.renderCurrentView();
  },

  setWindowSize: function(sz) {
    this.windowSize = sz;
    window.HortOpsApp.renderCurrentView();
  },

  toggleFilterDrawer: function(forceState) {
    if (typeof forceState === 'boolean') {
      this.filterDrawerOpen = forceState;
    } else {
      this.filterDrawerOpen = !this.filterDrawerOpen;
    }
    window.HortOpsApp.renderCurrentView();
  },

  handleJobFilter: function(jobId) {
    if (this.selectedJobId === jobId) {
      this.selectedJobId = null;
    } else {
      this.selectedJobId = jobId;
    }
    window.HortOpsApp.renderCurrentView();
  },

  clearAllFilters: function() {
    this.selectedDept = 'all';
    this.selectedTeam = 'all';
    this.searchTerm = '';
    this.selectedJobId = null;
    window.HortOpsApp.renderCurrentView();
  }
};

  <script data-source="js/components/calendarView.js">
/* === INLINED: js/components/calendarView.js === */
// Monthly Operational Calendar View Component
window.HortOpsCalendarView = {
  selectedMonth: (new Date().getMonth() + 1),

  render: function(state) {
    var icons = window.HortOpsIcons;
    var dateUtils = window.HortOpsDateUtils;
    var slots = state.slots;
    var self = this;

    var esc = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtml) ? window.HortOpsSecurityUtils.escapeHtml : function(s) { return String(s || ''); };
    var escAttr = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtmlAttr) ? window.HortOpsSecurityUtils.escapeHtmlAttr : function(s) { return String(s || ''); };

    var currentMonthNum = new Date().getMonth() + 1;
    var currentWeekNum = (dateUtils && dateUtils.getCurrentWeekNumber) ? dateUtils.getCurrentWeekNumber(slots) : 36;

    var monthNames = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];

    var monthSlots = slots.filter(function(s) {
      return s.month === self.selectedMonth;
    });

    var monthNav = '<div style="display: flex; gap: 0.25rem; flex-wrap: wrap; align-items: center;">' +
      '<button class="btn btn-secondary" style="padding: 0.35rem 0.65rem; font-size: 12px; font-weight: 700; color: var(--emerald-700); margin-right: 0.25rem;" onclick="window.HortOpsCalendarView.setMonth(' + currentMonthNum + ')">Current Month</button>' +
      monthNames.map(function(name, idx) {
        var m = idx + 1;
        var isActive = self.selectedMonth === m;
        return '<button class="btn ' + (isActive ? 'btn-primary' : 'btn-secondary') + '" style="padding: 0.35rem 0.65rem; font-size: 13px;" onclick="window.HortOpsCalendarView.setMonth(' + m + ')">' +
          esc(name) +
        '</button>';
      }).join('') +
    '</div>';

    var weekendCardsHtml = monthSlots.map(function(slot) {
      var isCurrentWeek = slot.weekNumber === currentWeekNum;
      var currentWeekBadge = isCurrentWeek ? 
        '<span class="badge" style="background: #ecfdf5; color: #047857; border: 1px solid #6ee7b7; font-size: 10px; font-weight: 800; padding: 0.15rem 0.45rem; margin-left: 0.5rem; letter-spacing: 0.05em;">CURRENT WEEK</span>' : '';

      // Only display public holidays that have scheduled operations
      var activeHolidays = slot.publicHolidays.filter(function(h) {
        return slot.shifts.some(function(sh) {
          return sh.date === h.date || (sh.isPublicHoliday && sh.holidayName === h.name);
        });
      });

      var holidaysHtml = activeHolidays.map(function(h) {
        return '<span class="badge badge-amber" style="margin-left: 0.5rem;">' + icons.render('flag', 'w-3 h-3') + esc(h.name) + '</span>';
      }).join('');

      // Subdivide week row into individual day columns (Offline15.2 Day-Column Layout)
      var dayCols = [];
      var satDate = slot.saturdayDate;
      var sunDate = slot.sundayDate;

      // Check Friday (pre-holiday)
      var friDate = (dateUtils && typeof dateUtils.addDays === 'function') ? dateUtils.addDays(satDate, -1) : null;
      var hasFriShifts = friDate && slot.shifts.some(function(sh) { return sh.date === friDate; });
      var hasFriHoliday = friDate && (slot.publicHolidays || []).some(function(h) { return h.date === friDate; });
      if (hasFriShifts || hasFriHoliday) {
        dayCols.push({ date: friDate, dayName: 'Friday' });
      }

      // Saturday & Sunday
      dayCols.push({ date: satDate, dayName: 'Saturday' });
      dayCols.push({ date: sunDate, dayName: 'Sunday' });

      // Check Monday (post-holiday)
      var monDate = (dateUtils && typeof dateUtils.addDays === 'function') ? dateUtils.addDays(sunDate, 1) : null;
      var hasMonShifts = monDate && slot.shifts.some(function(sh) { return sh.date === monDate; });
      var hasMonHoliday = monDate && (slot.publicHolidays || []).some(function(h) { return h.date === monDate; });
      if (hasMonShifts || hasMonHoliday) {
        dayCols.push({ date: monDate, dayName: 'Monday' });
      }

      // Include any other non-standard shift dates
      slot.shifts.forEach(function(sh) {
        if (!dayCols.some(function(d) { return d.date === sh.date; })) {
          dayCols.push({ date: sh.date, dayName: sh.dayOfWeek || 'Overtime Day' });
        }
      });
      dayCols.sort(function(a, b) { return a.date.localeCompare(b.date); });

      var dayColsHtml = dayCols.map(function(dCol) {
        var dayShifts = slot.shifts.filter(function(sh) { return sh.date === dCol.date; });
        var dayHoliday = (slot.publicHolidays || []).find(function(h) { return h.date === dCol.date; });
        var holidayPill = dayHoliday ?
          '<span class="badge badge-slate" style="font-size: 10px; margin-left: 4px;">' + icons.render('flag', 'w-2.5 h-2.5') + esc(dayHoliday.name) + '</span>' : '';

        var dayCardsHtml = dayShifts.length === 0 ?
          '<div class="day-column-empty">— No shifts scheduled —</div>' :
          dayShifts.map(function(sh) {
            var assignedCount = (sh.assignedStaffIds || []).length;
            var isFull = assignedCount >= sh.crewSize;
            var crewConflictBadge = (sh.hasCrewConflict || (sh.crewIntegrityIssues && sh.crewIntegrityIssues.length > 0)) ?
              ('<span class="badge" style="font-size: 10px; margin-left: 4px; background: #fef2f2; color: #b91c1c; border: 1px solid #f87171;" title="' + escAttr((sh.crewIntegrityIssues && sh.crewIntegrityIssues[0]) ? sh.crewIntegrityIssues[0].message : 'Plant Operator Required') + '">⚠ Plant Op</span>') : '';

            var startStr = sh.startTime ? sh.startTime.split(' ')[0] : '';
            var durStr = (sh.durationHours !== undefined) ? (sh.durationHours + 'h') : '';
            var timeMeta = startStr && durStr ? (startStr + ' (' + durStr + ')') : (startStr || durStr);

            return '<div style="border: 1px solid var(--slate-200); border-radius: 6px; padding: 0.65rem 0.75rem; background: #ffffff; border-left: 4px solid ' + escAttr(sh.color || '#10b981') + '; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.03);" onclick="window.HortOpsApp.openStaffAssignModal(\'" + escAttr(sh.shiftId) + "\')">' +
              '<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;">' +
                '<span style="font-weight: 700; font-size: 12px; color: var(--slate-900); display: flex; align-items: center; gap: 4px; flex-wrap: wrap;">' + esc(sh.jobName) + crewConflictBadge + '</span>' +
                '<span class="badge ' + (isFull ? 'badge-emerald' : 'badge-amber') + '" style="font-size: 10px; flex-shrink: 0;">' + assignedCount + '/' + sh.crewSize + ' Crew</span>' +
              '</div>' +
              '<div style="font-size: 11px; color: var(--slate-500); margin-top: 0.25rem;">' +
                esc(timeMeta) +
              '</div>' +
              (sh.locationDetails ? ('<div style="font-size: 11px; color: var(--slate-400); margin-top: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">' + esc(sh.locationDetails) + '</div>') : '') +
            '</div>';
          }).join('');

        return '<div class="day-column">' +
          '<div class="day-column-header">' +
            '<div class="day-column-title">' +
              '<span class="day-column-name">' + esc(dCol.dayName) + '</span>' +
              '<span class="day-column-date">' + esc(dateUtils.formatDisplayDate(dCol.date)) + '</span>' +
              holidayPill +
            '</div>' +
            '<span class="badge badge-slate" style="font-size: 10px;">' + dayShifts.length + ' Ops</span>' +
          '</div>' +
          '<div class="day-column-body">' + dayCardsHtml + '</div>' +
        '</div>';
      }).join('');

      var shiftsHtml = '<div class="calendar-day-columns">' + dayColsHtml + '</div>';

      var cardBorder = isCurrentWeek ? 
        'margin-bottom: 1rem; border: 2px solid #059669; box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.15);' : 
        'margin-bottom: 1rem;';

      return '<div class="panel-card" style="' + cardBorder + '">' +
        '<div class="panel-header" style="background: ' + (isCurrentWeek ? '#f0fdf4' : 'var(--slate-100)') + ';">' +
          '<div style="display: flex; align-items: center; flex-wrap: wrap;">' +
            '<span style="font-weight: 800; color: var(--emerald-800); margin-right: 0.5rem;">Week ' + slot.weekNumber + '</span>' +
            '<span style="font-family: var(--font-mono); color: var(--slate-600);">' + dateUtils.formatDisplayWeekendRange(slot.saturdayDate, slot.sundayDate) + '</span>' +
            currentWeekBadge +
            holidaysHtml +
          '</div>' +
          '<div style="display: flex; gap: 0.5rem; align-items: center;">' +
            (slot.isOverloaded ? '<span class="badge badge-amber">' + icons.render('alertTriangle', 'w-3 h-3') + 'High Capacity Load</span>' : '') +
            '<span style="font-size: 13px; font-weight: 700; color: var(--slate-600);">' + slot.shifts.length + ' Operations • ' + slot.totalCrewHours + ' Crew Hours</span>' +
          '</div>' +
        '</div>' +
        '<div class="panel-body">' + shiftsHtml + '</div>' +
      '</div>';
    }).join('');

    return '<div class="panel-card">' +
      '<div class="panel-header">' +
        '<span class="panel-title">' + icons.render('calendar', 'w-4 h-4') + esc(monthNames[self.selectedMonth - 1]) + ' ' + state.currentYear + ' Operational Roster</span>' +
        monthNav +
      '</div>' +
      '<div class="panel-body">' + weekendCardsHtml + '</div>' +
    '</div>';
  },

  setMonth: function(m) {
    this.selectedMonth = m;
    window.HortOpsApp.renderCurrentView();
  }
};

</script>
    <script data-source="js/components/jobRegistry.js">
/* === INLINED: js/components/jobRegistry.js === */
// Job Registry View & Slideout Inspector Component
window.HortOpsJobRegistry = {
  selectedJobId: null,
  searchTerm: '',
  categoryFilter: 'all',
  teamFilter: 'all',
  statusFilter: 'all',

  render: function(state) {
    var icons = window.HortOpsIcons;
    var jobs = state.jobs;
    var self = this;
    function esc(str) {
      if (window.HortOpsSecurityUtils && typeof window.HortOpsSecurityUtils.escapeHtml === 'function') {
        return window.HortOpsSecurityUtils.escapeHtml(str);
      }
      if (str == null) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function escAttr(str) {
      if (window.HortOpsSecurityUtils && typeof window.HortOpsSecurityUtils.escapeHtmlAttr === 'function') {
        return window.HortOpsSecurityUtils.escapeHtmlAttr(str);
      }
      return esc(str);
    }

    // Filter jobs
    var filtered = jobs.filter(function(job) {
      var primary = job.primaryTeam || job.defaultTeam || '';
      if (self.categoryFilter !== 'all' && job.category !== self.categoryFilter) return false;
      if (self.statusFilter !== 'all' && job.status !== self.statusFilter) return false;

      if (self.teamFilter !== 'all') {
        var isMatch = primary === self.teamFilter ||
          job.secondaryTeam === self.teamFilter ||
          job.tertiaryTeam === self.teamFilter ||
          (job.exclusiveTeams || []).indexOf(self.teamFilter) !== -1;
        if (!isMatch) return false;
      }

      if (self.searchTerm) {
        var q = self.searchTerm.toLowerCase();
        var mName = job.name.toLowerCase().indexOf(q) !== -1;
        var mLoc = (job.locationDetails || '').toLowerCase().indexOf(q) !== -1;
        var mCat = job.category.toLowerCase().indexOf(q) !== -1;
        var mTeam = primary.toLowerCase().indexOf(q) !== -1;
        if (!mName && !mLoc && !mCat && !mTeam) return false;
      }

      return true;
    });

    // Unique teams for filter
    var allTeamsSet = new Set();
    jobs.forEach(function(j) {
      if (j.primaryTeam) allTeamsSet.add(j.primaryTeam);
      if (j.defaultTeam) allTeamsSet.add(j.defaultTeam);
      if (j.secondaryTeam) allTeamsSet.add(j.secondaryTeam);
      if (j.tertiaryTeam) allTeamsSet.add(j.tertiaryTeam);
      (j.exclusiveTeams || []).forEach(function(t) { allTeamsSet.add(t); });
    });
    var teamOptions = '<option value="all">All Teams</option>' + Array.from(allTeamsSet).sort().map(function(t) {
      return '<option value="' + escAttr(t) + '"' + (self.teamFilter === t ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('');

    var categories = ['Parklands', 'CBD Corridor', 'Arterial Road', 'Biodiversity', 'Sports Fields', 'Infrastructure'];
    var catOptions = '<option value="all">All Categories</option>' + categories.map(function(c) {
      return '<option value="' + escAttr(c) + '"' + (self.categoryFilter === c ? ' selected' : '') + '>' + esc(c) + '</option>';
    }).join('');

    // Table rows
    var selectedJob = jobs.find(function(j) { return j.id === self.selectedJobId; });

    var rowsHtml = filtered.length === 0 ?
      '<tr><td colspan="8" style="text-align: center; padding: 2.5rem; color: var(--slate-400);">No jobs match the active search and filter criteria.</td></tr>' :
      filtered.map(function(job) {
        var primary = job.primaryTeam || job.defaultTeam || 'Unassigned';
        var isSelected = self.selectedJobId === job.id;

        var exclusiveTag = (job.isExclusiveTeams && (job.exclusiveTeams || []).length > 0) ?
          '<span class="badge badge-amber" style="font-size: 11px; margin-left: 4px;" title="Exclusive to: ' + escAttr(job.exclusiveTeams.join(', ')) + '">' +
            icons.render('lock', 'w-2.5 h-2.5') + 'Exclusive (' + job.exclusiveTeams.length + ')' +
          '</span>' : '';

        var prefPills = '';
        if (job.secondaryTeam || job.tertiaryTeam) {
          prefPills = '<div style="display: flex; gap: 4px; margin-top: 2px;">' +
            (job.secondaryTeam ? '<span class="badge badge-slate" style="font-size: 11px;">2nd: ' + esc(job.secondaryTeam) + '</span>' : '') +
            (job.tertiaryTeam ? '<span class="badge badge-slate" style="font-size: 11px;">3rd: ' + esc(job.tertiaryTeam) + '</span>' : '') +
          '</div>';
        }

        var cadenceHtml = '';
        if (job.frequencyType === 'recurring_weeks') {
          cadenceHtml = '<span class="badge badge-emerald">Every ' + job.intervalWeeks + ' wks</span>';
        } else if (job.frequencyType === 'annual') {
          cadenceHtml = '<span class="badge badge-sky">Annual</span>';
        } else {
          cadenceHtml = '<span class="badge badge-purple">One-Off</span>';
        }

        return '<tr style="cursor: pointer; background-color: ' + (isSelected ? 'var(--emerald-50)' : 'transparent') + ';" onclick="window.HortOpsJobRegistry.selectJob(\'' + job.id + '\')">' +
          '<td style="padding: 0.6rem 0.8rem;">' +
            '<div style="display: flex; align-items: center; gap: 0.5rem;">' +
              '<span style="width: 10px; height: 10px; border-radius: 50%; background: ' + (job.color || '#10b981') + '; shrink: 0;"></span>' +
              '<div>' +
                '<div style="font-weight: 700; color: var(--slate-900);">' + esc(job.name) + '</div>' +
                '<div style="font-size: 12px; color: var(--slate-500);">' + esc(job.locationDetails || '') + '</div>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td><span class="badge badge-slate">' + esc(job.category) + '</span></td>' +
          '<td>' + cadenceHtml + '</td>' +
          '<td>' +
            '<div style="display: flex; align-items: center; flex-wrap: wrap;">' +
              '<span style="font-weight: 700; color: var(--slate-800);">' + esc(primary) + '</span>' +
              exclusiveTag +
            '</div>' +
            prefPills +
            '<div style="font-size: 12px; color: var(--slate-400);">' + esc(job.defaultDepartment || '') + '</div>' +
          '</td>' +
          '<td style="text-align: center; font-weight: 600;">' + job.crewSize + (job.plantOperatorRequired ? ' <span class="badge badge-amber" style="font-size: 9px; padding: 1px 3px;" title="Plant Operator Required">Plant Op</span>' : '') + '</td>' +
          '<td style="text-align: center; color: var(--slate-600);">' + job.durationHours + 'h @ ' + job.startTime + '</td>' +
          '<td>' +
            '<button class="badge ' + (job.status === 'active' ? 'badge-emerald' : 'badge-slate') + '" style="cursor: pointer;" onclick="event.stopPropagation(); window.HortOpsJobRegistry.toggleStatus(\'' + job.id + '\')">' +
              job.status +
            '</button>' +
          '</td>' +
          '<td style="text-align: right; padding-right: 0.75rem;">' +
            '<button class="btn btn-secondary" style="padding: 0.25rem 0.4rem; margin-right: 4px;" onclick="event.stopPropagation(); window.HortOpsApp.openEditJobModal(\'' + job.id + '\')" title="Edit Job">' +
              icons.render('edit', 'w-3 h-3') +
            '</button>' +
            '<button class="btn btn-danger" style="padding: 0.25rem 0.4rem;" onclick="event.stopPropagation(); window.HortOpsJobRegistry.deleteJob(\'' + job.id + '\')" title="Delete Job">' +
              icons.render('trash', 'w-3 h-3') +
            '</button>' +
          '</td>' +
        '</tr>';
      }).join('');

    // Slideout drawer HTML
    var drawerHtml = selectedJob ?
      '<div class="slideout-drawer">' +
        '<div class="modal-header">' +
          '<div style="display: flex; align-items: center; gap: 0.5rem;">' +
            '<span style="width: 12px; height: 12px; border-radius: 50%; background: ' + (selectedJob.color || '#10b981') + ';"></span>' +
            '<h3 style="font-size: 16px; font-weight: 800; color: var(--slate-900);">' + esc(selectedJob.name) + '</h3>' +
          '</div>' +
          '<button class="btn btn-secondary" style="padding: 0.25rem 0.4rem;" onclick="window.HortOpsJobRegistry.selectJob(null)">' + icons.render('x', 'w-4 h-4') + '</button>' +
        '</div>' +

        '<div style="padding: 1.25rem; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 1rem;">' +
          '<div style="background: var(--slate-50); border: 1px solid var(--slate-200); border-radius: 6px; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.4rem;">' +
            '<div style="display: flex; justify-content: space-between;"><span style="color: var(--slate-500);">Category:</span><span style="font-weight: 700;">' + esc(selectedJob.category) + '</span></div>' +
            '<div style="display: flex; justify-content: space-between;"><span style="color: var(--slate-500);">Primary Team:</span><span style="font-weight: 700; color: var(--emerald-800);">' + esc(selectedJob.primaryTeam || selectedJob.defaultTeam || 'Unassigned') + '</span></div>' +
            (selectedJob.secondaryTeam ? '<div style="display: flex; justify-content: space-between;"><span style="color: var(--slate-500);">2nd Preference:</span><span style="font-weight: 600;">' + esc(selectedJob.secondaryTeam) + '</span></div>' : '') +
            (selectedJob.tertiaryTeam ? '<div style="display: flex; justify-content: space-between;"><span style="color: var(--slate-500);">3rd Preference:</span><span style="font-weight: 600;">' + esc(selectedJob.tertiaryTeam) + '</span></div>' : '') +
            '<div style="display: flex; justify-content: space-between; align-items: center;"><span style="color: var(--slate-500);">Exclusive Choices:</span>' +
              (selectedJob.isExclusiveTeams && (selectedJob.exclusiveTeams || []).length > 0 ?
                '<span class="badge badge-amber">' + icons.render('lock', 'w-2.5 h-2.5') + esc(selectedJob.exclusiveTeams.join(', ')) + '</span>' :
                '<span style="color: var(--slate-500);">None (Open to all staff)</span>') +
            '</div>' +
            '<div style="display: flex; justify-content: space-between;"><span style="color: var(--slate-500);">Crew Required:</span><span style="font-weight: 700;">' + selectedJob.crewSize + ' Staff</span></div>' +
            '<div style="display: flex; justify-content: space-between;"><span style="color: var(--slate-500);">Duration:</span><span style="font-weight: 700;">' + selectedJob.durationHours + ' Hours @ ' + selectedJob.startTime + '</span></div>' +
            '<div style="display: flex; justify-content: space-between; align-items: center;"><span style="color: var(--slate-500);">Plant Operator:</span>' +
              (selectedJob.plantOperatorRequired ? '<span class="badge badge-amber" style="font-weight: 700;">Required</span>' : '<span style="color: var(--slate-400);">Not Required</span>') +
            '</div>' +
          '</div>' +

          '<div>' +
            '<div style="font-weight: 700; font-size: 13px; text-transform: uppercase; color: var(--slate-600); margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.3rem;">' +
              icons.render('mapPin', 'w-3.5 h-3.5') + 'Location & Precinct' +
            '</div>' +
            '<div style="background: var(--slate-50); border: 1px solid var(--slate-200); border-radius: 6px; padding: 0.65rem; font-size: 13px; color: var(--slate-700);">' +
              esc(selectedJob.locationDetails || 'No location details provided.') +
            '</div>' +
          '</div>' +

          '<div>' +
            '<div style="font-weight: 700; font-size: 13px; text-transform: uppercase; color: var(--slate-600); margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.3rem;">' +
              icons.render('alertTriangle', 'w-3.5 h-3.5') + 'Regulatory Permits Required' +
            '</div>' +
            '<div style="display: flex; flex-wrap: wrap; gap: 0.35rem;">' +
              (selectedJob.requiresWZTM ? '<span class="badge badge-amber" style="font-weight: 700;">⚠ Work Zone Traffic Management (WZTM)</span>' : '') +
              (selectedJob.requiresTPO ? '<span class="badge" style="background: #f3e8ff; color: #7e22ce; border: 1px solid #d8b4fe; font-weight: 700;">⚠ Tram Protection Order (TPO)</span>' : '') +
              (!selectedJob.requiresWZTM && !selectedJob.requiresTPO ? '<span style="color: var(--slate-400); font-size: 12px;">No special regulatory corridor permits required</span>' : '') +
            '</div>' +
          '</div>' +

          '<div style="margin-top: auto; padding-top: 1rem;">' +
            '<button class="btn btn-primary" style="width: 100%;" onclick="window.HortOpsApp.openEditJobModal(\'' + selectedJob.id + '\')">' +
              icons.render('edit', 'w-3.5 h-3.5') + 'Edit Job Specifications' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>' : '';

    return '<div class="panel-card">' +
      // Filter Toolbar
      '<div class="panel-header">' +
        '<div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">' +
          '<input type="text" class="form-input" style="width: 220px;" placeholder="Search jobs, location, team..." value="' + escAttr(self.searchTerm || '') + '" oninput="window.HortOpsJobRegistry.setSearch(this.value)" />' +
          '<select class="form-select" style="width: 160px;" onchange="window.HortOpsJobRegistry.setCategory(this.value)">' + catOptions + '</select>' +
          '<select class="form-select" style="width: 160px;" onchange="window.HortOpsJobRegistry.setTeam(this.value)">' + teamOptions + '</select>' +
          '<select class="form-select" style="width: 130px;" onchange="window.HortOpsJobRegistry.setStatus(this.value)">' +
            '<option value="all"' + (self.statusFilter === 'all' ? ' selected' : '') + '>All Statuses</option>' +
            '<option value="active"' + (self.statusFilter === 'active' ? ' selected' : '') + '>Active</option>' +
            '<option value="inactive"' + (self.statusFilter === 'inactive' ? ' selected' : '') + '>Inactive</option>' +
          '</select>' +
        '</div>' +

        '<div style="display: flex; align-items: center; gap: 0.5rem;">' +
          '<span style="font-size: 13px; color: var(--slate-500);">' + filtered.length + ' of ' + jobs.length + ' jobs</span>' +
          '<button class="btn btn-primary" onclick="window.HortOpsApp.openAddJobModal()">' +
            icons.render('plus', 'w-3.5 h-3.5') + 'New Job' +
          '</button>' +
        '</div>' +
      '</div>' +

      // Table
      '<div style="overflow-x: auto;">' +
        '<table class="planner-table" style="min-width: 1000px;">' +
          '<thead><tr>' +
            '<th style="width: 260px;">Job Name & Location</th>' +
            '<th style="width: 130px;">Category</th>' +
            '<th style="width: 120px;">Cadence</th>' +
            '<th style="width: 220px;">Team Suitability & Exclusive</th>' +
            '<th style="width: 80px; text-align: center;">Crew</th>' +
            '<th style="width: 130px; text-align: center;">Duration</th>' +
            '<th style="width: 90px;">Status</th>' +
            '<th style="width: 100px; text-align: right;">Actions</th>' +
          '</tr></thead>' +
          '<tbody>' + rowsHtml + '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>' +
    drawerHtml;
  },

  selectJob: function(jobId) {
    this.selectedJobId = jobId;
    window.HortOpsApp.renderCurrentView();
  },

  setSearch: function(val) {
    this.searchTerm = val;
    var activeEl = document.activeElement;
    var isSearchInput = activeEl && activeEl.tagName === 'INPUT' && activeEl.placeholder && activeEl.placeholder.indexOf('Search') !== -1;
    var selStart = isSearchInput ? activeEl.selectionStart : null;
    var selEnd = isSearchInput ? activeEl.selectionEnd : null;

    window.HortOpsApp.renderCurrentView();

    if (isSearchInput) {
      var contentMount = document.getElementById('content-mount');
      if (contentMount) {
        var newInput = contentMount.querySelector('input[placeholder*="Search"]');
        if (newInput) {
          newInput.focus();
          if (selStart !== null && selEnd !== null) {
            newInput.setSelectionRange(selStart, selEnd);
          }
        }
      }
    }
  },

  setCategory: function(val) {
    this.categoryFilter = val;
    window.HortOpsApp.renderCurrentView();
  },

  setTeam: function(val) {
    this.teamFilter = val;
    window.HortOpsApp.renderCurrentView();
  },

  setStatus: function(val) {
    this.statusFilter = val;
    window.HortOpsApp.renderCurrentView();
  },

  toggleStatus: function(jobId) {
    var state = window.HortOpsApp.state;
    var job = state.jobs.find(function(j) { return j.id === jobId; });
    if (job) {
      var proposedJob = Object.assign({}, job, {
        status: job.status === 'active' ? 'inactive' : 'active'
      });
      var saveRes = window.HortOpsApp.saveJob(proposedJob);
      if (!saveRes || !saveRes.success) {
        if (saveRes && saveRes.error) {
          alert(saveRes.error);
        }
      }
    }
  },

  deleteJob: function(jobId) {
    if (confirm('Are you sure you want to delete this job definition?')) {
      window.HortOpsApp.deleteJob(jobId);
    }
  }
};

</script>

// Keep the legacy Job Registry renderer intact while adding allocation-reset entry points.
(function() {
 var registry = window.HortOpsJobRegistry;
 if (!registry || typeof registry.render !== 'function') return;
 registry.openReset = function(jobId) {
  if (window.HortOpsJobResetModal && typeof window.HortOpsJobResetModal.open === 'function') window.HortOpsJobResetModal.open(jobId);
 };
 var originalRender = registry.render;
 registry.render = function(state) {
  var html = originalRender.call(this, state);
  // Insert a compact reset control immediately before each destructive row action.
  html = html.replace(/(<button class="btn btn-danger" style="padding: 0\.25rem 0\.4rem;" onclick="event\.stopPropagation\(\); window\.HortOpsJobRegistry\.deleteJob\('([^']+)'\)" title="Delete Job">)/g,
   '<button class="btn btn-secondary" style="padding: 0.25rem 0.45rem; margin-right: 4px;" onclick="event.stopPropagation(); window.HortOpsJobRegistry.openReset(\'$2\')" title="Reset allocations" aria-label="Reset allocations">↻ <span>Reset</span></button>$1');
  // The drawer receives the same command with an explicit label.
  html = html.replace(/(Edit Job Specifications<\/button>)/,
   '$1<button class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem;" onclick="window.HortOpsJobRegistry.openReset(\'' + (this.selectedJobId || '') + '\')">Reset allocations</button>');
  html = html.replace('width: 100px; text-align: right;">Actions</th>', 'width: 150px; text-align: right;">Actions</th>');
  return html;
 };
})();

</script>

/* === INLINED: js/components/staffRegistry.js === */
// Workforce Directory Component
window.HortOpsStaffRegistry = {
  searchTerm: '',
  selectedDept: 'all',
  selectedTeam: 'all',
  selectedStatus: 'all',

  render: function(state) {
    var icons = window.HortOpsIcons;
    var staffList = state.staffList;
    var hierarchy = window.HortOpsData.getDepartmentHierarchy(staffList);
    var self = this;

    function esc(str) {
      if (window.HortOpsSecurityUtils && typeof window.HortOpsSecurityUtils.escapeHtml === 'function') {
        return window.HortOpsSecurityUtils.escapeHtml(str);
      }
      if (str == null) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function escAttr(str) {
      if (window.HortOpsSecurityUtils && typeof window.HortOpsSecurityUtils.escapeHtmlAttr === 'function') {
        return window.HortOpsSecurityUtils.escapeHtmlAttr(str);
      }
      return esc(str);
    }

    var filtered = staffList.filter(function(staff) {
      var s = staff.status || 'active';
      if (self.selectedStatus === 'active' && s !== 'active') return false;
      if (self.selectedStatus === 'departed' && s !== 'departed') return false;
      if (self.selectedStatus === 'inactive' && s !== 'inactive') return false;
      if (self.selectedStatus === 'on_leave' && s !== 'on_leave') return false;
      if (self.selectedStatus === 'temporarily_unavailable' && s !== 'temporarily_unavailable') return false;
      if (self.selectedDept !== 'all' && staff.department !== self.selectedDept) return false;
      if (self.selectedTeam !== 'all' && staff.team !== self.selectedTeam) return false;

      if (self.searchTerm) {
        var q = self.searchTerm.toLowerCase();
        var mName = staff.name.toLowerCase().indexOf(q) !== -1;
        var mId = staff.id.toLowerCase().indexOf(q) !== -1;
        var mEmail = (staff.email || '').toLowerCase().indexOf(q) !== -1;
        var mRole = (staff.role || '').toLowerCase().indexOf(q) !== -1;
        var mTeam = (staff.team || '').toLowerCase().indexOf(q) !== -1;
        var mCrew = (staff.crew || '').toLowerCase().indexOf(q) !== -1;
        var mDept = (staff.department || '').toLowerCase().indexOf(q) !== -1;
        if (!mName && !mId && !mEmail && !mRole && !mTeam && !mCrew && !mDept) return false;
      }

      return true;
    });

    var deptOptions = '<option value="all">All Departments</option>' + hierarchy.map(function(d) {
      return '<option value="' + escAttr(d.name) + '"' + (self.selectedDept === d.name ? ' selected' : '') + '>' + esc(d.name) + ' (' + d.totalStaff + ')</option>';
    }).join('');

    var teamsList = [];
    hierarchy.forEach(function(d) {
      if (self.selectedDept === 'all' || d.name === self.selectedDept) {
        d.teams.forEach(function(t) { teamsList.push(t); });
      }
    });

    var teamOptions = '<option value="all">All Teams</option>' + teamsList.map(function(t) {
      return '<option value="' + escAttr(t.name) + '"' + (self.selectedTeam === t.name ? ' selected' : '') + '>' + esc(t.name) + ' (' + t.count + ')</option>';
    }).join('');

    var statusOptions = '<option value="all"' + (self.selectedStatus === 'all' ? ' selected' : '') + '>All Statuses</option>' +
      '<option value="active"' + (self.selectedStatus === 'active' ? ' selected' : '') + '>Active Only</option>' +
      '<option value="departed"' + (self.selectedStatus === 'departed' ? ' selected' : '') + '>Departed Only</option>' +
      '<option value="inactive"' + (self.selectedStatus === 'inactive' ? ' selected' : '') + '>Inactive Only</option>' +
      '<option value="on_leave"' + (self.selectedStatus === 'on_leave' ? ' selected' : '') + '>On Leave Only</option>' +
      '<option value="temporarily_unavailable"' + (self.selectedStatus === 'temporarily_unavailable' ? ' selected' : '') + '>Unavailable Only</option>';

    var rowsHtml = filtered.map(function(staff) {
      var empStatus = staff.status || 'active';
      var statusBadge = '';
      if (empStatus === 'departed') {
        statusBadge = '<span class="badge" style="background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; font-size: 11px; font-weight: 700;">Departed</span>';
      } else if (empStatus === 'inactive') {
        statusBadge = '<span class="badge" style="background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; font-size: 11px; font-weight: 700;">Inactive</span>';
      } else if (empStatus === 'on_leave') {
        statusBadge = '<span class="badge badge-amber" style="font-size: 11px; font-weight: 700;">On Leave</span>';
      } else if (empStatus === 'temporarily_unavailable') {
        statusBadge = '<span class="badge" style="background: #fef3c7; color: #92400e; border: 1px solid #fde68a; font-size: 11px; font-weight: 700;">Unavailable</span>';
      } else {
        statusBadge = '<span class="badge badge-emerald" style="font-size: 11px;">Active</span>';
      }

      var isExempt = (empStatus === 'active') && !!staff.isOvertimeExempt;
      var otStatusHtml = '';
      if (empStatus === 'departed' || empStatus === 'inactive') {
        otStatusHtml = '<span class="badge" style="background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; font-size: 11px;">Ineligible</span>';
      } else if (empStatus === 'on_leave') {
        otStatusHtml = '<span class="badge badge-amber" style="font-size: 11px;">On Leave</span>';
      } else if (empStatus === 'temporarily_unavailable') {
        otStatusHtml = '<span class="badge" style="background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; font-size: 11px;">Unavailable</span>';
      } else if (isExempt) {
        var dateNote = '';
        if (staff.exemptionStartDate && staff.exemptionEndDate) {
          dateNote = ' (' + staff.exemptionStartDate + ' to ' + staff.exemptionEndDate + ')';
        } else if (staff.exemptionStartDate) {
          dateNote = ' (from ' + staff.exemptionStartDate + ')';
        } else if (staff.exemptionEndDate) {
          dateNote = ' (until ' + staff.exemptionEndDate + ')';
        } else {
          dateNote = ' (Indefinite)';
        }
        var tip = 'Overtime Exempt' + dateNote + (staff.exemptionReason ? ': ' + staff.exemptionReason : '');
        otStatusHtml = '<span class="badge" style="background: #f3e8ff; color: #7e22ce; border: 1px solid #d8b4fe; font-size: 11px; font-weight: 700;" title="' + escAttr(tip) + '">Exempt' + (staff.exemptionStartDate ? '*' : '') + '</span>';
      } else {
        otStatusHtml = '<span class="badge badge-emerald" style="font-size: 11px;">Available</span>';
      }

      var actionHtml = '<button type="button" class="btn btn-secondary" style="padding: 0.2rem 0.55rem; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 0.25rem; border-color: #cbd5e1; background: #ffffff;" onclick="event.stopPropagation(); window.HortOpsStaffExemptionModal.open(\'' + escAttr(staff.id) + '\')" title="Edit Overtime Exemption">' +
        icons.render('edit', 'w-3 h-3 text-slate-500') +
        '<span>Edit</span>' +
      '</button>';

      return '<tr>' +
        '<td style="padding: 0.6rem 0.8rem;">' +
          '<div style="display: flex; align-items: center; gap: 0.5rem;">' +
            '<span style="width: 10px; height: 10px; border-radius: 50%; background: ' + (staff.avatarColor || '#10b981') + '; shrink: 0;"></span>' +
            '<div>' +
              '<div style="font-weight: 700; color: var(--slate-900);">' + esc(staff.name) + '</div>' +
              '<div style="font-size: 12px; color: var(--slate-400);">' + esc(staff.email || '') + '</div>' +
            '</div>' +
          '</div>' +
        '</td>' +
        '<td>' + esc(staff.department) + '</td>' +
        '<td><span style="font-weight: 600;">' + esc(staff.team) + '</span></td>' +
        '<td><span style="color: var(--slate-700); font-size: 12px;">' + esc(staff.crew || staff.team) + '</span></td>' +
        '<td>' + esc(staff.role) + '</td>' +
        '<td>' + (staff.isPlantOperator ? '<span class="badge badge-amber">' + icons.render('check', 'w-2.5 h-2.5') + 'Certified Operator</span>' : '<span style="color: var(--slate-400); font-size: 12px;">—</span>') + '</td>' +
        '<td><span class="badge badge-slate" style="font-size: 11px;">' + esc(staff.userType || 'App') + '</span></td>' +
        '<td>' + statusBadge + '</td>' +
        '<td>' + otStatusHtml + '</td>' +
        '<td style="text-align: center;">' + actionHtml + '</td>' +
      '</tr>';
    }).join('');

    return '<div class="panel-card">' +
      '<div class="panel-header">' +
        '<div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">' +
          '<input type="text" class="form-input" style="width: 240px;" placeholder="Search name, ID, team, crew, role..." value="' + escAttr(self.searchTerm || '') + '" oninput="window.HortOpsStaffRegistry.setSearch(this.value)" />' +
          '<select class="form-select" style="width: 180px;" onchange="window.HortOpsStaffRegistry.setDept(this.value)">' + deptOptions + '</select>' +
          '<select class="form-select" style="width: 180px;" onchange="window.HortOpsStaffRegistry.setTeam(this.value)">' + teamOptions + '</select>' +
          '<select class="form-select" style="width: 140px;" onchange="window.HortOpsStaffRegistry.setStatus(this.value)">' + statusOptions + '</select>' +
        '</div>' +
        '<span style="font-size: 13px; color: var(--slate-500);">' + filtered.length + ' of ' + staffList.length + ' personnel</span>' +
      '</div>' +

      '<div style="overflow-x: auto;">' +
        '<table class="planner-table">' +
          '<thead><tr>' +
            '<th style="width: 230px;">Employee</th>' +
            '<th style="width: 150px;">Department</th>' +
            '<th style="width: 140px;">Team / Unit</th>' +
            '<th style="width: 130px;">Crew / Depot</th>' +
            '<th style="width: 120px;">Role</th>' +
            '<th style="width: 130px;">Plant Operator</th>' +
            '<th style="width: 90px;">User Type</th>' +
            '<th style="width: 100px;">Status</th>' +
            '<th style="width: 100px;">Overtime</th>' +
            '<th style="width: 80px; text-align: center;">Action</th>' +
          '</tr></thead>' +
          '<tbody>' + rowsHtml + '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';
  },

  setSearch: function(val) {
    this.searchTerm = val;
    var activeEl = document.activeElement;
    var isSearchInput = activeEl && activeEl.tagName === 'INPUT' && activeEl.placeholder && activeEl.placeholder.indexOf('Search') !== -1;
    var selStart = isSearchInput ? activeEl.selectionStart : null;
    var selEnd = isSearchInput ? activeEl.selectionEnd : null;

    window.HortOpsApp.renderCurrentView();

    if (isSearchInput) {
      var contentMount = document.getElementById('content-mount');
      if (contentMount) {
        var newInput = contentMount.querySelector('input[placeholder*="Search"]');
        if (newInput) {
          newInput.focus();
          if (selStart !== null && selEnd !== null) {
            newInput.setSelectionRange(selStart, selEnd);
          }
        }
      }
    }
  },

  setDept: function(val) {
    this.selectedDept = val;
    this.selectedTeam = 'all';
    window.HortOpsApp.renderCurrentView();
  },

  setTeam: function(val) {
    this.selectedTeam = val;
    window.HortOpsApp.renderCurrentView();
  },

  setStatus: function(val) {
    this.selectedStatus = val;
    window.HortOpsApp.renderCurrentView();
  }
};

</script>

// Peak Weekends & Clashes Component
window.HortOpsPeakWeekends = {
  render: function(state) {
    var icons = window.HortOpsIcons;
    var dateUtils = window.HortOpsDateUtils;
    var slots = state.slots;

    var esc = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtml) ? window.HortOpsSecurityUtils.escapeHtml : function(s) { return String(s || ''); };
    var escAttr = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtmlAttr) ? window.HortOpsSecurityUtils.escapeHtmlAttr : function(s) { return String(s || ''); };

    var overloadedSlots = slots.filter(function(s) {
      return s.isOverloaded || s.hasArterialConflict || s.publicHolidays.some(function(h) { return s.shifts.some(function(sh) { return sh.date === h.date; }); });
    });

    var cardsHtml = overloadedSlots.length === 0 ?
      '<div style="text-align: center; padding: 3rem; color: var(--emerald-700); font-weight: 700;">' +
        icons.render('checkCircle', 'w-8 h-8 text-emerald-600', 'style="margin: 0 auto 0.5rem auto;"') +
        '<div>All 52 weekends within safe operational capacity limits. No scheduling clashes detected.</div>' +
      '</div>' :
      overloadedSlots.map(function(slot) {
        var badges = [];
        if (slot.isOverloaded) badges.push('<span class="badge badge-amber">' + icons.render('alertTriangle', 'w-3 h-3') + 'Shift Load (' + slot.shifts.length + ' Ops)</span>');
        if (slot.hasArterialConflict) badges.push('<span class="badge badge-amber">' + icons.render('alertTriangle', 'w-3 h-3') + 'Arterial Road Conflict</span>');
        var activeHolidays = slot.publicHolidays.filter(function(h) {
          return slot.shifts.some(function(sh) { return sh.date === h.date; });
        });
        if (activeHolidays.length > 0) badges.push('<span class="badge badge-slate">' + icons.render('flag', 'w-3 h-3') + esc(activeHolidays[0].name) + '</span>');

        // Subdivide overloaded week into day columns (Offline15.2 Day-Column Layout)
        var dayCols = [];
        var satDate = slot.saturdayDate;
        var sunDate = slot.sundayDate;

        // Check Friday
        var friDate = (dateUtils && typeof dateUtils.addDays === 'function') ? dateUtils.addDays(satDate, -1) : null;
        var hasFriShifts = friDate && slot.shifts.some(function(sh) { return sh.date === friDate; });
        var hasFriHoliday = friDate && (slot.publicHolidays || []).some(function(h) { return h.date === friDate; });
        if (hasFriShifts || hasFriHoliday) {
          dayCols.push({ date: friDate, dayName: 'Friday' });
        }

        // Saturday & Sunday
        dayCols.push({ date: satDate, dayName: 'Saturday' });
        dayCols.push({ date: sunDate, dayName: 'Sunday' });

        // Check Monday
        var monDate = (dateUtils && typeof dateUtils.addDays === 'function') ? dateUtils.addDays(sunDate, 1) : null;
        var hasMonShifts = monDate && slot.shifts.some(function(sh) { return sh.date === monDate; });
        var hasMonHoliday = monDate && (slot.publicHolidays || []).some(function(h) { return h.date === monDate; });
        if (hasMonShifts || hasMonHoliday) {
          dayCols.push({ date: monDate, dayName: 'Monday' });
        }

        slot.shifts.forEach(function(sh) {
          if (!dayCols.some(function(d) { return d.date === sh.date; })) {
            dayCols.push({ date: sh.date, dayName: sh.dayOfWeek || 'Overtime Day' });
          }
        });
        dayCols.sort(function(a, b) { return a.date.localeCompare(b.date); });

        var dayColsHtml = dayCols.map(function(dCol) {
          var dayShifts = slot.shifts.filter(function(sh) { return sh.date === dCol.date; });
          var dayHoliday = (slot.publicHolidays || []).find(function(h) { return h.date === dCol.date; });
          var holidayPill = dayHoliday ?
            '<span class="badge badge-slate" style="font-size: 10px; margin-left: 4px;">' + icons.render('flag', 'w-2.5 h-2.5') + esc(dayHoliday.name) + '</span>' : '';

          var dayCardsHtml = dayShifts.length === 0 ?
            '<div class="day-column-empty">— No shifts —</div>' :
            dayShifts.map(function(sh) {
              var crewConflictBadge = (sh.hasCrewConflict || (sh.crewIntegrityIssues && sh.crewIntegrityIssues.length > 0)) ?
                ('<span class="badge" style="font-size: 10px; margin-left: 4px; background: #fef2f2; color: #b91c1c; border: 1px solid #f87171;" title="' + escAttr((sh.crewIntegrityIssues && sh.crewIntegrityIssues[0]) ? sh.crewIntegrityIssues[0].message : 'Plant Operator Required') + '">⚠ Plant Op</span>') : '';

              return '<div style="display: flex; justify-content: space-between; align-items: center; padding: 0.45rem 0.65rem; border-left: 3px solid ' + escAttr(sh.color || '#10b981') + '; background: #ffffff; border: 1px solid var(--slate-200); border-left-width: 3px; border-radius: 6px; gap: 0.5rem;">' +
                '<div style="overflow: hidden; flex: 1;">' +
                  '<div style="font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 3px;">' + esc(sh.jobName) + crewConflictBadge + '</div>' +
                  '<div style="font-size: 11px; color: var(--slate-500); margin-top: 0.15rem;">' + esc(sh.startTime) + ' (' + esc(sh.durationHours) + 'h) • ' + esc(sh.category) + '</div>' +
                '</div>' +
                '<button class="btn btn-secondary" style="padding: 0.2rem 0.45rem; font-size: 11px; font-weight: 600; flex-shrink: 0;" onclick="window.HortOpsApp.openStaffAssignModal(\'" + escAttr(sh.shiftId) + "\')">' +
                  'Assign (' + (sh.assignedStaffIds || []).length + '/' + sh.crewSize + ')' +
                '</button>' +
              '</div>';
            }).join('');

          return '<div class="day-column">' +
            '<div class="day-column-header">' +
              '<div class="day-column-title">' +
                '<span class="day-column-name">' + esc(dCol.dayName) + '</span>' +
                '<span class="day-column-date">' + esc(dateUtils.formatDisplayDate(dCol.date)) + '</span>' +
                holidayPill +
              '</div>' +
              '<span class="badge badge-slate" style="font-size: 10px;">' + dayShifts.length + ' Ops</span>' +
            '</div>' +
            '<div class="day-column-body">' + dayCardsHtml + '</div>' +
          '</div>';
        }).join('');

        var shiftsList = '<div class="calendar-day-columns">' + dayColsHtml + '</div>';

        return '<div class="panel-card" style="margin-bottom: 0.75rem;">' +
          '<div class="panel-header" style="background: var(--slate-50);">' +
            '<div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">' +
              '<span style="font-weight: 800; color: var(--emerald-800);">Week ' + slot.weekNumber + '</span>' +
              '<span style="font-family: var(--font-mono); color: var(--slate-600);">' + dateUtils.formatDisplayWeekendRange(slot.saturdayDate, slot.sundayDate) + '</span>' +
              badges.join(' ') +
            '</div>' +
            '<span style="font-size: 13px; font-weight: 700; color: var(--slate-600);">' + slot.totalCrewHours + ' Crew Hours</span>' +
          '</div>' +
          '<div class="panel-body" style="padding: 0.75rem;">' + shiftsList + '</div>' +
        '</div>';
      }).join('');

    return '<div class="panel-card">' +
      '<div class="panel-header">' +
        '<span class="panel-title">' + icons.render('alertTriangle', 'w-4 h-4 text-amber-600') + 'Peak Weekends & Overtime Capacity Conflicts</span>' +
        '<button class="btn btn-primary" onclick="window.HortOpsPeakWeekends.autoStagger()">' +
          icons.render('sparkles', 'w-3.5 h-3.5 text-amber-300') + 'Auto-Stagger Clashes' +
        '</button>' +
      '</div>' +
      '<div class="panel-body">' + cardsHtml + '</div>' +
    '</div>';
  },

  autoStagger: function() {
    window.HortOpsApp.handleAutoStagger();
  }
};

</script>

/* === INLINED: js/components/analytics.js === */
// Analytics Dashboard & Budget Simulator Component (Zero External Chart Libraries)
window.HortOpsAnalytics = {
  render: function(state) {
    var icons = window.HortOpsIcons;
    var scheduler = window.HortOpsScheduler;
    var allShifts = state.allShifts;
    var budget = state.budgetSettings || scheduler.DEFAULT_BUDGET_SETTINGS;

    // Calculate total costs
    var totalCost = 0;
    var totalHours = 0;
    var categoryCosts = {};
    var monthCosts = new Array(12).fill(0);

    allShifts.forEach(function(sh) {
      var costInfo = scheduler.calculateShiftCost(sh, budget);
      totalCost += costInfo.totalCost;
      totalHours += (sh.durationHours * sh.crewSize);

      var cat = sh.category || 'General';
      categoryCosts[cat] = (categoryCosts[cat] || 0) + costInfo.totalCost;

      var monthIdx = parseInt(sh.date.slice(5, 7), 10) - 1;
      if (monthIdx >= 0 && monthIdx < 12) {
        monthCosts[monthIdx] += costInfo.totalCost;
      }
    });

    var maxMonthCost = Math.max.apply(null, monthCosts.concat([1]));

    var monthBarsHtml = monthCosts.map(function(cost, idx) {
      var mNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var pct = Math.round((cost / maxMonthCost) * 100);
      return '<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.35rem;">' +
        '<div style="font-size: 11px; font-weight: 700; color: var(--slate-600);">' + (cost > 0 ? ('$' + Math.round(cost / 1000) + 'k') : '0') + '</div>' +
        '<div style="width: 100%; height: 120px; background: var(--slate-100); border-radius: 4px; display: flex; align-items: flex-end; overflow: hidden;">' +
          '<div style="width: 100%; height: ' + pct + '%; background-color: var(--emerald-600); border-radius: 4px 4px 0 0; transition: height 0.3s ease;"></div>' +
        '</div>' +
        '<div style="font-size: 12px; font-weight: 700; color: var(--slate-500);">' + mNames[idx] + '</div>' +
      '</div>';
    }).join('');

    return '<div style="display: flex; flex-direction: column; gap: 1rem;">' +
      // KPI Row
      '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">' +
        '<div class="panel-card" style="padding: 1rem; margin-bottom: 0;">' +
          '<div style="font-size: 12px; font-weight: 700; color: var(--slate-500); text-transform: uppercase;">Total Overtime Projection</div>' +

  var candidates = ctx.filteredStaff || [];

   return '<details' + (isOpen ? ' open' : '') + ' style="border:1px solid var(--slate-200);border-radius:6px;background:#fff">' +
    '<summary style="cursor:pointer;padding:0.65rem 0.75rem;font-weight:800;font-size:13px;color:var(--slate-700);display:flex;justify-content:space-between;align-items:center">' +
     '<span>' + label + '</span><span class="badge badge-slate">' + staff.length + '</span>' +
    '</summary>' +
    '<div style="padding:0 0.5rem 0.5rem">' + renderCards(sectionCtx) + '</div>' +
   '</details>';
  };
  return '<div style="display:flex;flex-direction:column;gap:0.6rem">' +
   makeSection('Matching Names', matching, true) +
   makeSection('Other', other, false) +
  '</div>';
 };
})();

// Staff Assignment Candidate Model Sub-module (Offline15.1 Architecture Contract Close-Out)
// Pure non-DOM candidate processing: filtering, soft preference ranking (Tiers 1-5), and deterministic sorting.
// Authority Separation: Hard eligibility is strictly delegated to window.HortOpsEligibilityEngine.
if (typeof require !== 'undefined') {
  if (typeof window === 'undefined') {
    global.window = global;
  }
}

window.HortOpsStaffAssignCandidateModel = {
  /**
   * Calculates soft preference rank tier for an employee based on job team preferences:
   * Tier 1 = Primary Team
   * Tier 2 = Secondary Team
   * Tier 3 = Tertiary Team
   * Tier 4 = Other Exclusive Team (if job has exclusive teams configured)
   * Tier 5 = Regular / Other
   * @param {Object} staff - Staff member record
   * @param {Object} prefs - Job preference settings { primaryTeam, secondaryTeam, tertiaryTeam, isExclusive, exclusiveTeams }
   * @returns {number} Rank tier 1-5
   */
  getStaffPriority: function(staff, prefs) {
    if (!staff || !staff.team) return 5;
    prefs = prefs || {};
    var t = staff.team.toLowerCase();
    var primaryTeam = prefs.primaryTeam;
    var secondaryTeam = prefs.secondaryTeam;
    var tertiaryTeam = prefs.tertiaryTeam;
    var isExclusive = prefs.isExclusive;
    var exclusiveTeams = prefs.exclusiveTeams || [];

    if (primaryTeam && t === primaryTeam.toLowerCase()) return 1;
    if (secondaryTeam && t === secondaryTeam.toLowerCase()) return 2;
    if (tertiaryTeam && t === tertiaryTeam.toLowerCase()) return 3;
    if (isExclusive && exclusiveTeams.some(function(ex) { return ex.toLowerCase() === t; })) return 4;
    return 5;
  },

  /**
   * Filters candidates from roster based on eligibility, search query, department, team, and preferred crew toggles.
   * Hard eligibility MUST fail closed if window.HortOpsEligibilityEngine is unavailable.
   * @param {Array} roster - Complete workforce list
   * @param {Object} options - Filter context options
   * @returns {Array} Filtered candidate staff members
   */
  filterCandidates: function(roster, options) {
    options = options || {};
    var shift = options.shift;
    var allShifts = options.allShifts || [];
    var stagedAssignedStaffIds = options.stagedAssignedStaffIds || [];
    var searchTerm = options.searchTerm;
    var selectedDept = options.selectedDept || 'all';
    var selectedTeam = options.selectedTeam || 'all';
    var onlyPreferredCrew = options.onlyPreferredCrew;
    var prefs = options.jobPreferences || {};
    var primaryTeam = prefs.primaryTeam;
    var secondaryTeam = prefs.secondaryTeam;
    var tertiaryTeam = prefs.tertiaryTeam;
    var isExclusive = prefs.isExclusive;
    var exclusiveTeams = prefs.exclusiveTeams || [];

    var engine = window.HortOpsEligibilityEngine;

      return [];
    }

      var isDoubleBookedOnly = false;
      var evalRes = engine.validateStaffEligibility(staff, shift, allShifts, stagedAssignedStaffIds);
      if (!evalRes.eligible) {
        if (evalRes.reasons.length === 1 && evalRes.reasons[0] === 'OVERLAPPING_SHIFT') {
          isDoubleBookedOnly = true;
        } else {
          return false;
        }
      }

      // Search matching across name, id, role, team, crew, department
      if (searchTerm) {
        var q = searchTerm.toLowerCase();
        var matchName = staff.name.toLowerCase().indexOf(q) !== -1;
        var matchId = staff.id.toLowerCase().indexOf(q) !== -1;
        var matchRole = staff.role.toLowerCase().indexOf(q) !== -1;
        var matchTeam = staff.team.toLowerCase().indexOf(q) !== -1;
        var matchCrew = (staff.crew || '').toLowerCase().indexOf(q) !== -1;
        var matchDept = staff.department.toLowerCase().indexOf(q) !== -1;
        if (!matchName && !matchId && !matchRole && !matchTeam && !matchCrew && !matchDept) return false;
      }

      // Department & Team slicers
      if (selectedDept !== 'all' && staff.department !== selectedDept) return false;
      if (selectedTeam !== 'all' && staff.team !== selectedTeam) return false;

      // Preferred Crew Toggle
      if (onlyPreferredCrew) {
        var isCandidatePref = (primaryTeam && staff.team.toLowerCase() === primaryTeam.toLowerCase()) ||
                              (secondaryTeam && staff.team.toLowerCase() === secondaryTeam.toLowerCase()) ||
                              (tertiaryTeam && staff.team.toLowerCase() === tertiaryTeam.toLowerCase()) ||
                              (isExclusive && exclusiveTeams.some(function(ex) { return ex.toLowerCase() === staff.team.toLowerCase(); }));

      }

      return true;
    });
  },

  /**
   * Deterministically sorts filtered candidate list:
   * 1. Unassigned candidates before assigned candidates
   * 2. Preference Rank Tiers (Primary -> Secondary -> Tertiary -> Exclusive -> Other)
   * 3. Certified Plant Operator priority when job requires plant operator
   * 4. YTD Overtime Hours ascending (equal opportunity / lowest hours first)
   * 5. Deterministic tie-breaker: staff name localeCompare
   * @param {Array} candidates - Filtered candidate list
   * @param {Object} options - Sort options { assignedIdsSet, prefs, matchingJob }
   * @returns {Array} Sorted candidates

  sortCandidates: function(candidates, options) {
    options = options || {};

    var prefs = options.prefs || {};

    candidates.sort(function(a, b) {

      var bAssigned = assignedIdsSet.has(b.id) ? 1 : 0;

      var prioA = self.getStaffPriority(a, prefs);
      var prioB = self.getStaffPriority(b, prefs);

      var ytdA = a.ytdOvertimeHours || a.ytdHours || 0;
      var ytdB = b.ytdOvertimeHours || b.ytdHours || 0;

  },

  /**
   * Counts the total number of candidates in the workforce belonging to preferred/exclusive teams.
   * @param {Array} roster - Complete workforce list
   * @param {Object} prefs - Job preference settings
   * @returns {number} Preferred candidate count
   */
  countPreferredCandidates: function(roster, prefs) {
    prefs = prefs || {};
    var isExclusive = prefs.isExclusive;
    var exclusiveTeams = prefs.exclusiveTeams || [];
    var primaryTeam = prefs.primaryTeam;
    var secondaryTeam = prefs.secondaryTeam;
    var tertiaryTeam = prefs.tertiaryTeam;

    return (roster || []).filter(function(s) {
      var t = s.team.toLowerCase();
      if (isExclusive) {
        return exclusiveTeams.some(function(ex) { return ex.toLowerCase() === t; });
      }
      return (primaryTeam && t === primaryTeam.toLowerCase()) ||
             (secondaryTeam && t === secondaryTeam.toLowerCase()) ||
             (tertiaryTeam && t === tertiaryTeam.toLowerCase());
    }).length;
  },

  /**
   * High-level candidate resolution helper combining filtering, sorting, and preferred counts.
   * @param {Array} roster - Complete workforce list
   * @param {Object} ctx - Resolution context
   * @returns {Object} { filteredStaff, preferredCrewCount }
   */
  resolveCandidateModel: function(roster, ctx) {
    var filteredStaff = this.filterCandidates(roster, {
      shift: ctx.shift,
      allShifts: ctx.allShifts,
      stagedAssignedStaffIds: ctx.stagedAssignedStaffIds,
      searchTerm: ctx.searchTerm,
      selectedDept: ctx.selectedDept,
      selectedTeam: ctx.selectedTeam,
      onlyPreferredCrew: ctx.onlyPreferredCrew,
      jobPreferences: ctx.jobPreferences
    });

    this.sortCandidates(filteredStaff, {
      assignedIdsSet: ctx.assignedIdsSet,
      prefs: ctx.jobPreferences,
      matchingJob: ctx.matchingJob
    });

    var preferredCrewCount = this.countPreferredCandidates(roster, ctx.jobPreferences);

    return {
      filteredStaff: filteredStaff,
      preferredCrewCount: preferredCrewCount
    };
  }
};

// Crew Allocator / Staff Assignment Modal Component
// Sole Public Facade for Staff Assignment: delegates UI rendering to sub-modules while retaining state and action handlers.

  if (window.HortOpsEligibilityEngine && typeof window.HortOpsEligibilityEngine.getHumanIneligibleReason === 'function') {
    return window.HortOpsEligibilityEngine.getHumanIneligibleReason(code);

    'EMPLOYMENT_DEPARTED': 'Departed',
    'EMPLOYMENT_INACTIVE': 'Inactive',
    'EMPLOYMENT_UNAVAILABLE': 'Unavailable',
    'EMPLOYMENT_ON_LEAVE': 'On Leave',
    'UNKNOWN_EMPLOYMENT_STATUS': 'Unknown Status',
    'OVERTIME_EXEMPT': 'Exemption Active',
    'TEAM_NOT_ALLOWED': 'Non-Exclusive Team',
    'OVERLAPPING_SHIFT': 'Double-Booked',
    'INSUFFICIENT_REST': 'Insufficient Rest (< 10h)',
    'STAFF_NOT_FOUND': 'Staff Not Found',
    'NOT_PLANT_OPERATOR': 'Plant Operator Required'

}

function getEffectiveShiftsForModal(shift) {
  var state = (window.HortOpsApp && window.HortOpsApp.state) || {};
  var allShifts = state.allShifts || [];

  var monthDay = (typeof shift.date === 'string' && shift.date.length >= 10) ? shift.date.slice(5, 10) : '';

  if (isBoundary) {
    if (!window.HortOpsScheduler || typeof window.HortOpsScheduler.getAdjacentBoundaryShifts !== 'function') {
      var unavailShifts = allShifts.slice();
      unavailShifts.lookupFailed = true;
      unavailShifts.errorMessage = 'HortOpsScheduler boundary lookup service is unavailable';

      var errShifts = allShifts.slice();
      errShifts.lookupFailed = true;
      errShifts.errorMessage = adj.errorMessage;
      return errShifts;
    }
    if (adj && adj.length > 0) {
      var existing = {};
      for (var i = 0; i < allShifts.length; i++) {
        if (allShifts[i] && allShifts[i].shiftId) existing[allShifts[i].shiftId] = true;
      }
      var merged = allShifts.slice();
      for (var j = 0; j < adj.length; j++) {

    }

        mode = 'manual';
        repeatCount = 1;
      }

      if (!slotId) {
        var nextIdx = 1;
        while (usedSlotIndices.has(nextIdx)) {
          nextIdx++;
        }
        slotId = 'SLOT-' + nextIdx;
        usedSlotIndices.add(nextIdx);
      }

      self.stagedSlots.push({
        slotId: slotId,
        staffId: staffId,
        mode: mode,
        repeatCount: repeatCount,
        isInherited: isInherited,
        sourceDate: sourceDate,
        instructionId: instructionId,
        isSealedHistorical: isSealedHistorical,
        activeContinuationShiftId: activeContinuationShiftId,
        activeContinuationDate: activeContinuationDate
      });

      };

  addStaff: function(staffId) {
    if (!this.stagedAssignedStaffIds) this.stagedAssignedStaffIds = [];
    if (!this.stagedSlots) this.stagedSlots = [];
    if (this.stagedAssignedStaffIds.indexOf(staffId) === -1) {
      var state = window.HortOpsApp.state;
      var shift = state.allShifts.find(function(s) { return s.shiftId === window.HortOpsStaffAssignModal.activeShiftId; });
      var staff = (state.staffList || []).find(function(s) { return s.id === staffId; });
      var jobs = state.jobs || [];
      var matchingJob = jobs.find(function(j) { return j.id === shift.jobId || (j.name && shift.jobName && j.name.toLowerCase() === shift.jobName.toLowerCase()); });
      if (staff && shift) {
        if (!window.HortOpsEligibilityEngine || typeof window.HortOpsEligibilityEngine.validateEmployeeForOccurrence !== 'function') {
          alert('Cannot assign staff: Eligibility Engine unavailable');
          return;
        }
        var evalRes = window.HortOpsEligibilityEngine.validateEmployeeForOccurrence({
          employee: staff,
          occurrence: shift,
          job: matchingJob,
          allAssignments: state.allShifts,
          currentShiftAssignedIds: this.stagedAssignedStaffIds
        });
        if (!evalRes.eligible) {
          alert('Cannot assign ' + staff.name + ':\n- ' + evalRes.message);
          return;
        }
      }

      // Allocate next unused stable slot index
      var usedIndices = new Set();
      this.stagedSlots.forEach(function(s) {
        var m = s.slotId && s.slotId.match(/SLOT-(\d+)/);
        if (m) usedIndices.add(parseInt(m[1], 10));
      });
      var nextIdx = 1;
      while (usedIndices.has(nextIdx)) {
        nextIdx++;
      }
      var newSlotId = 'SLOT-' + nextIdx;

      this.stagedAssignedStaffIds.push(staffId);
      this.stagedSlots.push({
        slotId: newSlotId,
        staffId: staffId,
        mode: 'manual',
        repeatCount: 1,
        isInherited: false,
        sourceDate: shift ? shift.date : ''
      });
      if (!this.stagedSlotStrategies) this.stagedSlotStrategies = {};
      this.stagedSlotStrategies[staffId] = { mode: 'manual', repeatCount: 1 };
      this.renderModal();
    }
  },

  openActiveContinuation: function(targetShiftId) {
