    <script data-source="js/components/resetWorkspaceModal.js">
/* === INLINED: js/components/resetWorkspaceModal.js === */
// Confirmed Destructive Workspace Reset Modal Component (Stage 2 Mandate)
// Requires explicit two-step typed confirmation ('RESET') to wipe persistent local storage and re-initialize clean slate.

window.HortOpsResetWorkspaceModal = {
  open: function() {
    if (window.HortOpsModalUtils && typeof window.HortOpsModalUtils.lockBackgroundScroll === 'function') {
      window.HortOpsModalUtils.lockBackgroundScroll();
    }
    this.renderModal();
  },

  close: function() {
    var el = document.getElementById('reset-workspace-modal-root');
    if (el) el.innerHTML = '';
    if (window.HortOpsModalUtils && typeof window.HortOpsModalUtils.unlockBackgroundScroll === 'function') {
      window.HortOpsModalUtils.unlockBackgroundScroll();
    }
  },

  handleInput: function(val) {
    var btn = document.getElementById('btn-confirm-destructive-reset');
    if (!btn) return;
    var isConfirmed = String(val || '') === 'RESET';
    btn.disabled = !isConfirmed;
    if (isConfirmed) {
      btn.style.opacity = '1';
      btn.style.cursor = 'pointer';
      btn.style.backgroundColor = '#dc2626';
    } else {
      btn.style.opacity = '0.5';
      btn.style.cursor = 'not-allowed';
      btn.style.backgroundColor = '#ef4444';
    }
  },

  exportEmergencyBackup: function() {
    var raw = '';
    try {
      if (typeof window !== 'undefined' && window.sessionStorage) {
        raw = window.sessionStorage.getItem('hort_ops_emergency_recovery_v2') || '';
      }
    } catch(e) {}
    if (!raw && window.HortOpsApp && typeof window.HortOpsApp.exportWorkspaceJson === 'function') {
      raw = window.HortOpsApp.exportWorkspaceJson();
    }
    if (!raw) {
      alert('No emergency backup data found.');
      return;
    }
    try {
      var blob = new Blob([raw], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'hort_ops_emergency_recovery_' + (new Date()).toISOString().replace(/[:.]/g, '-') + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function() {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
    } catch(err) {
      console.error('Export emergency backup failed:', err);
      alert('Export failed. Raw payload:\n' + raw.slice(0, 500));
    }
  },

  executeReset: function() {
    var input = document.getElementById('input-confirm-reset');
    var val = input ? input.value : '';
    if (String(val || '') !== 'RESET') {
      alert('Confirmation word mismatch. Please type RESET in all caps to confirm.');
      return;
    }

    var app = window.HortOpsApp;
    var success = false;
    if (app && typeof app.resetToCleanSlate === 'function') {
      success = app.resetToCleanSlate();
    }

    if (!success) {
      var errorBanner = document.getElementById('reset-modal-error-banner');
      var details = (app && app.state && app.state.lastResetDetails) ? app.state.lastResetDetails : null;
      var msg = '';
      if (details && details.rolledBack) {
        msg = '<div style="font-weight: 700; color: #b91c1c; margin-bottom: 4px;">Reset Aborted & Durably Rolled Back</div>' +
              '<div style="font-size: 12px; color: #7f1d1d; line-height: 1.4;">' +
              'Persistent deletion failed on item <code>' + (details.failedKey || 'storage') + '</code>. ' +
              'Compensating rollback successfully restored all persistent keys to localStorage. ' +
              'Your pre-reset workspace is durably intact and will survive a page reload.' +
              '</div>';
      } else if (details && details.unrecoveredKeys && details.unrecoveredKeys.length > 0) {
        msg = '<div style="font-weight: 700; color: #b91c1c; margin-bottom: 4px;">Emergency: Partial Reset Failure</div>' +
              '<div style="font-size: 12px; color: #7f1d1d; line-height: 1.4;">' +
              'Deletion failed and compensating rollback could not restore keys: <code>' + details.unrecoveredKeys.join(', ') + '</code>. ' +
              'To prevent data loss, please export your emergency backup before closing this tab.' +
              '</div>' +
              '<div style="margin-top: 8px;">' +
              '<button type="button" class="btn btn-secondary" style="font-size: 12px; padding: 4px 8px;" onclick="window.HortOpsResetWorkspaceModal.exportEmergencyBackup()">Export Emergency Backup</button>' +
              '</div>';
      } else {
        msg = '<div style="font-weight: 700; color: #b91c1c;">Storage reset failed</div>' +
              '<div style="font-size: 12px; color: #7f1d1d;">Persistent storage could not be wiped. Your live data has been preserved.</div>';
      }

      if (errorBanner) {
        errorBanner.style.display = 'block';
        errorBanner.innerHTML = msg;
      } else {
        alert('Storage reset failed. Your data has been preserved.');
      }
      return; // Suppress reload and keep modal open on failure (Review 37 R37-01, Review 38 R38-01)
    }

    this.close();

    // Reload page if running in a standard browser environment to guarantee full clean state
    if (typeof window !== 'undefined' && window.location && typeof window.location.reload === 'function') {
      window.location.reload();
    } else {
      alert('Workspace reset complete. All localStorage data purged and clean slate initialized.');
    }
  },

  renderModal: function() {
    var el = document.getElementById('reset-workspace-modal-root');
    if (!el) return;

    var icons = window.HortOpsIcons;

    var modalHtml = '<div class="modal-overlay" onclick="if(event.target === this) window.HortOpsResetWorkspaceModal.close()">' +
      '<div class="modal-card modal-md" id="modal-reset-workspace" role="dialog" aria-modal="true" aria-labelledby="reset-modal-title" style="max-width: 620px; display: flex; flex-direction: column;">' +
        // Modal Header
        '<div class="modal-header" style="background: #fff1f2; border-bottom: 1px solid #fecdd3; padding: 1rem 1.25rem;">' +
          '<div style="display: flex; align-items: center; gap: 0.6rem;">' +
            '<span style="display: inline-flex; padding: 6px; border-radius: 8px; background: #ffe4e6; color: #e11d48;">' +
              icons.render('alertTriangle', 'w-5 h-5') +
            '</span>' +
            '<div>' +
              '<h3 id="reset-modal-title" style="margin: 0; font-size: 16px; font-weight: 700; color: #9f1239;">Confirmed Destructive Reset</h3>' +
              '<div style="font-size: 12px; color: #be123c;">Permanent workspace wipe & clean-slate initialization</div>' +
            '</div>' +
          '</div>' +
          '<button class="modal-close-btn" onclick="window.HortOpsResetWorkspaceModal.close()" aria-label="Close modal">' +
            icons.render('x', 'w-4 h-4') +
          '</button>' +
        '</div>' +

        // Modal Body
        '<div class="modal-body" style="padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem;">' +
          '<div id="reset-modal-error-banner" style="display: none; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 0.75rem 1rem; font-size: 13px; color: #dc2626; font-weight: 600;"></div>' +
          '<div style="background: #fff5f5; border: 1px solid #fed7d7; border-radius: 6px; padding: 0.85rem 1rem; font-size: 13px; color: #c53030; line-height: 1.5;">' +
            '<strong>Warning: This action cannot be undone.</strong> Executing a destructive reset permanently purges all saved client data from this browser\'s <code>localStorage</code>, including:' +
            '<ul style="margin: 0.5rem 0 0 1.25rem; padding: 0; font-size: 12px; color: #9b2c2c;">' +
              '<li>All active and archived Jobs, recurrence rules, and operational definitions</li>' +
              '<li>All staff personnel records, team memberships, and custom shift assignments</li>' +
              '<li>All rostering instructions and candidate rotation provenance history</li>' +
              '<li>All compliance permits, TPO exemptions, and budget configuration targets</li>' +
              '<li>All authoritative historical scheduled-commitment snapshots</li>' +
              '<li>All legacy and current <code>hort_ops_*</code> storage keys and cached digests</li>' +
            '</ul>' +
          '</div>' +

          '<div style="font-size: 13px; color: var(--slate-700); line-height: 1.5;">' +
            'After reset, the client will immediately return to a verified clean-slate state (0 Jobs, 0 Personnel, clean defaults) ready for a fresh configuration or JSON backup restore.' +
          '</div>' +

          '<div style="background: var(--slate-50); border: 1px solid var(--slate-200); border-radius: 6px; padding: 1rem;">' +
            '<label for="input-confirm-reset" style="display: block; font-size: 12px; font-weight: 700; color: var(--slate-800); margin-bottom: 0.5rem;">' +
              'To confirm destructive reset, type <span style="font-family: monospace; background: #fee2e2; color: #b91c1c; padding: 2px 6px; border-radius: 4px; font-weight: 800;">RESET</span> below:' +
            '</label>' +
            '<input type="text" id="input-confirm-reset" class="form-input" placeholder="Type RESET to confirm" autocomplete="off" style="font-family: monospace; font-size: 14px; text-transform: uppercase;" oninput="window.HortOpsResetWorkspaceModal.handleInput(this.value)" />' +
          '</div>' +
        '</div>' +

        // Modal Footer
        '<div class="modal-footer" style="padding: 1rem 1.25rem; background: var(--slate-50); border-top: 1px solid var(--slate-200); display: flex; justify-content: flex-end; gap: 0.75rem;">' +
          '<button type="button" class="btn btn-secondary" onclick="window.HortOpsResetWorkspaceModal.close()">' +
            'Cancel' +
          '</button>' +
          '<button type="button" id="btn-confirm-destructive-reset" class="btn" disabled style="background: #ef4444; color: #ffffff; font-weight: 700; opacity: 0.5; cursor: not-allowed; transition: all 0.15s ease;" onclick="window.HortOpsResetWorkspaceModal.executeReset()">' +
            icons.render('trash', 'w-4 h-4') +
            '<span style="margin-left: 6px;">Permanently Reset Workspace</span>' +
          '</button>' +
        '</div>' +
      '</div>' +
    '</div>';

    el.innerHTML = modalHtml;

    setTimeout(function() {
      var input = document.getElementById('input-confirm-reset');
      if (input) input.focus();
    }, 50);
  }
};

</script>

// Job-scoped allocation reset confirmation. This only clears live operational state;
// historical snapshots deliberately remain immutable audit evidence.
window.HortOpsJobResetModal = {
 jobId: null,
 scope: 'current_and_future',
 open: function(jobId) {
  this.jobId = jobId;
  this.scope = 'current_and_future';
  if (window.HortOpsModalUtils && window.HortOpsModalUtils.lockBackgroundScroll) window.HortOpsModalUtils.lockBackgroundScroll();
  this.render();
 },
 close: function() {
  var root = document.getElementById('job-reset-modal-root');
  if (root) root.innerHTML = '';
  this.jobId = null;
  if (window.HortOpsModalUtils && window.HortOpsModalUtils.unlockBackgroundScroll) window.HortOpsModalUtils.unlockBackgroundScroll();
 },
 setScope: function(scope) { this.scope = scope === 'all' ? 'all' : 'current_and_future'; this.render(); },
 handleInput: function(value) { var button = document.getElementById('job-reset-confirm'); if (button) button.disabled = value !== 'RESET'; },
 execute: function() {
  var input = document.getElementById('job-reset-confirmation');
  if (!input || input.value !== 'RESET') return;
  var app = window.HortOpsApp;
  var result = app && app.resetJobAllocations ? app.resetJobAllocations(this.jobId, this.scope) : { success: false, error: 'Job reset command unavailable' };
  var feedback = document.getElementById('job-reset-feedback');
  if (!result.success) { if (feedback) { feedback.style.display = 'block'; feedback.textContent = result.error || 'The reset could not be saved. No data was changed.'; } return; }
  var count = result.counts || {};
  if (feedback) {
   feedback.style.display = 'block';
   feedback.style.color = 'var(--emerald-800)';
   feedback.style.background = 'var(--emerald-50)';
   feedback.style.borderColor = 'var(--emerald-200)';
   feedback.textContent = 'Reset complete: cleared ' + (count.cleared || 0) + ' live record(s); retained ' + (result.retainedSnapshots || 0) + ' historical snapshot(s) as audit history.';
  }
  var confirm = document.getElementById('job-reset-confirm');
  if (confirm) confirm.disabled = true;
 },
 render: function() {
  var root = document.getElementById('job-reset-modal-root');
  var app = window.HortOpsApp;
  if (!root || !app || !this.jobId) return;
  var job = (app.state.jobs || []).find(function(item) { return item.id === window.HortOpsJobResetModal.jobId; });
  if (!job) { this.close(); return; }
  var preview = app.getJobAllocationResetPreview(this.jobId, this.scope, app.state);
  var danger = this.scope === 'all';
  var esc = function(value) { return window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtml ? window.HortOpsSecurityUtils.escapeHtml(value) : String(value || ''); };
  root.innerHTML = '<div class="modal-overlay" onclick="if(event.target === this) window.HortOpsJobResetModal.close()">' +
   '<div class="modal-card modal-md" role="dialog" aria-modal="true" aria-labelledby="job-reset-title" style="max-width:620px">' +
   '<div class="modal-header" style="' + (danger ? 'background:#fff1f2;border-bottom:1px solid #fecdd3;' : '') + '">' +
   '<div><h3 id="job-reset-title" style="margin:0">Reset allocations</h3><div style="font-size:12px;color:var(--slate-500);margin-top:3px">' + esc(job.name) + '</div></div>' +
   '<button class="modal-close-btn" aria-label="Close" onclick="window.HortOpsJobResetModal.close()">×</button></div>' +
   '<div class="modal-body" style="display:flex;flex-direction:column;gap:14px">' +
   '<p style="margin:0;color:var(--slate-700);line-height:1.45">This keeps the job, staff records, absences, refusal history, and protected historical snapshots unchanged.</p>' +
   '<label style="display:flex;gap:9px;align-items:flex-start;padding:10px;border:1px solid ' + (!danger ? 'var(--emerald-300);background:var(--emerald-50)' : 'var(--slate-200)') + ';border-radius:6px;cursor:pointer"><input type="radio" name="job-reset-scope" ' + (!danger ? 'checked' : '') + ' onchange="window.HortOpsJobResetModal.setScope(\'current_and_future\')"><span><strong>Reset current and future allocations</strong><br><span style="font-size:12px;color:var(--slate-600)">Clears live commitments dated ' + esc(preview.today) + ' or later.</span></span></label>' +
   '<label style="display:flex;gap:9px;align-items:flex-start;padding:10px;border:1px solid ' + (danger ? '#fda4af;background:#fff1f2' : 'var(--slate-200)') + ';border-radius:6px;cursor:pointer"><input type="radio" name="job-reset-scope" ' + (danger ? 'checked' : '') + ' onchange="window.HortOpsJobResetModal.setScope(\'all\')"><span><strong style="color:#b91c1c">Reset all allocations — DANGER</strong><br><span style="font-size:12px;color:var(--slate-600)">Clears every live allocation and operational commitment. Historical snapshots remain as audit history.</span></span></label>' +
   '<div style="background:var(--slate-50);border:1px solid var(--slate-200);border-radius:6px;padding:10px;font-size:13px;display:grid;grid-template-columns:1fr auto;gap:6px"><span>Assignments</span><strong>' + preview.assignments + '</strong><span>Permit overrides</span><strong>' + preview.permitOverrides + '</strong><span>Rostering instructions / provenance</span><strong>' + preview.rosteringInstructions + ' / ' + preview.rosteringProvenance + '</strong><span>Historical snapshots retained</span><strong>' + preview.historicalSnapshots + '</strong></div>' +
   '<label for="job-reset-confirmation" style="font-size:13px;font-weight:700">Type <code>RESET</code> to confirm<input id="job-reset-confirmation" class="form-input" autocomplete="off" style="margin-top:6px;font-family:monospace" oninput="window.HortOpsJobResetModal.handleInput(this.value)"></label>' +
   '<div id="job-reset-feedback" role="status" style="display:none;border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;padding:9px;border-radius:6px;font-size:13px"></div></div>' +
   '<div class="modal-footer"><button class="btn btn-secondary" onclick="window.HortOpsJobResetModal.close()">Cancel</button><button id="job-reset-confirm" class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" disabled onclick="window.HortOpsJobResetModal.execute()">Reset allocations</button></div></div></div>';
  var input = document.getElementById('job-reset-confirmation'); if (input) input.focus();
 }
};

  <script data-source="js/components/storageHealthModal.js">
/* === INLINED: js/components/storageHealthModal.js === */
// Storage Quota & Health Monitoring Modal Component (Stage 2 Mandate)
// Provides real-time capacity estimation against 5MB LocalStorage quota, 80% threshold warnings, active write probes, and storage compaction.

window.HortOpsStorageHealthModal = {
  feedbackMessage: '',

  open: function() {
    this.feedbackMessage = '';
    if (window.HortOpsModalUtils && typeof window.HortOpsModalUtils.lockBackgroundScroll === 'function') {
      window.HortOpsModalUtils.lockBackgroundScroll();
    }
    this.renderModal();
  },

  close: function() {
    this.feedbackMessage = '';
    var el = document.getElementById('storage-health-modal-root');
    if (el) el.innerHTML = '';
    if (window.HortOpsModalUtils && typeof window.HortOpsModalUtils.unlockBackgroundScroll === 'function') {
      window.HortOpsModalUtils.unlockBackgroundScroll();
    }
  },

  runHealthProbe: function() {
    var storage = window.HortOpsStorage;
    var health = (storage && typeof storage.getStorageHealth === 'function') ? storage.getStorageHealth() : null;
    this.feedbackMessage = health && health.probeOk
      ? 'Active persistence probe verified operable at ' + new Date().toLocaleTimeString() + '.'
      : 'Persistence probe warning: unable to verify write persistence.';
    this.renderModal();
  },

  executeCompact: function() {
    var storage = window.HortOpsStorage;
    if (storage && typeof storage.compactStorage === 'function') {
      var res = storage.compactStorage();
      var reclaimedKb = (res.reclaimedBytes / 1024).toFixed(1);
      if (res && res.success) {
        this.feedbackMessage = 'Compaction complete: ' + res.prunedCount + ' legacy/temporary key(s) purged, ' + reclaimedKb + ' KB reclaimed.';
      } else {
        this.feedbackMessage = 'Compaction partial/failed: some legacy keys could not be removed (' + (res ? res.prunedCount : 0) + ' purged, ' + reclaimedKb + ' KB reclaimed).';
      }
    } else {
      this.feedbackMessage = 'Storage compaction routine unavailable.';
    }
    this.renderModal();
  },

  openResetModal: function() {
    this.close();
    if (window.HortOpsApp && typeof window.HortOpsApp.openResetWorkspaceModal === 'function') {
      window.HortOpsApp.openResetWorkspaceModal();
    }
  },

  renderModal: function() {
    var el = document.getElementById('storage-health-modal-root');
    if (!el) return;

    var storage = window.HortOpsStorage;
    var health = (storage && typeof storage.getStorageHealth === 'function')
      ? storage.getStorageHealth()
      : { status: 'healthy', probeOk: true, usedBytes: 0, workspaceBytes: 0, quotaEstimate: 5242880, percentUsed: 0, lastSaved: new Date().toISOString() };

// Corrupted Workspace Quarantine Viewer Modal Component (Stage 2 Mandate)
// Allows operators to inspect, export, or safely discard unparseable quarantined workspace data when recoveryRequired is true.

window.HortOpsQuarantineModal = {
  feedbackMessage: '',

  open: function() {
    this.feedbackMessage = '';
    if (window.HortOpsModalUtils && typeof window.HortOpsModalUtils.lockBackgroundScroll === 'function') {
      window.HortOpsModalUtils.lockBackgroundScroll();
    }
    this.renderModal();
  },

  close: function() {
    this.feedbackMessage = '';
    var el = document.getElementById('quarantine-viewer-modal-root');
    if (el) el.innerHTML = '';
    if (window.HortOpsModalUtils && typeof window.HortOpsModalUtils.unlockBackgroundScroll === 'function') {
      window.HortOpsModalUtils.unlockBackgroundScroll();
    }
  },

  copyQuarantinePayload: function() {
    var box = document.getElementById('quarantine-payload-box');
    if (box) {
      box.select();
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          navigator.clipboard.writeText(box.value);
        } else {
          document.execCommand('copy');
        }
        this.feedbackMessage = 'Quarantine payload copied to clipboard.';
      } catch(e) {
        this.feedbackMessage = 'Copy failed. Please copy manually from the box below.';
      }
      this.renderModal();
    }
  },

  exportQuarantineFile: function() {
    var storage = window.HortOpsStorage;
    var raw = (storage && typeof storage.getRawQuarantinePayload === 'function')
      ? storage.getRawQuarantinePayload()
      : '';
    if (!raw) {
      alert('No raw quarantine payload available to export.');
      return;
    }

    try {
      var blob = new Blob([raw], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'hort_ops_corrupted_quarantine_backup_' + new Date().toISOString().replace(/[:.]/g, '-') + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      this.feedbackMessage = 'Quarantine backup file successfully exported.';
      this.renderModal();
    } catch(e) {
      alert('Failed to export quarantine file: ' + (e.message || String(e)));
    }
  },

  openResetModal: function() {
    this.close();
    if (window.HortOpsApp && typeof window.HortOpsApp.openResetWorkspaceModal === 'function') {
      window.HortOpsApp.openResetWorkspaceModal();

  openRestoreModal: function() {

      : '';

    var icons = window.HortOpsIcons;

      '<div class="modal-card modal-lg" role="dialog" aria-modal="true" aria-labelledby="quarantine-modal-title" style="max-width: 780px; display: flex; flex-direction: column;">' +
        // Modal Header

          '<div style="display: flex; align-items: center; gap: 0.6rem;">' +
            '<span style="display: inline-flex; padding: 6px; border-radius: 8px; background: #fef3c7; color: #b45309;">' +
              icons.render('alertTriangle', 'w-5 h-5') +
            '</span>' +
            '<div>' +
              '<h3 id="quarantine-modal-title" style="margin: 0; font-size: 16px; font-weight: 700; color: #92400e;">Corrupted Workspace Quarantine Viewer</h3>' +
              '<div style="font-size: 12px; color: #b45309;">Inspect, export, or safely discard unparseable data</div>' +
            '</div>' +
          '</div>' +
          '<button class="modal-close-btn" onclick="window.HortOpsQuarantineModal.close()" aria-label="Close modal">' +
            icons.render('x', 'w-4 h-4') +

        // Modal Body

          // Alert banner

          '</div>' +

          // Diagnostic summary
          '<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem;">' +
            '<div style="background: var(--slate-50); border: 1px solid var(--slate-200); border-radius: 6px; padding: 0.6rem 0.8rem;">' +
              '<div style="font-size: 11px; font-weight: 700; color: var(--slate-500); text-transform: uppercase;">Quarantine Source Key</div>' +
              '<div style="font-size: 13px; font-family: monospace; font-weight: 600; color: var(--slate-800);">' + esc(sourceStr) + '</div>' +
            '</div>' +

              '<div style="font-size: 11px; font-weight: 700; color: var(--slate-500); text-transform: uppercase;">Diagnostic Exception</div>' +
              '<div style="font-size: 13px; font-weight: 600; color: #b91c1c;">' + esc(errorStr) + '</div>' +

              '<div style="display: flex; gap: 0.4rem;">' +
                '<button type="button" class="btn btn-secondary" style="font-size: 11px; padding: 0.2rem 0.6rem;" onclick="window.HortOpsQuarantineModal.copyQuarantinePayload()">' +
                  icons.render('copy', 'w-3 h-3') +

                '</button>' +
                '<button type="button" class="btn btn-secondary" style="font-size: 11px; padding: 0.2rem 0.6rem;" onclick="window.HortOpsQuarantineModal.exportQuarantineFile()">' +
                  icons.render('download', 'w-3 h-3') +
                  '<span style="margin-left: 4px;">Export File</span>' +
                '</button>' +
              '</div>' +
            '</div>' +
            '<textarea id="quarantine-payload-box" readonly style="width: 100%; height: 160px; font-family: monospace; font-size: 11px; padding: 0.6rem; border: 1px solid var(--slate-300); border-radius: 6px; background: #f8fafc; color: var(--slate-800); box-sizing: border-box; resize: vertical;">' +
              esc(rawPayload) +
            '</textarea>' +
          '</div>' +

          // Recovery actions
          '<div style="background: var(--slate-50); border: 1px solid var(--slate-200); border-radius: 6px; padding: 0.85rem 1rem;">' +
            '<div style="font-size: 13px; font-weight: 700; color: var(--slate-800); margin-bottom: 0.35rem;">Operator Recovery Options</div>' +
            '<div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">' +
              '<button type="button" class="btn btn-primary" style="font-size: 12px; padding: 0.4rem 0.85rem;" onclick="window.HortOpsQuarantineModal.openRestoreModal()">' +
                icons.render('rotateCcw', 'w-3.5 h-3.5') +
                '<span style="margin-left: 5px;">Restore from Valid Backup JSON</span>' +
              '</button>' +
              '<button type="button" class="btn" style="font-size: 12px; padding: 0.4rem 0.85rem; background: #fee2e2; border: 1px solid #fecaca; color: #dc2626; font-weight: 600;" onclick="window.HortOpsQuarantineModal.openResetModal()">' +
                icons.render('trash', 'w-3.5 h-3.5') +

        // Modal Footer

          '<button type="button" class="btn btn-secondary" onclick="window.HortOpsQuarantineModal.close()">' +

    el.innerHTML = modalHtml;
  }
};

window.HortOpsQuarantineViewerModal = window.HortOpsQuarantineModal;

  <script data-source="js/app.js">

// Main Application Controller & State Store
window.HortOpsApp = {
  state: {
    schemaVersion: 2,
    activeView: 'forward_planner',
    currentYear: 2026,
    jobs: [],
    staffList: [],
    customAssignments: {},
    customPermits: {},
    historicalSnapshots: {},
    rostering: { instructions: {}, provenance: {} },
    budgetSettings: { annualTarget: 0, defaultStandardHoursPerShift: 8 },
    slots: [],
    allShifts: [],
    clashCount: 0
  },

  init: function() {
    var storage = window.HortOpsStorage;
    var data = window.HortOpsData;
    var scheduler = window.HortOpsScheduler;

    // Load unified workspace envelope (B1)
    var ws = storage.loadWorkspace([], [], scheduler.DEFAULT_BUDGET_SETTINGS);
    this.state = this.state || {};
    this.state.schemaVersion = 2;
    this.state.jobs = ws.jobs;
    this.state.staffList = ws.roster;
    this.state.customAssignments = ws.assignments;
    this.state.rostering = ws.rostering || { instructions: {}, provenance: {} };
    this.state.historicalSnapshots = (ws.historicalSnapshots && typeof ws.historicalSnapshots === 'object' && !Array.isArray(ws.historicalSnapshots)) ? ws.historicalSnapshots : {};
    this._authoritativeSnapshotCount = (this.state.historicalSnapshots && typeof this.state.historicalSnapshots === 'object') ? Object.keys(this.state.historicalSnapshots).length : 0;
    this._allowHistoryReset = false;
    this.state.customPermits = ws.permits;
    this.state.budgetSettings = ws.budgetSettings;
    this.state.recoveryRequired = Boolean(ws.recoveryRequired);
    this.state.recoverySource = ws.recoveryRequired ? ws.recoverySource : null;
    this.state.recoveryError = ws.recoveryRequired ? ws.recoveryError : null;

    // Check for emergency recovery payload staged in sessionStorage from prior unrecovered reset
    try {
      if (typeof window !== 'undefined' && window.sessionStorage) {
        var emergencyPayload = window.sessionStorage.getItem('hort_ops_emergency_recovery_v2');
        if (emergencyPayload && (!ws || !ws.jobs || ws.jobs.length === 0)) {
          this.state.emergencyRecoveryPayload = emergencyPayload;
          this.state.recoveryRequired = true;
          this.state.recoverySource = 'emergency_session_backup';
          this.state.recoveryError = 'Detected unrecovered partial reset from prior session. Emergency backup staged for manual restoration.';
        }
      }
    } catch(e) {}

    if (ws.uiState) {
      var validViews = ['forward_planner', 'calendar', 'job_manager', 'staff_registry', 'peak_weekends', 'analytics'];
      if (ws.uiState.activeView && validViews.indexOf(ws.uiState.activeView) !== -1) {
        this.state.activeView = ws.uiState.activeView;
      }
      if (ws.uiState.currentYear && typeof ws.uiState.currentYear === 'number' && ws.uiState.currentYear >= 2020 && ws.uiState.currentYear <= 2040) {
        this.state.currentYear = ws.uiState.currentYear;
      }
    }

    this.recomputeDigest();
    this.renderCurrentView();
  },

  _commitCanonicalProposal: function(proposalOverrides) {
    try {
      if (this._autosaveBlocked) {
        console.warn('Workspace save blocked: persistent storage is safeguarded following reset failure.');
        return { success: false, error: 'Autosave blocked following reset failure' };
      }
      if (this.state && this.state.recoveryRequired) {
        console.warn('Auto-save suspended: workspace in recoveryRequired state. User must explicitly resolve recovery.');
        if (this.state) this.state.storageStatus = 'save_failed';
        return { success: false, error: 'Workspace in recoveryRequired state' };
      }

      if (this.state && !this.state.schemaVersion) {
        this.state.schemaVersion = 2;
      }

      proposalOverrides = proposalOverrides || {};
      var own = Object.prototype.hasOwnProperty;

      // Authoritative canonical domains: distinguish omitted from explicitly null/invalid; NEVER coerce with truthy defaults
      var proposedJobs;
      if (own.call(proposalOverrides, 'jobs')) {
        proposedJobs = proposalOverrides.jobs;
      } else if (this.state && own.call(this.state, 'jobs')) {
        proposedJobs = this.state.jobs;
      } else {
        proposedJobs = [];
      }

      var proposedRoster;
      if (own.call(proposalOverrides, 'roster')) {
        proposedRoster = proposalOverrides.roster;
      } else if (this.state && own.call(this.state, 'roster')) {
        proposedRoster = this.state.roster;
      } else if (this.state && own.call(this.state, 'staffList')) {
        proposedRoster = this.state.staffList;
      } else {
        proposedRoster = [];
      }

      var proposedAssignments;
      if (own.call(proposalOverrides, 'assignments')) {
        proposedAssignments = proposalOverrides.assignments;
      } else if (this.state && own.call(this.state, 'assignments')) {
        proposedAssignments = this.state.assignments;
      } else if (this.state && own.call(this.state, 'customAssignments')) {
        proposedAssignments = this.state.customAssignments;
      } else {
        proposedAssignments = {};
      }

      var proposedRostering;
      if (own.call(proposalOverrides, 'rostering')) {
        proposedRostering = proposalOverrides.rostering;
      } else if (this.state && own.call(this.state, 'rostering')) {
        proposedRostering = this.state.rostering;
      } else {
        proposedRostering = { instructions: {}, provenance: {} };
      }

      var proposedSnapshots;
      if (own.call(proposalOverrides, 'historicalSnapshots')) {
        proposedSnapshots = proposalOverrides.historicalSnapshots;
      } else if (this.state && own.call(this.state, 'historicalSnapshots')) {
        proposedSnapshots = this.state.historicalSnapshots;
      } else {
        proposedSnapshots = {};
      }

      var proposedPermits;
      if (own.call(proposalOverrides, 'permits')) {
        proposedPermits = proposalOverrides.permits;
      } else if (this.state && own.call(this.state, 'permits')) {
        proposedPermits = this.state.permits;
      } else if (this.state && own.call(this.state, 'customPermits')) {
        proposedPermits = this.state.customPermits;
      } else {
        proposedPermits = {};

      if (deps.permitOverrides > 0) reasons.push(deps.permitOverrides + ' permit overrides');
      if (deps.rosteringInstructions > 0) reasons.push(deps.rosteringInstructions + ' rostering instruction(s)');

      // Offline17.5g: Transactional retirement staged via saveJob
      var proposedJob = Object.assign({}, job, { status: 'inactive' });
      var saveResult = this.saveJob(proposedJob);
      if (!saveResult || !saveResult.success) {
        var err = (saveResult && saveResult.error) ? saveResult.error : 'Failed to retire job due to storage error.';
        if (typeof alert === 'function') alert(err);
        return { success: false, error: err, retired: false };
      }

      // Gate C (R22-03): Notify operator only AFTER retirement is successfully committed
      if (typeof alert === 'function') {
        alert('Job "' + job.name + '" has existing dependencies (' + reasons.join(', ') + '). To preserve data integrity and prevent orphaned records, it has been retired (set to Inactive) rather than permanently deleted.');
      }
      return { success: true, retired: true, dependencies: deps };
    } else {
      // Gate B3: Transactional hard delete staged via _commitCanonicalProposal
      var proposedJobs = this.state.jobs.filter(function(j) { return j.id !== jobId; });
      var commitRes = this._commitCanonicalProposal({ jobs: proposedJobs });
      if (!commitRes.success) {
        if (typeof alert === 'function') alert('Failed to delete job due to storage error. Operation rolled back.');
        return { success: false, error: commitRes.error || 'Storage error', deleted: false };
      }

      this.state.jobs = proposedJobs;
      this.state.storageStatus = (commitRes.storageMode === 'session-only') ? 'session_only' : 'saved';
      this.recomputeDigest();
      this.renderCurrentView();
      return { success: true, deleted: true };
    }
  },

  restoreWorkspaceJson: function(envelope) {
    if (!envelope || typeof envelope !== 'object') return false;

    // 1. Protocol v2 Boundary 6: Strict presence and schema validation of input
    var validator = window.HortOpsSchemaValidator;
    var adoptedData = envelope;
    if (validator && typeof validator.validateCurrentV2ForBoundary === 'function') {
      var boundaryCheck = validator.validateCurrentV2ForBoundary(envelope);
      if (!boundaryCheck.valid) {
        console.warn('Workspace restore aborted: invalid Schema v2 envelope', boundaryCheck.error);
        return false;
      }
      if (boundaryCheck.data) {
        adoptedData = boundaryCheck.data;
      }
    }

    // 2. Build one fully canonical detached restore envelope with canonical defaults for ALL optional domains (R23-B3 / FR-04)
    var defaultBudget = (window.HortOpsScheduler && window.HortOpsScheduler.DEFAULT_BUDGET_SETTINGS)
      ? JSON.parse(JSON.stringify(window.HortOpsScheduler.DEFAULT_BUDGET_SETTINGS))
      : { annualBudgetCap: 50000, hourlyBaseRate: 44.50 };

    var validViews = ['forward_planner', 'calendar', 'job_manager', 'staff_registry', 'peak_weekends', 'analytics'];
    var proposedView = (adoptedData.uiState && adoptedData.uiState.activeView && validViews.indexOf(adoptedData.uiState.activeView) !== -1)
      ? adoptedData.uiState.activeView
      : 'forward_planner';
    var rawYear = adoptedData.uiState ? (adoptedData.uiState.currentYear || adoptedData.uiState.selectedYear) : undefined;
    var proposedYear = rawYear ? (parseInt(rawYear, 10) || 2026) : 2026;

    var canonicalEnvelope = {
      schemaVersion: 2,
      jobs: Array.isArray(adoptedData.jobs) ? JSON.parse(JSON.stringify(adoptedData.jobs)) : [],
      roster: Array.isArray(adoptedData.roster) ? JSON.parse(JSON.stringify(adoptedData.roster)) : [],
      assignments: (adoptedData.assignments && typeof adoptedData.assignments === 'object') ? JSON.parse(JSON.stringify(adoptedData.assignments)) : {},
      permits: (adoptedData.permits && typeof adoptedData.permits === 'object') ? JSON.parse(JSON.stringify(adoptedData.permits)) : {},
      rostering: (adoptedData.rostering && typeof adoptedData.rostering === 'object') ? JSON.parse(JSON.stringify(adoptedData.rostering)) : { instructions: {}, provenance: {} },
      historicalSnapshots: (adoptedData.historicalSnapshots && typeof adoptedData.historicalSnapshots === 'object') ? JSON.parse(JSON.stringify(adoptedData.historicalSnapshots)) : {},
      budgetSettings: (adoptedData.budgetSettings && typeof adoptedData.budgetSettings === 'object' && adoptedData.budgetSettings !== null)
        ? JSON.parse(JSON.stringify(adoptedData.budgetSettings))
        : defaultBudget,
      uiState: (adoptedData.uiState && typeof adoptedData.uiState === 'object' && adoptedData.uiState !== null)
        ? JSON.parse(JSON.stringify(adoptedData.uiState))
        : {
            activeView: proposedView,
            currentYear: proposedYear,
            selectedDepartment: 'all',
            selectedTeam: 'all',
            onlyPreferredCrew: false,
            searchTerm: ''
          }
    };
    canonicalEnvelope.uiState.activeView = proposedView;
    canonicalEnvelope.uiState.currentYear = proposedYear;

    // 3. Persist the exact canonical envelope to storage BEFORE adopting to live state
    var saveRes = window.HortOpsStorage.saveWorkspace(canonicalEnvelope);
    if (window.HortOpsHeader && typeof window.HortOpsHeader.updateStorageHealth === 'function') {
      window.HortOpsHeader.updateStorageHealth(saveRes);
    }
    if (!saveRes || !saveRes.ok) {
      console.warn('Workspace restore aborted: persistence failed', saveRes ? saveRes.error : 'Storage error');
      if (window.HortOpsHeader && typeof window.HortOpsHeader.updateStorageHealthIndicator === 'function') {
        window.HortOpsHeader.updateStorageHealthIndicator();
      }
      return false;
    }

    // 4. Successful JSON restore exits Recovery Mode immediately (Mandate Pass 10)
    this.state.recoveryRequired = false;
    this.state.recoverySource = null;
    this.state.recoveryError = null;
    this.state.storageStatus = 'saved';
    if (window.HortOpsHeader && typeof window.HortOpsHeader.updateStorageHealthIndicator === 'function') {
      window.HortOpsHeader.updateStorageHealthIndicator();
    }

    // 5. Gate B3 / FR-04: Full live-state replacement from accepted committed data
    // Live state adopts exact detached values from canonicalEnvelope (ensuring live == committed == cold reload)
    this.state.schemaVersion = 2;
    this.state.jobs = JSON.parse(JSON.stringify(canonicalEnvelope.jobs));
    this.state.staffList = JSON.parse(JSON.stringify(canonicalEnvelope.roster));
    this.state.customAssignments = JSON.parse(JSON.stringify(canonicalEnvelope.assignments));
    this.state.rostering = JSON.parse(JSON.stringify(canonicalEnvelope.rostering));
    this.state.customPermits = JSON.parse(JSON.stringify(canonicalEnvelope.permits));
    this._allowHistoryReset = true;
    this.state.historicalSnapshots = JSON.parse(JSON.stringify(canonicalEnvelope.historicalSnapshots));
    this._authoritativeSnapshotCount = Object.keys(this.state.historicalSnapshots).length;
    this._allowHistoryReset = false;
    if (window.HortOpsScheduler && typeof window.HortOpsScheduler.clearBoundaryCache === 'function') {
      window.HortOpsScheduler.clearBoundaryCache();
    }

    this.state.budgetSettings = JSON.parse(JSON.stringify(canonicalEnvelope.budgetSettings));
    this.state.activeView = canonicalEnvelope.uiState.activeView;
    this.state.currentYear = canonicalEnvelope.uiState.currentYear;

    this.recomputeDigest();
    this.renderCurrentView();
    return true;
  },

  resetToCleanSlate: function() {
    var storage = window.HortOpsStorage;
    var resetSuccess = false;
    try {
      if (storage && typeof storage.resetWorkspace === 'function') {
        resetSuccess = storage.resetWorkspace();
      }
    } catch(e) {
      resetSuccess = false;
      console.error('Persistent reset exception:', e);
    }

    if (!resetSuccess) {
      var details = (storage && typeof storage.getLastResetResult === 'function')
        ? storage.getLastResetResult()
        : null;

      this.state.lastResetDetails = details;
      this.state.storageStatus = 'save_failed';
      // Suppress autosave to safeguard persistent storage after failed reset (Review 38 R38-01)
      this._autosaveBlocked = true;

      if (window.HortOpsHeader && typeof window.HortOpsHeader.updateStorageHealthIndicator === 'function') {
        window.HortOpsHeader.updateStorageHealthIndicator();
      }
      return false;
    }

    // 2. Clear boundary cache
    if (window.HortOpsScheduler && typeof window.HortOpsScheduler.clearBoundaryCache === 'function') {
      window.HortOpsScheduler.clearBoundaryCache();
    }
    // 3. Clear recovery state
    this.state.recoveryRequired = false;
    this.state.recoverySource = null;
    this.state.recoveryError = null;
    this.state.storageStatus = 'saved';
    this.state.lastResetDetails = null;
    this._autosaveBlocked = false;

    // 4. Reset in-memory state cleanly to clean slate
    this.state.schemaVersion = 2;
    this.state.jobs = [];
    this.state.staffList = [];
    this.state.customAssignments = {};
    this.state.customPermits = {};
    this.state.rostering = { instructions: {}, provenance: {} };
    this._allowHistoryReset = true;
    this.state.historicalSnapshots = {};
    this._authoritativeSnapshotCount = 0;
    this._allowHistoryReset = false;
    var defaultBudget = (window.HortOpsScheduler && window.HortOpsScheduler.DEFAULT_BUDGET_SETTINGS) ?
      JSON.parse(JSON.stringify(window.HortOpsScheduler.DEFAULT_BUDGET_SETTINGS)) :
      { annualTarget: 0, defaultStandardHoursPerShift: 8 };
    this.state.budgetSettings = defaultBudget;
    this.state.activeView = 'forward_planner';
    // 2026 is the canonical baseline reference year for the self-contained offline dataset
    this.state.currentYear = 2026;

    // 5. Update header health indicator
    if (window.HortOpsHeader && typeof window.HortOpsHeader.updateStorageHealthIndicator === 'function') {
      window.HortOpsHeader.updateStorageHealthIndicator();
    }

    // 6. Recompute and re-render
    this.recomputeDigest();
    this.renderCurrentView();
    return true;
  },

  reconcileStaffSnapshot: function(diff) {
    if (!diff || typeof diff !== 'object') {
      return { success: false, error: 'Invalid reconciliation diff' };
    }
    if (!window.HortOpsReconciliationEngine || typeof window.HortOpsReconciliationEngine.applyWorkforceReconciliation !== 'function') {
      return { success: false, error: 'Reconciliation engine unavailable' };
    }

    var result = window.HortOpsReconciliationEngine.applyWorkforceReconciliation(
      this.state.staffList,
      diff,
      this.state.customAssignments,
      this.state.allShifts
    );

    var proposedRoster = JSON.parse(JSON.stringify(result.reconciledRoster));
    var proposedAssignments = JSON.parse(JSON.stringify(result.reconciledAssignments));

    var commitRes = this._commitCanonicalProposal({
      roster: proposedRoster,
      assignments: proposedAssignments
    });
    if (!commitRes.success) {
      return commitRes;
    }

    this.state.staffList = proposedRoster;
    this.state.customAssignments = proposedAssignments;
    this.state.storageStatus = (commitRes.storageMode === 'session-only') ? 'session_only' : 'saved';
    this.recomputeDigest();
    this.renderCurrentView();
    return { success: true, vacatedCount: result.vacatedCount };
  },

  importStaffMembers: function(newStaffList) {
    if (!newStaffList || !Array.isArray(newStaffList)) {
      return { success: false, error: 'Invalid staff list: expected array' };
    }
    if (!window.HortOpsReconciliationEngine || typeof window.HortOpsReconciliationEngine.computeWorkforceReconciliation !== 'function') {
      return { success: false, error: 'Reconciliation engine unavailable' };
    }
    var diff = window.HortOpsReconciliationEngine.computeWorkforceReconciliation(
      this.state.staffList,
      newStaffList,
      this.state.customAssignments,
      this.state.allShifts
    );
    return this.reconcileStaffSnapshot(diff);
  },

  updateStaffMember: function(updatedStaff) {
    if (!updatedStaff || typeof updatedStaff !== 'object' || !updatedStaff.id) {
      return { success: false, error: 'Invalid staff update: missing staff id' };
    }
    var staffId = String(updatedStaff.id);
    var staffList = this.state.staffList || [];
    var idx = staffList.findIndex(function(s) { return s.id === staffId; });
    if (idx === -1) {
      return { success: false, error: 'Staff member "' + staffId + '" not found' };
    }

    var proposedRoster = JSON.parse(JSON.stringify(staffList));
    var target = proposedRoster[idx];

    for (var k in updatedStaff) {
      if (updatedStaff.hasOwnProperty(k)) {
        if (k === 'id') {
          if (String(updatedStaff[k]) !== staffId) {
            return { success: false, error: 'Cannot mutate staff identity id' };
          }
        } else {
          target[k] = JSON.parse(JSON.stringify(updatedStaff[k]));
        }
      }
    }

    var commitRes = this._commitCanonicalProposal({ roster: proposedRoster });
    if (!commitRes.success) {
      return commitRes;
    }

    this.state.staffList = proposedRoster;
    this.state.storageStatus = (commitRes.storageMode === 'session-only') ? 'session_only' : 'saved';
    this.recomputeDigest();
    this.renderCurrentView();
    return { success: true };
  },

  handleAutoStagger: function() {
    alert("Notice: Auto-Stagger on legacy anchor weeks is disabled to preserve canonical date-anchored recurrences. Please adjust job anchor dates individually in the Job Registry.");
  },

  openStaffAssignModal: function(shiftId) {
    window.HortOpsStaffAssignModal.open(shiftId);
  },

  openAddJobModal: function(targetDate, preferredDay) {
    window.HortOpsJobEditModal.open(null, targetDate, preferredDay);
  },

  openEditJobModal: function(jobId) {
    window.HortOpsJobEditModal.open(jobId);
  },

  openExportModal: function() {
    window.HortOpsExportModal.open();
  },

  openImportModal: function() {
    window.HortOpsImportModal.open();
  },

  openWarningsModal: function() {
    if (window.HortOpsWarningsModal && typeof window.HortOpsWarningsModal.open === 'function') {
      window.HortOpsWarningsModal.open();
    }
  },

  openResetWorkspaceModal: function() {
    if (window.HortOpsResetWorkspaceModal && typeof window.HortOpsResetWorkspaceModal.open === 'function') {
      window.HortOpsResetWorkspaceModal.open();
    }
  },

  openStorageHealthModal: function() {
    if (window.HortOpsStorageHealthModal && typeof window.HortOpsStorageHealthModal.open === 'function') {
      window.HortOpsStorageHealthModal.open();
    }
  },

  openQuarantineModal: function() {
    var qModal = window.HortOpsQuarantineModal || window.HortOpsQuarantineViewerModal;
    if (qModal && typeof qModal.open === 'function') {
      qModal.open();
    }
  },

  handleHealthPillClick: function() {
    if (this.state && this.state.recoveryRequired) {
      this.openQuarantineModal();
    } else {
      this.openStorageHealthModal();
    }
  }
};

// Bootstrap application on DOM ready
if (typeof document !== 'undefined') {
  document.addEventListener('DOMContentLoaded', function() {
    window.HortOpsApp.init();

    // Query parameter testing hooks
    if (window.location.search.indexOf('testVacancy=1') !== -1) {
      // Remove two staff from the first shift to demonstrate vacancies
      var s0 = window.HortOpsApp.state.allShifts[0];
      if (s0 && s0.assignedStaffIds && s0.assignedStaffIds.length >= 2) {
        window.HortOpsApp.state.customAssignments[s0.shiftId] = s0.assignedStaffIds.slice(0, 2);
        window.HortOpsApp.recomputeDigest();
        window.HortOpsApp.renderCurrentView();
      }
    } else if (window.location.search.indexOf('showAll=1') !== -1) {
      window.HortOpsForwardPlanner.hideUnassigned = false;
      window.HortOpsApp.renderCurrentView();
    } else if (window.location.search.indexOf('openAddJob') !== -1) {
      setTimeout(function() { window.HortOpsApp.openAddJobModal(); }, 50);
    } else if (window.location.search.indexOf('openStaffAssign') !== -1) {
      setTimeout(function() {
        var firstShift = window.HortOpsApp.state.allShifts[0];
        if (firstShift) window.HortOpsApp.openStaffAssignModal(firstShift.shiftId);
      }, 50);
    } else if (window.location.search.indexOf('view=') !== -1) {
      var match = window.location.search.match(/view=([a-z_]+)/);
      if (match && match[1]) {
        window.HortOpsApp.setActiveView(match[1]);
      }
    }
  });
}

</script>
