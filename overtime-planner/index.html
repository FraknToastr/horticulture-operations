    var targetDate = (typeof targetShiftId === 'string' && targetShiftId.indexOf('@') !== -1) ? targetShiftId.split('@')[1] : null;
    var targetYear = targetDate ? parseInt(targetDate.slice(0, 4), 10) : null;

    if (targetYear && window.HortOpsApp && typeof window.HortOpsApp.setYear === 'function') {
      if (state && state.currentYear !== targetYear) {

      }
    }

    var appState = window.HortOpsApp ? window.HortOpsApp.state : state;
    var targetShift = (appState && appState.allShifts) ? appState.allShifts.find(function(s) { return s.shiftId === targetShiftId; }) : null;

    if (!targetShift) {
      alert("Rostering Continuation Problem\n\nThe active future rostering instruction could not be opened.\nNo future assignments were changed.");
      return;
    }

    if (targetShift.date && appState) {
      appState.selectedDate = targetShift.date;

  removeStaff: function(staffId) {
    if (!this.stagedAssignedStaffIds) return;
    var slot = (this.stagedSlots || []).find(function(s) { return s.staffId === staffId; });
    if (slot && slot.isSealedHistorical) {
      alert("Cannot remove assignment from a sealed historical record. Future rostering continues from " + (slot.activeContinuationDate || "its active start date") + ".");
      return;
    }
    if (slot && slot.isInherited) {
      alert("Cannot remove inherited assignment directly from downstream shift. Please edit the source shift on " + (slot.sourceDate || "source") + " to modify this instruction.");
      return;
    }
    this.stagedAssignedStaffIds = this.stagedAssignedStaffIds.filter(function(id) { return id !== staffId; });
    if (this.stagedSlots) {
      this.stagedSlots = this.stagedSlots.filter(function(s) { return s.staffId !== staffId; });
    }
    if (this.stagedSlotStrategies) {
      delete this.stagedSlotStrategies[staffId];
    }
    this.renderModal();
  },

  removeAllIneligible: function() {
    if (!this.stagedAssignedStaffIds || !this.activeShiftId) return;
    var state = window.HortOpsApp.state;
    var shift = state.allShifts.find(function(s) { return s.shiftId === window.HortOpsStaffAssignModal.activeShiftId; });
    var roster = state.staffList || [];
    var allShifts = state.allShifts || [];
    var current = this.stagedAssignedStaffIds;
    var retainedIds = current.filter(function(id) {
      var staff = roster.find(function(s) { return s.id === id; });
      if (!staff) return false;
      if (window.HortOpsEligibilityEngine && typeof window.HortOpsEligibilityEngine.validateStaffEligibility === 'function') {
        var res = window.HortOpsEligibilityEngine.validateStaffEligibility(staff, shift, allShifts, current);
        var strictReasons = res.reasons.filter(function(r) { return r !== 'ALREADY_ASSIGNED_HERE'; });
        return strictReasons.length === 0;
      }
      return false;
    });
    this.stagedAssignedStaffIds = retainedIds;
    var retainedSet = new Set(retainedIds);
    if (this.stagedSlots) {
      this.stagedSlots = this.stagedSlots.filter(function(s) { return retainedSet.has(s.staffId); });
    }
    if (this.stagedSlotStrategies) {
      var self = this;
      Object.keys(this.stagedSlotStrategies).forEach(function(id) {
        if (!retainedSet.has(id)) delete self.stagedSlotStrategies[id];
      });
    }
    this.renderModal();
  },

  autoFillTeam: function(teamName) {
    var state = window.HortOpsApp.state;
    var shift = state.allShifts.find(function(s) { return s.shiftId === window.HortOpsStaffAssignModal.activeShiftId; });
    if (!shift) return;

    var roster = state.staffList || [];
    var current = this.stagedAssignedStaffIds || [];
    var vacancies = Math.max(0, shift.crewSize - current.length);
    if (vacancies <= 0) return;

    var jobs = state.jobs || [];
    var matchingJob = jobs.find(function(j) { return j.id === shift.jobId || j.name.toLowerCase() === shift.jobName.toLowerCase(); });

    var candidates = roster.filter(function(s) {
      if (s.team.toLowerCase() !== teamName.toLowerCase()) return false;
      if (current.indexOf(s.id) !== -1) return false;
      if (!window.HortOpsEligibilityEngine || typeof window.HortOpsEligibilityEngine.validateEmployeeForOccurrence !== 'function') {
        return false;
      }
      var evalRes = window.HortOpsEligibilityEngine.validateEmployeeForOccurrence({
        employee: s,
        occurrence: shift,
        job: matchingJob,
        allAssignments: state.allShifts,
        currentShiftAssignedIds: current
      });
      return evalRes.eligible;
    });

    // Prioritize eligible Plant Operators if required and not currently staffed
    var isPlantOpReq = Boolean(shift.plantOperatorRequired || (matchingJob && matchingJob.plantOperatorRequired));
    if (isPlantOpReq) {
      var currentHasOp = current.some(function(id) {
        var m = roster.find(function(s) { return s.id === id; });
        return m && m.isPlantOperator;
      });
      if (!currentHasOp) {
        candidates.sort(function(a, b) {
          if (a.isPlantOperator !== b.isPlantOperator) {
            return a.isPlantOperator ? -1 : 1;
          }
          return 0;
        });
      }
    }

    var toAdd = candidates.slice(0, vacancies).map(function(s) { return s.id; });
    if (toAdd.length > 0) {
      var self = this;
      toAdd.forEach(function(staffId) {
        var usedIndices = new Set();
        (self.stagedSlots || []).forEach(function(s) {
          var m = s.slotId && s.slotId.match(/SLOT-(\d+)/);
          if (m) usedIndices.add(parseInt(m[1], 10));
        });
        var nextIdx = 1;
        while (usedIndices.has(nextIdx)) {
          nextIdx++;
        }
        var newSlotId = 'SLOT-' + nextIdx;
        if (!self.stagedSlots) self.stagedSlots = [];
        self.stagedSlots.push({
          slotId: newSlotId,
          staffId: staffId,
          mode: 'manual',
          repeatCount: 1,
          isInherited: false,
          sourceDate: shift ? shift.date : ''
        });
        if (!self.stagedSlotStrategies) self.stagedSlotStrategies = {};
        self.stagedSlotStrategies[staffId] = { mode: 'manual', repeatCount: 1 };
      });
      this.stagedAssignedStaffIds = current.concat(toAdd);
      this.renderModal();
    }
  },

  saveAllocation: function() {
    if (!this.activeShiftId) return;
    var state = window.HortOpsApp.state;
    var shift = state.allShifts.find(function(s) { return s.shiftId === window.HortOpsStaffAssignModal.activeShiftId; });
    if (!shift) return;

    var jobs = state.jobs || [];
    var matchingJob = jobs.find(function(j) {
      if (!j) return false;
      if (shift.jobId && j.id === shift.jobId) return true;
      if (shift.jobName && j.name && typeof shift.jobName === 'string' && typeof j.name === 'string') {
        return j.name.toLowerCase() === shift.jobName.toLowerCase();
      }
      return false;
    }) || {};

    var roster = state.staffList || [];
    var current = this.stagedAssignedStaffIds || [];

    // Canonical crew-level integrity validation (Mandate Section 3, 4, 5, 26)
    if (!window.HortOpsEligibilityEngine || typeof window.HortOpsEligibilityEngine.validateCrewForOccurrence !== 'function') {
      alert("Cannot save allocation: Eligibility Engine unavailable.");
      return;
    }
    var effectiveModalShifts = getEffectiveShiftsForModal(shift);
    if (effectiveModalShifts && effectiveModalShifts.lookupFailed) {
      alert("Cannot save allocation: " + (effectiveModalShifts.errorMessage || "Adjacent-year schedule lookup failed.") + " Allocation blocked fail-closed.");
      return;
    }
    var crewVal = window.HortOpsEligibilityEngine.validateCrewForOccurrence({
      occurrence: shift,
      job: matchingJob,
      assignedStaffIds: current,
      roster: roster,
      allAssignments: effectiveModalShifts
    });
    if (!crewVal.valid && crewVal.hardBlock) {
      var firstIssue = crewVal.issues[0];
      alert("Cannot save allocation: " + (firstIssue ? firstIssue.message : "Crew violates hard integrity requirements.") + " Please assign an eligible certified Plant Operator before saving.");
      return;
    }

    // Hard ineligible assignee check (N-P0-01, P0-10) - NO "save anyway" override for hard rules
    var hardViolations = [];
    current.forEach(function(id) {
      var s = roster.find(function(m) { return m.id === id; });
      if (!s) {
        hardViolations.push({ id: id, name: id, reason: 'Staff record not found' });
        return;
      }
      if (!window.HortOpsEligibilityEngine || typeof window.HortOpsEligibilityEngine.validateStaffEligibility !== 'function') {
        hardViolations.push({ id: s.id, name: s.name || id, reason: 'Eligibility Engine unavailable' });
        return;
      }
      var res = window.HortOpsEligibilityEngine.validateStaffEligibility(s, shift, matchingJob, effectiveModalShifts, current);
      var hardReasons = res.reasons.filter(function(r) { return r !== 'ALREADY_ASSIGNED_HERE'; });
      if (hardReasons.length > 0) {
        hardViolations.push({ id: s.id, name: s.name, reason: getHumanIneligibleReason(hardReasons[0]) });
      }
    });

    if (hardViolations.length > 0) {
      var violationMsg = "Cannot save allocation: The following assigned staff violate hard eligibility constraints:\n\n" +
        hardViolations.map(function(v) { return "• " + v.name + ": " + v.reason; }).join("\n") +
        "\n\nPlease remove ineligible staff before saving.";
      alert(violationMsg);
      return;
    }

    if (!window.HortOpsRosteringEngine || typeof window.HortOpsRosteringEngine.applyRostering !== 'function') {
      alert('Cannot save allocation: Rostering engine is unavailable.');
      return;
    }

    var rosterRes = window.HortOpsRosteringEngine.applyRostering({
      job: matchingJob,
      currentShift: shift,
      stagedStaffIds: current,
      stagedSlots: this.stagedSlots || [],
      stagedStrategies: this.stagedSlotStrategies,
      allShifts: effectiveModalShifts,
      roster: roster,
      customAssignments: state.customAssignments,
      rosteringState: state.rostering,
      jobs: state.jobs || []
    });

    if (!rosterRes || !rosterRes.success) {
      alert('Cannot save allocation: Rostering engine failed to process assignment.');
      return;
    }

    // Pure scheduled-commitment delta planning (Stage 1 Gate B2)
    if (!window.HortOpsCommitmentPlanner || typeof window.HortOpsCommitmentPlanner.plan !== 'function') {
      alert('Cannot save allocation: Scheduled commitment planner unavailable.');
      return;
    }

    var todayStr = (window.HortOpsDateUtils && typeof window.HortOpsDateUtils.getLocalDateKey === 'function')
      ? window.HortOpsDateUtils.getLocalDateKey()
      : null;

    var isUnassignment = (!current || current.length === 0);
    var opType = isUnassignment ? 'future_unassignment' : 'allocation_reconciliation';

    var planRes = window.HortOpsCommitmentPlanner.plan({
      beforeAssignments: state.customAssignments || {},
      afterAssignments: rosterRes.customAssignments,
      beforeSnapshots: state.historicalSnapshots || {},
      beforeRostering: state.rostering || { instructions: {}, provenance: {} },
      afterRostering: rosterRes.rosteringState,
      prunedProvenance: rosterRes.prunedProvenance || [],
      prunedInstructions: rosterRes.prunedInstructions || [],
      authoritativeOccurrences: rosterRes.affectedOccurrences || {},
      todayKey: todayStr,
      nowIso: new Date().toISOString(),
      operation: {
        type: opType,
        sourceShiftId: shift.shiftId,
        targetShiftId: shift.shiftId
      }
    });

    if (!planRes || !planRes.ok) {
      var planErr = (planRes && planRes.error) ? planRes.error : 'Failed to plan scheduled commitment delta.';
      console.error('Commitment planner error:', planErr);
      alert('Cannot save allocation: ' + planErr);
      return;
    }

    // Stage-before-commit: build proposed Schema v2 envelope using canonical constructor
    if (!window.HortOpsStorage || typeof window.HortOpsStorage.createWorkspaceEnvelope !== 'function') {
      alert('Cannot save allocation: Canonical storage envelope constructor unavailable.');
      return;
    }

    var proposedEnvelope = window.HortOpsStorage.createWorkspaceEnvelope({
      schemaVersion: 2,
      jobs: state.jobs,
      roster: state.staffList,
      assignments: rosterRes.customAssignments,
      rostering: rosterRes.rosteringState,
      historicalSnapshots: planRes.snapshots,
      permits: state.customPermits,
      budgetSettings: state.budgetSettings,
      uiState: {
        activeView: state.activeView,
        currentYear: state.currentYear
      }
    });

    // Strict mandatory baseline reader and evidence key retention check
    var storage = window.HortOpsStorage;
    var validator = window.HortOpsSchemaValidator;
    if (!storage || typeof storage.readVerifiedCommittedV2 !== 'function') {
      alert('Cannot save allocation: verified storage baseline reader is unavailable.');
      return;
    }
    var committed = storage.readVerifiedCommittedV2();
    if (!committed || !committed.ok) {
      alert('Cannot save allocation: committed workspace failed verification (' +
            (committed && committed.error ? committed.error : 'unreadable') + ').');
      return;
    }

    var baselineEnvelope;
    if (!committed.exists) {
      baselineEnvelope = {
        historicalSnapshots: {},
        rostering: { instructions: {}, provenance: {} }
      };
    } else {
      baselineEnvelope = committed.data;
    }

    if (!validator || typeof validator.checkEvidenceKeyRetention !== 'function') {
      alert('Cannot save allocation: evidence retention validator is unavailable.');
      return;
    }

    var retentionCheck = validator.checkEvidenceKeyRetention(
      baselineEnvelope,
      proposedEnvelope,
      {
        snapshots: planRes.permittedSnapshotRemovals,
        instructions: rosterRes.prunedInstructions,
        provenance: rosterRes.prunedProvenance
      }
    );
    if (!retentionCheck.valid) {
      console.error('Cannot save allocation: evidence retention check failed:', retentionCheck.error);
      alert('Cannot save allocation: ' + retentionCheck.error);
      return;
    }

    // Persist proposed envelope through storage facade
    var saveRes = storage.saveWorkspace(proposedEnvelope);
    if (!saveRes || !saveRes.ok) {
      var saveErr = (saveRes && saveRes.error) ? saveRes.error : 'Storage persistence failed';
      console.error('Cannot save allocation: ' + saveErr);
      alert('Cannot save allocation: The resulting workspace could not be persisted. Live state remains unchanged.');
      return;
    }

    // Atomic adoption only AFTER successful verified commit
    state.customAssignments = rosterRes.customAssignments;
    state.rostering = rosterRes.rosteringState;
    state.historicalSnapshots = planRes.snapshots;
    state.lastRosteringAudit = rosterRes.auditLog;
    state.storageStatus = (saveRes && saveRes.storageMode === 'session-only') ? 'session_only' : 'saved';
    window.HortOpsApp._authoritativeSnapshotCount = Object.keys(planRes.snapshots).length;

    // Invalidate relevant boundary caches, recompute digest and refresh view
    window.HortOpsApp.recomputeDigest();
    window.HortOpsApp.renderCurrentView();
    this.close();
  }
};

/* === INLINED: js/components/jobEditModal/formValidator.js === */
// Job Edit Modal Form Validator Sub-module
// Performs pre-save validation across recurrence rules, frequency requirements, and dates.
window.HortOpsJobEditFormValidator = {
  validate: function(formData) {
    if (!formData || !formData.name || !formData.name.trim()) {
      return { valid: false, message: 'Please specify a valid Job Name.' };
    }

    // P0-07, P0-09, N-P1-02: Validation by frequency type
    if (formData.frequencyType === 'one_off') {
      if (!formData.targetDate) {
        return { valid: false, message: 'Please specify an overtime date for this one-off shift.' };
      }
      var d = new Date(formData.targetDate + 'T12:00:00');
      var dayOfWeek = d.getDay(); // 0 Sun, 1 Mon, 2 Tue, 3 Wed, 4 Thu, 5 Fri, 6 Sat
      if (dayOfWeek >= 2 && dayOfWeek <= 4) {
        return {
          valid: false,
          message: 'Unsupported one-off overtime date: Scheduled overtime operations occur exclusively on Friday, Saturday, Sunday, or Monday.'
        };
      }
    } else if (formData.frequencyType === 'annual') {
      if (!formData.targetMonth) {
        formData.targetMonth = 2; // Default February
      }
    } else if (formData.frequencyType === 'recurring_weeks') {
      if (!formData.anchorDate) {
        return { valid: false, message: 'Please specify an Anchor Date (YYYY-MM-DD) for this recurring job.' };
      }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(formData.anchorDate)) {
        return { valid: false, message: 'Invalid Anchor Date format. Please use YYYY-MM-DD.' };
      }

      var anchorDt = new Date(formData.anchorDate + 'T12:00:00');
      var anchorDayOfWeek = anchorDt.getDay(); // 0 Sun, 1 Mon, 5 Fri, 6 Sat
      var pref = (formData.preferredDay || 'saturday').toLowerCase();
      var expectedDayOfWeek = (pref === 'sunday') ? 0
                            : (pref === 'monday' || pref === 'monday_post_holiday') ? 1
                            : (pref === 'friday' || pref === 'friday_pre_holiday') ? 5
                            : 6;
      if (anchorDayOfWeek !== expectedDayOfWeek) {
        var dayNames = { 0: 'Sunday', 1: 'Monday', 5: 'Friday', 6: 'Saturday' };
        return {
          valid: false,
          message: 'Anchor Start Date must fall on the selected preferred overtime day (' + (formData.preferredDay || 'Saturday') + '). The selected date falls on ' + (dayNames[anchorDayOfWeek] || 'an unsupported weekday') + '.'
        };
      }

      if (window.HortOpsDateUtils && window.HortOpsDateUtils.calculateWeekFromDate) {
        formData.anchorWeek = window.HortOpsDateUtils.calculateWeekFromDate(formData.anchorDate);
      }
      if (!formData.intervalWeeks || formData.intervalWeeks < 1) {
        formData.intervalWeeks = 4;
      }
    }

    var primary = formData.primaryTeam || formData.defaultTeam || 'Parks';
    formData.primaryTeam = primary;
    formData.defaultTeam = primary;
    formData.preferredTeam = primary;

    return { valid: true };
  },
  // Offline17.5f: Resolves chronologically ordered occurrence dates for an instruction
  resolveInstructionOccurrences: function(job, startShiftIdOrDate, repeatCount) {
    if (!job || !startShiftIdOrDate) return [];
    var count = Math.max(1, parseInt(repeatCount, 10) || 1);
    var sDate = startShiftIdOrDate.indexOf('@') !== -1 ? startShiftIdOrDate.split('@')[1] : startShiftIdOrDate;
    var baseYear = parseInt(sDate.split('-')[0], 10) || new Date().getFullYear();
    var shiftId = startShiftIdOrDate.indexOf('@') !== -1 ? startShiftIdOrDate : (job.id + '@' + startShiftIdOrDate);

    // Inactive jobs generate no occurrences
    if (String(job.status || '').trim().toLowerCase() !== 'active') {
      return [];
    }

    if (!window.HortOpsScheduler || typeof window.HortOpsScheduler.generateOperationalDigest !== 'function') {
      return [sDate];
    }

    var digest = window.HortOpsScheduler.generateOperationalDigest([job], baseYear);
    var baseShifts = (digest && digest.allShifts) ? digest.allShifts.filter(function(s) { return s && s.jobId === job.id; }) : [];

    if (!window.HortOpsRosteringEngine || typeof window.HortOpsRosteringEngine.resolveRemainingOccurrences !== 'function') {
      var found = baseShifts.find(function(s) { return s.shiftId === shiftId || s.date === sDate; });
      return found ? [found.date] : [];
    }

    var remaining = window.HortOpsRosteringEngine.resolveRemainingOccurrences(
      shiftId,
      baseShifts,
      job,
      count + 2,
      [job]
    );

    return remaining.slice(0, count).map(function(s) { return s.date; });
  },

  // Offline17.5i: Detects if proposed Job mutations alter operational occurrence generation
  doesProposedJobChangeOperationalSchedule: function(existingJob, proposedJob) {
    if (!existingJob || !proposedJob) return false;
    var recurrenceFields = ['frequencyType', 'intervalWeeks', 'anchorDate', 'anchorWeek', 'targetDate', 'targetMonth', 'preferredDay', 'status'];
    return recurrenceFields.some(function(field) {
      if (proposedJob[field] === undefined && existingJob[field] === undefined) return false;
      return String(proposedJob[field] || '') !== String(existingJob[field] || '');
    });
  },

  // Offline17.5f & 17.5i: Scheduling compatibility guard for active future rostering
  validateSchedulingCompatibility: function(existingJob, formData, workspace) {
    if (!existingJob || typeof existingJob !== 'object' || !formData || typeof formData !== 'object') {
      return { valid: true };
    }

    var hasRecurrenceChanged = this.doesProposedJobChangeOperationalSchedule(existingJob, formData);

    if (!hasRecurrenceChanged) {
      return { valid: true };
    }

    var state = workspace || (window.HortOpsApp ? window.HortOpsApp.state : null) || {};
    var instructions = (state.rostering && state.rostering.instructions) || {};
    var todayStr = (window.HortOpsDateUtils && typeof window.HortOpsDateUtils.getLocalDateKey === 'function')
      ? window.HortOpsDateUtils.getLocalDateKey()
      : new Date().toISOString().slice(0, 10);

    var isStatusDeactivating = (formData.status !== undefined) &&
                               (String(formData.status).toLowerCase() !== 'active') &&
                               (String(existingJob.status || '').toLowerCase() === 'active');

    var candidateMergedJob = Object.assign({}, existingJob, formData);
    var instructionsToSeal = [];
    var instKeys = Object.keys(instructions);

    for (var i = 0; i < instKeys.length; i++) {
      var inst = instructions[instKeys[i]];
      if (!inst || inst.jobId !== existingJob.id) continue;

      // Historical instructions are sealed recorded facts and NEVER block Job schedule changes
      if (inst.status === 'historical') continue;

      var status = inst.status || 'active';
      if (status !== 'active') continue;

      var sDate = inst.startDate;
      if (!sDate && inst.sourceShiftId && inst.sourceShiftId.indexOf('@') !== -1) {
        sDate = inst.sourceShiftId.split('@')[1];
      }
      if (!sDate) continue;

      var repeatCount = Math.max(1, parseInt(inst.repeatCount, 10) || 1);

      // Resolve current occurrence sequence under existingJob
      var currentOccs = this.resolveInstructionOccurrences(existingJob, inst.sourceShiftId || sDate, repeatCount);
      var currentFutureOccs = currentOccs.filter(function(d) { return d >= todayStr; });

      // Offline17.5g: Fail-closed on unresolvable active instructions.
      // If status === 'active' and currentOccs is empty, the instruction claims active authority
      // but cannot be resolved against the existing schedule. This must fail closed.
      if (status === 'active' && currentOccs.length === 0) {
        return {
          valid: false,
          message: 'Active rostering for this Job could not be resolved against the current schedule. Resolve the rostering integrity issue before changing the Job.'
        };
      }

      // Offline17.5i: If instruction has no future work under existingJob, it is fully exhausted.
      // Any schedule-affecting Job mutation (recurrence change or retirement) must seal exhausted
      // active instructions to historical before the mutation takes effect, preventing recurrence
      // changes from resurrecting completed instructions into future scope.
      if (currentFutureOccs.length === 0) {
        instructionsToSeal.push(inst.id || instKeys[i]);
        continue;
      }

      if (isStatusDeactivating) {
        return {
          valid: false,
          message: 'This Job has active future rostering and cannot be made inactive until that rostering is ended or revised.'
        };
      }

      // Resolve proposed occurrence sequence under candidateMergedJob
      var proposedOccs = this.resolveInstructionOccurrences(candidateMergedJob, inst.sourceShiftId || sDate, repeatCount);
      var proposedFutureOccs = proposedOccs.filter(function(d) { return d >= todayStr; });

      var isMatch = (currentFutureOccs.length === proposedFutureOccs.length) &&
                    currentFutureOccs.every(function(d, idx) { return d === proposedFutureOccs[idx]; });

      if (!isMatch) {
        return {
          valid: false,
          message: 'This Job has active future rostering based on its current schedule. End or revise that rostering before changing the Job schedule.'
        };
      }
    }

    // Check future manual assignments / custom assignments (ignoring historical-sealed records)
    var assignments = state.customAssignments || state.assignments || {};
    var prov = (state.rostering && state.rostering.provenance) || {};
    var assignKeys = Object.keys(assignments);
    for (var a = 0; a < assignKeys.length; a++) {
      var aKey = assignKeys[a];
      if (aKey.indexOf(existingJob.id + '@') === 0 || aKey.indexOf(existingJob.id + '_') === 0) {
        var aDate = aKey.indexOf('@') !== -1 ? aKey.split('@')[1] : aKey.split('_')[1];
        var staffIds = assignments[aKey] || [];
        if (aDate >= todayStr && staffIds.length > 0) {
          // If all assignees on this shift belong to sealed historical instructions, do not block
          var hasActiveOrManual = false;
          for (var s = 0; s < staffIds.length; s++) {
            var pEntry = prov[aKey + ':' + staffIds[s]];
            if (pEntry && pEntry.instructionId) {
              var linkedInst = instructions[pEntry.instructionId];
              // Offline17.5j (Invariant I2 Defence-in-Depth):
              // If an assignment on or after today resolves via provenance to a historical instruction,
              // treat this as an integrity contradiction and fail closed rather than ignoring it.
              if (linkedInst && linkedInst.status === 'historical') {
                return {
                  valid: false,
                  message: 'Future assignment on ' + aDate + ' is linked to a historical instruction. Resolve this rostering contradiction before changing the Job.'
                };
              }
            }
            hasActiveOrManual = true;
            break;
          }

          if (!hasActiveOrManual) {
            continue;
          }

          var isStillValid = false;
          if (String(candidateMergedJob.status || '').trim().toLowerCase() === 'active') {
            if (window.HortOpsScheduler && typeof window.HortOpsScheduler.isCanonicalOperationalOccurrence === 'function') {
              isStillValid = window.HortOpsScheduler.isCanonicalOperationalOccurrence(candidateMergedJob, aDate);
            } else if (window.HortOpsSchedulerEngine && typeof window.HortOpsSchedulerEngine.isCanonicalOperationalOccurrence === 'function') {
              isStillValid = window.HortOpsSchedulerEngine.isCanonicalOperationalOccurrence(candidateMergedJob, aDate);
            }
          }
          if (!isStillValid) {
            if (isStatusDeactivating) {
              return {
                valid: false,
                message: 'This Job has active future rostering and cannot be made inactive until that rostering is ended or revised.'
              };
            }
            return {
              valid: false,
              message: 'This Job has active future rostering based on its current schedule. End or revise that rostering before changing the Job schedule.'
            };
          }
        }
      }
    }

    return { valid: true, instructionsToSeal: instructionsToSeal };
  },

  // Offline17.5h: Shared lifecycle transition helper for status changes
  prepareJobStatusTransition: function(existingJob, proposedStatus, workspace) {
    if (!existingJob) return { allowed: false, instructionsToSeal: [], reason: 'Job not found' };
    var candidate = Object.assign({}, existingJob, { status: proposedStatus });
    var res = this.validateSchedulingCompatibility(existingJob, candidate, workspace);
    return {
      allowed: res.valid,
      instructionsToSeal: res.instructionsToSeal || [],
      reason: res.message || null
    };
  },

  // Offline17.5i: General schedule mutation helper
  prepareJobScheduleMutation: function(existingJob, proposedChanges, workspace) {
    if (!existingJob) return { allowed: false, instructionsToSeal: [], reason: 'Job not found' };
    var candidate = Object.assign({}, existingJob, proposedChanges);
    var res = this.validateSchedulingCompatibility(existingJob, candidate, workspace);
    return {
      allowed: res.valid,
      instructionsToSeal: res.instructionsToSeal || [],
      reason: res.message || null
    };
  },

  validateRecurrenceCompatibility: function(existingJob, formData, workspace) {
    return this.validateSchedulingCompatibility(existingJob, formData, workspace);
  }
};
</script>

/* === INLINED: js/components/jobEditModal.js === */
// Job Add / Edit Modal Component
// Sole Public Facade for Job Editing: delegates UI sections to sub-modules while retaining state and action handlers.
window.HortOpsJobEditModal = {
  editingJobId: null,
  formData: null,

  open: function(jobId, targetDate, preferredDay) {
    this.editingJobId = jobId;
    var state = window.HortOpsApp.state;

    if (jobId) {
      var job = state.jobs.find(function(j) { return j.id === jobId; });
      if (job) {
        this.formData = JSON.parse(JSON.stringify(job));
        this.formData.plantOperatorRequired = !!job.plantOperatorRequired;
      }
    } else {
      this.formData = {
        id: 'job-' + Date.now(),
        name: '',
        frequencyType: targetDate ? 'one_off' : 'recurring_weeks',
        intervalWeeks: 4,
        anchorWeek: 1,
        expectedAnnualShifts: 13,
        startTime: '06:00 AM',
        durationHours: 6,
        crewSize: 3,
        targetDate: targetDate || '',
        preferredDay: preferredDay || 'saturday',
        status: 'active',
        category: 'Parklands',
        color: '#047857',
        plantOperatorRequired: false,
        requiresWZTM: false,
        requiresTPO: false,
        notes: '',
        locationDetails: '',
        defaultDepartment: 'Horticulture',
        defaultTeam: 'Parks',
        primaryTeam: 'Parks',
        secondaryTeam: '',
        tertiaryTeam: '',
        isExclusiveTeams: false,
        exclusiveTeams: []
      };
    }

    if (window.HortOpsModalUtils) window.HortOpsModalUtils.lockBackgroundScroll();
    this.renderModal();
  },

  close: function() {
    this.editingJobId = null;
    this.formData = null;
    var el = document.getElementById('job-edit-modal-root');
    if (el) el.innerHTML = '';
    if (window.HortOpsModalUtils) window.HortOpsModalUtils.unlockBackgroundScroll();
  },

  renderModal: function() {
    var el = document.getElementById('job-edit-modal-root');
    if (!el || !this.formData) return;

    var escapeHtml = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtml) || function(s) { return s || ''; };
    var escapeAttr = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtmlAttr) || function(s) { return s || ''; };
    var escHtml = escapeHtml;
    var escAttr = escapeAttr;
    var icons = window.HortOpsIcons;
    var data = this.formData;
    var roster = (window.HortOpsApp && window.HortOpsApp.state && window.HortOpsApp.state.staffList) || [];
    var hierarchy = window.HortOpsData.getDepartmentHierarchy(roster);

    var deptMap = {};
    hierarchy.forEach(function(d) {
      deptMap[d.name] = d.teams.map(function(t) { return t.name; });
    });

    // Section 18: Preserve existing job suitability values if historical department/team no longer in current hierarchy
    if (data.defaultDepartment && !deptMap[data.defaultDepartment]) {
      deptMap[data.defaultDepartment] = [data.primaryTeam || data.defaultTeam || 'General'];
    }
    if (data.primaryTeam && deptMap[data.defaultDepartment] && deptMap[data.defaultDepartment].indexOf(data.primaryTeam) === -1) {
      deptMap[data.defaultDepartment].unshift(data.primaryTeam);
    }

    var depts = Object.keys(deptMap);
    var availableTeams = deptMap[data.defaultDepartment] || ['General'];

    // Team options for secondary/tertiary with selected state & historical preservation (Mandate Pass 10)
    var allKnownTeams = [];
    depts.forEach(function(d) {
      (deptMap[d] || []).forEach(function(t) { allKnownTeams.push(t); });
    });

    var ctx = {
      data: data,
      depts: depts,
      deptMap: deptMap,
      availableTeams: availableTeams,
      allKnownTeams: allKnownTeams,
      icons: icons,
      escHtml: escHtml,
      escAttr: escAttr
    };

    var teamPreferencesHtml = window.HortOpsJobEditTeamPreferences ?
      window.HortOpsJobEditTeamPreferences.render(ctx) : '';
    var recurrenceFormHtml = window.HortOpsJobEditRecurrenceForm ?
      window.HortOpsJobEditRecurrenceForm.render(ctx) : '';

    var modalHtml = '<div class="modal-overlay" onclick="if(event.target === this) window.HortOpsJobEditModal.close()">' +
      '<div class="modal-card modal-lg">' +
        '<div class="modal-header">' +
          '<div style="display: flex; align-items: center; gap: 0.5rem;">' +
            '<span style="width: 12px; height: 12px; border-radius: 50%; background: ' + escapeAttr(data.color || '#047857') + ';"></span>' +
            '<h2 style="font-size: 1.1rem; font-weight: 800; color: var(--slate-900);">' +
              (this.editingJobId ? ('Edit Job: ' + escHtml(data.name || '')) : 'Create New Horticultural Job') +
            '</h2>' +
          '</div>' +
          '<button type="button" class="btn btn-secondary" style="padding: 0.3rem 0.5rem;" onclick="window.HortOpsJobEditModal.close()">' +
            icons.render('x', 'w-4 h-4') +
          '</button>' +
        '</div>' +

        '<form class="modal-form" onsubmit="window.HortOpsJobEditModal.handleSubmit(event)">' +
          '<div class="modal-body" style="display: flex; flex-direction: column; gap: 0.85rem;">' +
            // Row 1: Basic Info
            '<div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0.75rem;">' +
              '<div>' +
                '<label style="display: block; font-weight: 700; font-size: 12px; margin-bottom: 0.25rem;">Job Name *</label>' +
                '<input type="text" class="form-input" required value="' + escAttr(data.name || '') + '" oninput="window.HortOpsJobEditModal.updateField(\'name\', this.value)" />' +
              '</div>' +
              '<div>' +
                '<label style="display: block; font-weight: 700; font-size: 12px; margin-bottom: 0.25rem;">Category</label>' +
                '<select class="form-select" onchange="window.HortOpsJobEditModal.updateField(\'category\', this.value)">' +
                  ['Parklands', 'CBD Corridor', 'Arterial Road', 'Biodiversity', 'Sports Fields', 'Infrastructure'].map(function(c) {
                    return '<option value="' + c + '"' + (data.category === c ? ' selected' : '') + '>' + c + '</option>';
                  }).join('') +
                '</select>' +
              '</div>' +
              '<div>' +
                '<label style="display: block; font-weight: 700; font-size: 12px; margin-bottom: 0.25rem;">Color Tag</label>' +
                '<input type="color" class="form-input" style="height: 32px; padding: 2px;" value="' + escapeAttr(data.color || '#047857') + '" onchange="window.HortOpsJobEditModal.updateField(\'color\', this.value)" />' +
              '</div>' +
      '</div>' +
      '<div>' +
        '<label style="display: block; font-weight: 700; font-size: 12px; margin-bottom: 0.25rem;">Location</label>' +
        '<input type="text" class="form-input" value="' + escapeAttr(data.locationDetails || '') + '" oninput="window.HortOpsJobEditModal.updateField(\'locationDetails\', this.value)" />' +
      '</div>' +

      // Row 2: Team Preferences & Exclusive Rules
            teamPreferencesHtml +

            // Row 3: Operational Requirements
            '<div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0.75rem;">' +
              '<div>' +
                '<label style="display: block; font-weight: 700; font-size: 12px; margin-bottom: 0.25rem;">Crew Size Required</label>' +
                '<input type="number" min="1" max="20" class="form-input" value="' + (data.crewSize || 3) + '" oninput="window.HortOpsJobEditModal.updateField(\'crewSize\', parseInt(this.value, 10))" />' +
              '</div>' +
              '<div>' +
                '<label style="display: block; font-weight: 700; font-size: 12px; margin-bottom: 0.25rem;">Duration (Hours)</label>' +
                '<input type="number" min="1" max="12" class="form-input" value="' + (data.durationHours || 6) + '" oninput="window.HortOpsJobEditModal.updateField(\'durationHours\', parseInt(this.value, 10))" />' +
              '</div>' +
              '<div>' +
                '<label style="display: block; font-weight: 700; font-size: 12px; margin-bottom: 0.25rem;">Start Time</label>' +
                '<input type="text" class="form-input" value="' + escapeAttr(data.startTime || '06:00 AM') + '" oninput="window.HortOpsJobEditModal.updateField(\'startTime\', this.value)" />' +
              '</div>' +
              '<div>' +
                '<label style="display: block; font-weight: 700; font-size: 12px; margin-bottom: 0.25rem;">Preferred Day</label>' +
                '<select class="form-select" onchange="window.HortOpsJobEditModal.updateField(\'preferredDay\', this.value)">' +
                  '<option value="saturday"' + (data.preferredDay === 'saturday' ? ' selected' : '') + '>Saturday</option>' +
                  '<option value="sunday"' + (data.preferredDay === 'sunday' ? ' selected' : '') + '>Sunday</option>' +
                  '<option value="friday"' + (data.preferredDay === 'friday' ? ' selected' : '') + '>Friday</option>' +
                  '<option value="monday"' + (data.preferredDay === 'monday' ? ' selected' : '') + '>Monday</option>' +
                '</select>' +
              '</div>' +
            '</div>' +

            // Plant Operator Requirement (Mandate Section 10)
            '<div style="background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 0.5rem 0.75rem;">' +
              '<label style="display: flex; align-items: flex-start; gap: 0.5rem; cursor: pointer;">' +
                '<input type="checkbox" ' + (data.plantOperatorRequired ? 'checked' : '') + ' onchange="window.HortOpsJobEditModal.updateField(\'plantOperatorRequired\', this.checked)" style="margin-top: 2px;" />' +
                '<div>' +
                  '<span style="font-weight: 700; font-size: 13px; color: var(--slate-800); display: flex; align-items: center; gap: 0.35rem;">' +
                    icons.render('shield', 'w-3.5 h-3.5 text-amber-700') +
                    'Requires Certified Plant Operator' +
                  '</span>' +
                  '<div style="font-size: 11px; color: var(--slate-500); margin-top: 1px;">At least one crew member assigned to this job must hold an active plant operator ticket.</div>' +
                '</div>' +
              '</label>' +
            '</div>' +

            // Row 4: Cadence & Frequency-Specific Configuration (P0-07)
            recurrenceFormHtml +

      // Row 5: Regulatory Permits & Approvals
            '<div style="background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 0.75rem;">' +
              '<label style="display: block; font-weight: 700; font-size: 12px; color: #92400e; margin-bottom: 0.5rem;">Regulatory Permits & Corridor Approvals</label>' +
              '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">' +
                '<label style="display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.5rem; background: #ffffff; border: 1px solid #fcd34d; border-radius: 6px; cursor: pointer;">' +
                  '<input type="checkbox" ' + (data.requiresWZTM ? 'checked' : '') + ' onchange="window.HortOpsJobEditModal.updateField(\'requiresWZTM\', this.checked)" />' +
                  '<div>' +
                    '<div style="font-weight: 700; font-size: 12px; color: #78350f;">Work Zone Traffic Management (WZTM)</div>' +
                    '<div style="font-size: 11px; color: #92400e;">Mandatory for road medians, arterial corridors, or lane closures</div>' +
                  '</div>' +
                '</label>' +
                '<label style="display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.5rem; background: #ffffff; border: 1px solid #fcd34d; border-radius: 6px; cursor: pointer;">' +
                  '<input type="checkbox" ' + (data.requiresTPO ? 'checked' : '') + ' onchange="window.HortOpsJobEditModal.updateField(\'requiresTPO\', this.checked)" />' +
                  '<div>' +
                    '<div style="font-weight: 700; font-size: 12px; color: #78350f;">Tram Protection Order (TPO)</div>' +
                    '<div style="font-size: 11px; color: #92400e;">Mandatory for operations within tramline electrical clearance zones</div>' +
                  '</div>' +
                '</label>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="modal-footer">' +
            '<button type="button" class="btn btn-secondary" onclick="window.HortOpsJobEditModal.close()">Cancel</button>' +
            '<button type="submit" class="btn btn-primary">Save Job Definition</button>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';

    el.innerHTML = modalHtml;

    // Delegated click listener for exclusive team chips (P0 Security: no inline JS evaluation)
    var modalRoot = document.getElementById('job-edit-modal-root');
    if (modalRoot) {
      modalRoot.onclick = function(e) {
        var chip = e.target.closest('button.btn-exclusive-chip[data-team]');
        if (chip) {
          e.preventDefault();
          window.HortOpsJobEditModal.toggleExclusiveTeam(chip.getAttribute('data-team'));
        }
      };
    }
  },

  handleAnchorDateChange: function(val) {
    this.formData.anchorDate = val;
    if (val && window.HortOpsDateUtils && window.HortOpsDateUtils.calculateWeekFromDate) {
      var w = window.HortOpsDateUtils.calculateWeekFromDate(val);
      this.formData.anchorWeek = w;
      var el = document.getElementById('jem-anchor-week');
      if (el) el.value = w;
    }
  },

  updateField: function(field, val) {
    this.formData[field] = val;
  },

  handleDeptChange: function(newDept) {
    this.formData.defaultDepartment = newDept;
    var roster = (window.HortOpsApp && window.HortOpsApp.state && window.HortOpsApp.state.staffList) || [];
    var hierarchy = window.HortOpsData.getDepartmentHierarchy(roster);
    var dept = hierarchy.find(function(d) { return d.name === newDept; });
    var firstTeam = dept && dept.teams[0] ? dept.teams[0].name : 'General';
    this.formData.defaultTeam = firstTeam;
    this.formData.primaryTeam = firstTeam;
    this.renderModal();
  },

  toggleExclusiveCheck: function(checked) {
    this.formData.isExclusiveTeams = checked;
    if (checked && (!this.formData.exclusiveTeams || this.formData.exclusiveTeams.length === 0)) {
      var primary = this.formData.primaryTeam || this.formData.defaultTeam;
      if (primary) this.formData.exclusiveTeams = [primary];
    }
    this.renderModal();
  },

  toggleExclusiveTeam: function(team) {
    var list = this.formData.exclusiveTeams || [];
    var idx = list.indexOf(team);
    if (idx === -1) {
      list.push(team);
    } else {
      list.splice(idx, 1);
    }
    this.formData.exclusiveTeams = list;
    this.renderModal();
  },

  addPreferredToExclusive: function() {
    var p = this.formData.primaryTeam || this.formData.defaultTeam;
    var s = this.formData.secondaryTeam;
    var t = this.formData.tertiaryTeam;
    var toAdd = [p, s, t].filter(Boolean);
    var list = this.formData.exclusiveTeams || [];
    toAdd.forEach(function(item) {
      if (list.indexOf(item) === -1) list.push(item);
    });
    this.formData.exclusiveTeams = list;
    this.renderModal();
  },

  clearExclusive: function() {
    this.formData.exclusiveTeams = [];
    this.renderModal();
  },

  handleSubmit: function(e) {
    if (e) e.preventDefault();
    if (!this.formData) return;

    if (window.HortOpsJobEditFormValidator) {
      var validation = window.HortOpsJobEditFormValidator.validate(this.formData);
      if (!validation.valid) {
        if (validation.message) alert(validation.message);
        return;
      }
      var existingJob = (window.HortOpsApp && window.HortOpsApp.state && window.HortOpsApp.state.jobs)
        ? window.HortOpsApp.state.jobs.find(function(j) { return j.id === this.formData.id; }.bind(this))
        : null;
      var compat = window.HortOpsJobEditFormValidator.validateRecurrenceCompatibility(existingJob, this.formData);
      if (!compat.valid) {
        if (compat.message) alert(compat.message);
        return;
      }
    } else {
      if (!this.formData.name || !this.formData.name.trim()) return;
      var primary = this.formData.primaryTeam || this.formData.defaultTeam || 'Parks';
      this.formData.primaryTeam = primary;
      this.formData.defaultTeam = primary;
      this.formData.preferredTeam = primary;
    }

    var saveRes = window.HortOpsApp.saveJob(this.formData);
    if (saveRes && saveRes.success === false) {
      return;
    }
    this.close();
  }
};

</script>

/* === INLINED: js/components/exportModal.js === */
// Export Modal Component (100% Client-side Blob download, Mandate Sections 2.2 & 13.2)
window.HortOpsExportModal = {
  downloadFile: function(content, filename, mimeType) {
    mimeType = mimeType || 'text/plain;charset=utf-8;';
    var blob = new Blob([content], { type: mimeType });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 1000);
  },

  downloadCsv: function(filename, content) {
    this.downloadFile(content, filename, 'text/csv;charset=utf-8;');
  },

  exportBackupJson: function() {
    var state = (window.HortOpsApp && window.HortOpsApp.state) ? window.HortOpsApp.state : {};
    var validator = window.HortOpsSchemaValidator;
    var storage = window.HortOpsStorage;

    function abortBackup(errText) {
      console.error('Cannot export backup: ' + errText);
      if (typeof alert === 'function') {
        alert('Cannot export backup: ' + errText);
      }
      return false;
    }

    if (!storage || typeof storage.readVerifiedCommittedV2 !== 'function') {
      return abortBackup('Storage baseline reader is unavailable');
    }

    // 1. Build explicit live projection (Gate B1: no masking || {} fallbacks on evidence maps)
    var liveProjection = {
      schemaVersion: 2,
      lastSaved: new Date().toISOString(),
      jobs: state.jobs,
      roster: state.staffList,
      assignments: state.customAssignments,
      rostering: state.rostering,
      permits: state.customPermits,
      budgetSettings: state.budgetSettings,
      historicalSnapshots: state.historicalSnapshots,
      uiState: {
        activeView: state.activeView,
        currentYear: state.currentYear
      }
    };

    // 2. Validate live candidate before writing via canonical constructor (Gate B1 consolidation)
    if (!storage || typeof storage.createWorkspaceEnvelope !== 'function') {
      return abortBackup('Canonical workspace envelope constructor is unavailable');
    }
    var liveEnvelope;
    try {
      liveEnvelope = storage.createWorkspaceEnvelope(liveProjection);
    } catch (errEnvelope) {
      return abortBackup(errEnvelope.message || String(errEnvelope));

        '<td style="padding: 0.4rem;">' + esc(s.email || '—') + '</td>' +
        '<td style="padding: 0.4rem;">' + esc(s.department) + '</td>' +
        '<td style="padding: 0.4rem;">' + esc(s.team) + '</td>' +
        '<td style="padding: 0.4rem;">' + esc(s.role) + '</td>' +
      '</tr>';
    }).join('');

    return '<table style="width: 100%; border-collapse: collapse;">' +
      '<thead><tr style="background: var(--slate-50); font-size: 11px; text-transform: uppercase; color: var(--slate-600); text-align: left;"><th style="padding: 0.4rem;">Name</th><th style="padding: 0.4rem;">Email</th><th style="padding: 0.4rem;">Department</th><th style="padding: 0.4rem;">Team</th><th style="padding: 0.4rem;">Role</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
  },

  renderUpdatedTable: function(updatedList) {
    if (!updatedList || updatedList.length === 0) {
      return '<div style="text-align: center; color: var(--slate-400); font-size: 12px; padding: 1rem;">No updated records.</div>';
    }
    var esc = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtml) || function(s) { return s; };
    var rows = updatedList.map(function(u) {
      var s = u.staff;
      var changes = u.changedFields.map(function(f) {
        return '<strong>' + esc(f) + ':</strong> ' + esc(u.previousValues[f]) + ' &rarr; ' + esc(s[f]);
      }).join(', ');

      return '<tr style="border-bottom: 1px solid var(--slate-100); font-size: 12px;">' +
        '<td style="padding: 0.4rem; font-weight: 600;">' + esc(s.name) + '</td>' +
        '<td style="padding: 0.4rem;">' + esc(s.team) + '</td>' +
        '<td style="padding: 0.4rem; color: #0369a1;">' + changes + '</td>' +
      '</tr>';
    }).join('');

    return '<table style="width: 100%; border-collapse: collapse;">' +
      '<thead><tr style="background: var(--slate-50); font-size: 11px; text-transform: uppercase; color: var(--slate-600); text-align: left;"><th style="padding: 0.4rem;">Name</th><th style="padding: 0.4rem;">Team</th><th style="padding: 0.4rem;">Changed Attributes</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
  },

  setTab: function(tab) {
    this.activeTab = tab;
    this.renderModal();
  },

  handleFileSelect: function(e) {
    var file = e.target.files[0];
    if (!file) return;

    this.fileName = file.name + ' (' + Math.round(file.size / 1024) + ' KB)';
    var self = this;

    var reader = new FileReader();
    if (file.name.toLowerCase().endsWith('.json')) {
      this.isJsonMode = true;
      reader.onload = function(evt) {
        self.processJsonContent(evt.target.result);
      };
      reader.readAsText(file);
    } else {
      this.isJsonMode = false;
      reader.onload = function(evt) {
        self.processCsvContent(evt.target.result);
      };
      reader.readAsText(file);
    }
  },

  processJsonContent: function(jsonText) {
    var errEl = document.getElementById('import-error-area');
    var esc = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtml) || function(s) { return s || ''; };
    try {
      // Canonical JSON import preparation pipeline (Mandate Pass 10, Section 14)
      if (window.HortOpsStorage && window.HortOpsStorage.prepareWorkspaceJsonImport) {
        var prepRes = window.HortOpsStorage.prepareWorkspaceJsonImport(jsonText);
        if (!prepRes.success) {
          throw new Error(prepRes.error);
        }
        if (errEl) errEl.style.display = 'none';
        this.pendingJsonBackup = prepRes.data;
        this.backupMigrated = prepRes.migrated;
        this.backupSourceVersion = prepRes.sourceSchemaVersion;
        this.currentDiff = null;
        this.renderModal();
        return;
      }

      var parsed = JSON.parse(jsonText);
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
        throw new Error('Workspace backup root must be a valid JSON object.');
      }
      var sourceVersion = parsed.schemaVersion;
      if (sourceVersion === undefined || sourceVersion === null || typeof sourceVersion !== 'number' || !Number.isInteger(sourceVersion)) {
        throw new Error('Workspace backup missing or invalid integer schemaVersion: ' + sourceVersion);
      }
      if (sourceVersion !== 1 && sourceVersion !== 2) {
        throw new Error('Unsupported workspace schema version ' + sourceVersion + '. This version of the planner supports Schema 1 and Schema 2 only.');
      }
      if (sourceVersion === 1 && window.HortOpsStorage && window.HortOpsStorage.migrateWorkspaceV1toV2) {
        parsed = window.HortOpsStorage.migrateWorkspaceV1toV2(parsed);
      }
      if (window.HortOpsStorage && window.HortOpsStorage.validateWorkspaceSchema) {
        var valRes = window.HortOpsStorage.validateWorkspaceSchema(parsed);
        if (!valRes.valid) throw new Error(valRes.error);
      }
      if (errEl) errEl.style.display = 'none';
      this.pendingJsonBackup = parsed;
      this.backupMigrated = (sourceVersion === 1);
      this.backupSourceVersion = sourceVersion;
      this.currentDiff = null;
      this.renderModal();
    } catch(e) {
      this.pendingJsonBackup = null;
      if (errEl) {
        errEl.style.display = 'block';
        errEl.innerHTML = '<strong>JSON Backup Error:</strong><br/>' + esc(e.message || String(e));
      }
      this.renderModal();
    }
  },

  processCsvContent: function(csvText) {
    var currentRoster = window.HortOpsApp.state.staffList || [];
    var customAssignments = window.HortOpsApp.state.customAssignments || {};
    var allShifts = window.HortOpsApp.state.allShifts || [];

    var parsedResult = window.HortOpsUserCsvParser.parseUserCsv(csvText, currentRoster);

    var errEl = document.getElementById('import-error-area');
    var esc = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtml) || function(s) { return s || ''; };
    if (!parsedResult.success) {
      if (errEl) {
        errEl.style.display = 'block';
        errEl.innerHTML = '<strong>Parsing Errors:</strong><br/>' + (parsedResult.errors || []).map(esc).join('<br/>');
      }
      this.currentDiff = null;
      this.pendingJsonBackup = null;
    this.renderModal();
      return;
    }

    if (errEl) errEl.style.display = 'none';

    var diff = window.HortOpsReconciliationEngine.computeWorkforceReconciliation(
      currentRoster,
      parsedResult.staff,
      customAssignments,
      allShifts
    );

    this.currentDiff = diff;
    this.pendingJsonBackup = null;
    this.activeTab = 'overview';
    this.renderModal();
  },

  confirmSync: function() {
    if (!this.currentDiff) return;
    var res = window.HortOpsApp.reconcileStaffSnapshot(this.currentDiff);
    if (res && !res.success) {
      alert('Workforce synchronization failed: ' + (res.error || 'Storage error. Roster unchanged.'));
      return;
    }
    var added = this.currentDiff.added.length;
    var updated = this.currentDiff.updated.length;
    var departed = this.currentDiff.departed.length;
    this.close();
    alert('Workforce synchronized successfully:\n' +
      '+ ' + added + ' added\n' +
      '* ' + updated + ' updated\n' +
      '- ' + departed + ' marked departed');
  },

  confirmJsonRestore: function() {
    if (!this.pendingJsonBackup) return;
    if (!window.confirm("Warning: Restoring this JSON workspace backup will replace your current jobs, personnel roster, shift assignments, and permit states. Are you sure you want to proceed?")) {
      return;
    }
    var success = window.HortOpsApp.restoreWorkspaceJson(this.pendingJsonBackup);
    this.close();
    if (success) {
      alert('Workspace successfully restored from backup.');
    } else {
      alert('Error: Failed to restore workspace. Storage persistence failed or state is invalid.');
    }
  }
};
</script>

/* === INLINED: js/components/staffExemptionModal.js === */
// Standalone Offline - Staff Overtime Exemption Modal Component
window.HortOpsStaffExemptionModal = {
  activeStaff: null,

  open: function(staffId) {
    var state = window.HortOpsApp.state;
    var staff = (state.staffList || []).find(function(s) { return s.id === staffId; });
    if (!staff) return;

    // Clone staff data for editing
    this.activeStaff = {
      id: staff.id,
      name: staff.name,
      department: staff.department,
      team: staff.team,
      crew: staff.crew,
      role: staff.role,
      avatarColor: staff.avatarColor,
      isOvertimeExempt: !!staff.isOvertimeExempt,
      exemptionStartDate: staff.exemptionStartDate || '',
      exemptionEndDate: staff.exemptionEndDate || '',
      exemptionReason: staff.exemptionReason || ''
    };

    if (window.HortOpsModalUtils) window.HortOpsModalUtils.lockBackgroundScroll();
    this.render();
  },

  close: function() {
    this.activeStaff = null;
    var root = document.getElementById('staff-exemption-modal-root');
    if (root) root.innerHTML = '';
    if (window.HortOpsModalUtils) window.HortOpsModalUtils.unlockBackgroundScroll();
  },

  toggleExempt: function(checked) {
    if (!this.activeStaff) return;
    this.activeStaff.isOvertimeExempt = checked;
    var toggle = document.getElementById('exemption-toggle');
    if (toggle && toggle.checked !== checked) {
      toggle.checked = checked;
    }
    var dateSection = document.getElementById('exemption-dates-section');
    if (dateSection) {
      dateSection.style.opacity = checked ? '1' : '0.4';
      dateSection.style.pointerEvents = checked ? 'auto' : 'none';
    }
  },

  setPreset: function(days) {
    if (!this.activeStaff) return;
    var startInput = document.getElementById('exemption-start-date');
    var endInput = document.getElementById('exemption-end-date');

    if (days === 'clear') {
      if (startInput) startInput.value = '';
      if (endInput) endInput.value = '';
      this.activeStaff.exemptionStartDate = '';
      this.activeStaff.exemptionEndDate = '';
      return;
    }

    var toggle = document.getElementById('exemption-toggle');
    if (toggle && !toggle.checked) {
      toggle.checked = true;
      this.toggleExempt(true);
    }

    var now = new Date();
    var sStr = (window.HortOpsDateUtils && typeof window.HortOpsDateUtils.getLocalDateKey === 'function')
      ? window.HortOpsDateUtils.getLocalDateKey(now)
      : now.toISOString().split('T')[0];

    if (days === 'indefinite') {
      if (startInput) startInput.value = sStr;
      if (endInput) endInput.value = '';
      this.activeStaff.exemptionStartDate = sStr;
      this.activeStaff.exemptionEndDate = '';
      return;
    }

    var endDateObj = new Date(now.getTime() + days * 24 * 60 * 60 * 1000);
    var eStr = (window.HortOpsDateUtils && typeof window.HortOpsDateUtils.getLocalDateKey === 'function')
      ? window.HortOpsDateUtils.getLocalDateKey(endDateObj)
      : endDateObj.toISOString().split('T')[0];

    if (startInput) startInput.value = sStr;
    if (endInput) endInput.value = eStr;
    this.activeStaff.exemptionStartDate = sStr;
    this.activeStaff.exemptionEndDate = eStr;
  },

  save: function() {
    if (!this.activeStaff) return;

    var toggle = document.getElementById('exemption-toggle');
    var startInput = document.getElementById('exemption-start-date');
    var endInput = document.getElementById('exemption-end-date');
    var reasonInput = document.getElementById('exemption-reason');

    var isExempt = toggle ? toggle.checked : this.activeStaff.isOvertimeExempt;
    var startDate = startInput ? startInput.value.trim() : this.activeStaff.exemptionStartDate;
    var endDate = endInput ? endInput.value.trim() : this.activeStaff.exemptionEndDate;
    var reason = reasonInput ? reasonInput.value.trim() : this.activeStaff.exemptionReason;

    // Validate date sequence if both set
    if (startDate && endDate && startDate > endDate) {
      alert('Start date cannot be after end date.');
      return;
    }

    var updated = {
      id: this.activeStaff.id,
      isOvertimeExempt: isExempt,
      exemptionStartDate: isExempt ? startDate : '',
      exemptionEndDate: isExempt ? endDate : '',
      exemptionReason: isExempt ? reason : ''
    };

    var res = window.HortOpsApp.updateStaffMember(updated);
    if (res && !res.success) {
      if (typeof alert === 'function') alert('Failed to update staff member: ' + (res.error || 'Storage error'));
      return;
    }
    this.close();
  },

  render: function() {
    var root = document.getElementById('staff-exemption-modal-root');
    if (!root) {
      root = document.createElement('div');
      root.id = 'staff-exemption-modal-root';
      document.body.appendChild(root);
    }

    var staff = this.activeStaff;
    if (!staff) {
      root.innerHTML = '';
      return;
    }

    var icons = window.HortOpsIcons;
    var isExempt = staff.isOvertimeExempt;

    var esc = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtml) || function(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    };
    var escAttr = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtmlAttr) || esc;

    var html = 
      '<div class="modal-overlay" onclick="if(event.target === this) window.HortOpsStaffExemptionModal.close()">' +
        '<div class="modal-card" style="max-width: 520px; width: 95%;" onclick="event.stopPropagation()">' +
          
          // Header
          '<div class="modal-header" style="background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); padding: 1.25rem 1.5rem; color: #ffffff; display: flex; justify-content: space-between; align-items: flex-start; flex: 0 0 auto;">' +
            '<div>' +
              '<div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem;">' +
                '<span style="background: rgba(255, 255, 255, 0.15); padding: 0.25rem 0.5rem; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;">Overtime Governance</span>' +
                '<span style="background: rgba(255, 255, 255, 0.1); padding: 0.2rem 0.45rem; border-radius: 4px; font-size: 11px;">' + esc(staff.id) + '</span>' +
              '</div>' +
              '<h3 style="margin: 0; font-size: 1.15rem; font-weight: 700; color: #ffffff;">' + esc(staff.name) + '</h3>' +
              '<div style="font-size: 12px; color: #c7d2fe; margin-top: 0.2rem;">' + esc(staff.department) + ' • ' + esc(staff.team) + ' • ' + esc(staff.role) + '</div>' +
            '</div>' +
            '<button class="btn btn-secondary" style="background: rgba(255, 255, 255, 0.1); border: none; color: #ffffff; padding: 0.35rem; border-radius: 6px; cursor: pointer;" onclick="window.HortOpsStaffExemptionModal.close()" title="Close">' +
              (icons ? icons.render('x', 'w-4 h-4') : '✕') +
            '</button>' +
          '</div>' +

          // Body
          '<div class="modal-body" style="padding: 1.25rem 1.5rem; background: #ffffff;">' +
            
            // Toggle Switch (Repaired interactive toggle control)
            '<div style="display: flex; align-items: center; justify-content: space-between; padding: 0.9rem 1rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 1.25rem;">' +
              '<div>' +
                '<div style="font-weight: 700; font-size: 13px; color: #0f172a;">Exempt from Weekend Overtime</div>' +
                '<div style="font-size: 11px; color: #64748b; margin-top: 0.15rem;">Staff will be excluded from the candidate pool in Crew Allocator</div>' +
              '</div>' +
              '<label class="toggle-switch" title="Toggle Overtime Exemption">' +
                '<input type="checkbox" id="exemption-toggle" ' + (isExempt ? 'checked' : '') + ' onchange="window.HortOpsStaffExemptionModal.toggleExempt(this.checked)" />' +
                '<span class="toggle-switch-slider"></span>' +
              '</label>' +
            '</div>' +

            // Date Range Section
            '<div id="exemption-dates-section" style="opacity: ' + (isExempt ? '1' : '0.4') + '; pointer-events: ' + (isExempt ? 'auto' : 'none') + '; transition: opacity 0.2s;">' +
              
              // Preset buttons
              '<div style="margin-bottom: 1rem;">' +
                '<div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 0.4rem; letter-spacing: 0.05em;">Quick Window Presets</div>' +
                '<div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">' +
                  '<button type="button" class="btn btn-secondary" style="padding: 0.25rem 0.55rem; font-size: 11px; font-weight: 600;" onclick="window.HortOpsStaffExemptionModal.setPreset(30)">Next 30 Days</button>' +
                  '<button type="button" class="btn btn-secondary" style="padding: 0.25rem 0.55rem; font-size: 11px; font-weight: 600;" onclick="window.HortOpsStaffExemptionModal.setPreset(90)">Next 90 Days</button>' +
                  '<button type="button" class="btn btn-secondary" style="padding: 0.25rem 0.55rem; font-size: 11px; font-weight: 600;" onclick="window.HortOpsStaffExemptionModal.setPreset(\'indefinite\')">Permanent / Indefinite</button>' +
                '</div>' +
              '</div>' +

              // Date inputs
              '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">' +
                '<div>' +
                  '<label style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 0.3rem;">Start Date (Optional)</label>' +
                  '<input type="date" id="exemption-start-date" class="form-input" style="width: 100%; font-size: 12px;" value="' + escAttr(staff.exemptionStartDate || '') + '" />' +
                  '<span style="display: block; font-size: 10px; color: #94a3b8; margin-top: 0.2rem;">Leave blank for immediate</span>' +
                '</div>' +
                '<div>' +
                  '<label style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 0.3rem;">End Date (Optional)</label>' +
                  '<input type="date" id="exemption-end-date" class="form-input" style="width: 100%; font-size: 12px;" value="' + escAttr(staff.exemptionEndDate || '') + '" />' +
                  '<span style="display: block; font-size: 10px; color: #94a3b8; margin-top: 0.2rem;">Leave blank for indefinite</span>' +
                '</div>' +
              '</div>' +

              // Reason
              '<div style="margin-bottom: 1rem;">' +
                '<label style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 0.3rem;">Reason / Governance Notes</label>' +
                '<input type="text" id="exemption-reason" class="form-input" style="width: 100%; font-size: 12px;" placeholder="e.g. Medical restriction, Study leave, Personal opt-out..." value="' + escAttr(staff.exemptionReason || '') + '" />' +
              '</div>' +

              // Explanatory Banner
              '<div style="background: #fdf4ff; border: 1px solid #f0abfc; border-radius: 8px; padding: 0.75rem 0.9rem; font-size: 11px; color: #701a75; display: flex; align-items: flex-start; gap: 0.5rem;">' +
                '<span style="font-weight: 700; font-size: 13px;">ℹ️</span>' +
                '<div>' +
                  '<strong>Exemption Enforcement:</strong> When active, this employee will be suppressed from the candidate pool in the Crew Allocator for any shifts occurring within the specified date window.' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +

          // Footer
          '<div class="modal-footer" style="padding: 0.9rem 1.5rem; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 0.5rem; flex: 0 0 auto;">' +
            '<button type="button" class="btn btn-secondary" onclick="window.HortOpsStaffExemptionModal.close()">Cancel</button>' +
            '<button type="button" class="btn btn-primary" style="background: #7c3aed; border-color: #6d28d9;" onclick="window.HortOpsStaffExemptionModal.save()">Save Exemption</button>' +
          '</div>' +

        '</div>' +
      '</div>';

    root.innerHTML = html;
  }
};

</script>

/* === INLINED: js/components/warningsModal.js === */
// Operational Warnings Modal Component
// Displays active schedule conflicts, missing plant operator certifications, and slot collisions with quick-action links.

window.HortOpsWarningsModal = {
  activeFilter: 'all',

  open: function() {
    if (window.HortOpsModalUtils) window.HortOpsModalUtils.lockBackgroundScroll();
    this.activeFilter = 'all';
    this.renderModal();
  },

  close: function() {
    var el = document.getElementById('warnings-modal-root');
    if (el) el.innerHTML = '';
    if (window.HortOpsModalUtils) window.HortOpsModalUtils.unlockBackgroundScroll();
  },

  setFilter: function(category) {
    this.activeFilter = category;
    this.renderModal();
  },

  renderModal: function() {
    var el = document.getElementById('warnings-modal-root');
    if (!el) return;

    var state = (window.HortOpsApp && window.HortOpsApp.state) ? window.HortOpsApp.state : {};
    var warnings = (window.HortOpsWarningUtils && typeof window.HortOpsWarningUtils.getWarnings === 'function')
      ? window.HortOpsWarningUtils.getWarnings(state)
      : [];

    var icons = window.HortOpsIcons;
    var esc = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtml)
      ? window.HortOpsSecurityUtils.escapeHtml
      : function(str) { return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
    var escAttr = (window.HortOpsSecurityUtils && window.HortOpsSecurityUtils.escapeHtmlAttr)
      ? window.HortOpsSecurityUtils.escapeHtmlAttr
      : esc;

    var totalCount = warnings.length;
    var certCount = warnings.filter(function(w) { return w.category === 'Certification'; }).length;
    var crewCount = warnings.filter(function(w) { return w.category === 'Crew Integrity' || w.category === 'Eligibility'; }).length;
    var slotCount = warnings.filter(function(w) { return w.category === 'Slot Collision'; }).length;
    var rosterCount = warnings.filter(function(w) { return w.category === 'Rostering'; }).length;
    var persistCount = warnings.filter(function(w) { return w.category === 'Persistence' || w.category === 'System'; }).length;

    var filtered = warnings;
    if (this.activeFilter === 'certification') {
      filtered = warnings.filter(function(w) { return w.category === 'Certification'; });
    } else if (this.activeFilter === 'crew') {
      filtered = warnings.filter(function(w) { return w.category === 'Crew Integrity' || w.category === 'Eligibility'; });
    } else if (this.activeFilter === 'slot') {
      filtered = warnings.filter(function(w) { return w.category === 'Slot Collision'; });
    } else if (this.activeFilter === 'rostering') {
      filtered = warnings.filter(function(w) { return w.category === 'Rostering'; });
    } else if (this.activeFilter === 'persistence') {
      filtered = warnings.filter(function(w) { return w.category === 'Persistence' || w.category === 'System'; });
    }

    // Filter pills HTML
    var filterPillsHtml = '<div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem;">' +
      '<button class="warning-filter-pill ' + (this.activeFilter === 'all' ? 'active' : '') + '" onclick="window.HortOpsWarningsModal.setFilter(\'all\')">' +
        'All Issues (' + totalCount + ')' +
      '</button>' +
      '<button class="warning-filter-pill ' + (this.activeFilter === 'certification' ? 'active' : '') + '" onclick="window.HortOpsWarningsModal.setFilter(\'certification\')">' +
        'Plant Operator (' + certCount + ')' +
      '</button>' +
      '<button class="warning-filter-pill ' + (this.activeFilter === 'crew' ? 'active' : '') + '" onclick="window.HortOpsWarningsModal.setFilter(\'crew\')">' +
        'Crew & Eligibility (' + crewCount + ')' +
      '</button>' +
      '<button class="warning-filter-pill ' + (this.activeFilter === 'slot' ? 'active' : '') + '" onclick="window.HortOpsWarningsModal.setFilter(\'slot\')">' +
        'Slot Collisions (' + slotCount + ')' +
      '</button>' +
      (rosterCount > 0 ? ('<button class="warning-filter-pill ' + (this.activeFilter === 'rostering' ? 'active' : '') + '" onclick="window.HortOpsWarningsModal.setFilter(\'rostering\')">' +
        'Rostering (' + rosterCount + ')' +
      '</button>') : '') +
      (persistCount > 0 ? ('<button class="warning-filter-pill ' + (this.activeFilter === 'persistence' ? 'active' : '') + '" onclick="window.HortOpsWarningsModal.setFilter(\'persistence\')">' +
        'Persistence (' + persistCount + ')' +
      '</button>') : '') +
    '</div>';

    // Warnings list HTML
    var warningsListHtml = '';

          var actionBtnHtml = '';
          if (w.shiftId) {
            actionBtnHtml = '<button class="btn btn-secondary" style="padding: 0.3rem 0.65rem; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 0.35rem; flex-shrink: 0;" onclick="window.HortOpsWarningsModal.close(); window.HortOpsApp.openStaffAssignModal(\'' + escAttr(w.shiftId) + '\')">' +

          return '<div style="border: 1px solid var(--slate-200); border-left: 4px solid ' + borderColor + '; border-radius: 6px; padding: 0.75rem 0.85rem; background: #ffffff; display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; box-shadow: 0 1px 2px rgba(0,0,0,0.03);">' +
            '<div style="overflow: hidden; flex: 1;">' +
              '<div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; flex-wrap: wrap;">' +
                '<span class="badge" style="font-size: 10px; font-weight: 700; background: ' + badgeBg + '; color: ' + badgeColor + '; border: 1px solid ' + badgeBorder + '; display: inline-flex; align-items: center; gap: 0.25rem;">' +
                  icons.render(iconName, 'w-3 h-3') + esc(w.category) +

                (w.date ? ('<span style="font-size: 11px; font-weight: 600; color: var(--slate-600); font-family: var(--font-mono);">' + esc(w.date) + (w.time ? ' • ' + esc(w.time) : '') + '</span>') : '') +
              '</div>' +
              '<div style="font-weight: 700; font-size: 13px; color: var(--slate-900); margin-bottom: 0.25rem;">' +
                esc(w.title) +
              '</div>' +
              '<div style="font-size: 12px; color: var(--slate-600); line-height: 1.4;">' +
                esc(w.message) +
              '</div>' +
            '</div>' +
            actionBtnHtml +

        }).join('') +
      '</div>';
    }

    var modalHtml = '<div class="modal-overlay" onclick="if(event.target === this) window.HortOpsWarningsModal.close()">' +
      '<div class="modal-card modal-lg" style="max-width: 720px;">' +
        '<div class="modal-header" style="display: flex; align-items: center; justify-content: space-between;">' +
          '<div style="display: flex; align-items: center; gap: 0.5rem;">' +
            '<div style="width: 32px; height: 32px; border-radius: 6px; background: #fffbeb; border: 1px solid #fcd34d; display: flex; align-items: center; justify-content: center; color: #d97706;">' +
              icons.render('alertTriangle', 'w-5 h-5') +
            '</div>' +
            '<div>' +
              '<h2 style="font-size: 16px; font-weight: 800; color: var(--slate-900); margin: 0; display: flex; align-items: center; gap: 0.5rem;">' +
                'Operational Warnings & Alerts' +
                '<span class="badge badge-amber" style="font-size: 11px; padding: 2px 6px;">' + totalCount + ' Issue' + (totalCount !== 1 ? 's' : '') + '</span>' +
              '</h2>' +
              '<div style="font-size: 11px; color: var(--slate-500); margin-top: 1px;">Live schedule integrity, plant operator certifications, and slot collision diagnostics.</div>' +
            '</div>' +
          '</div>' +
          '<button class="btn btn-secondary" style="padding: 0.25rem 0.4rem;" onclick="window.HortOpsWarningsModal.close()" title="Close">' +
            icons.render('x', 'w-4 h-4') +

        '</div>' +

        '<div class="modal-body" style="padding: 1rem 1.25rem;">' +

        '<div class="modal-footer" style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.25rem; background: var(--slate-50); border-top: 1px solid var(--slate-200); border-radius: 0 0 8px 8px;">' +
          '<span style="font-size: 12px; color: var(--slate-500);">' +

          '</span>' +
